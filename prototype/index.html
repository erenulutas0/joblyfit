<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İşe Uygun — Prototip</title>
<style>
/* ============================================================
   TOKENS
   Tek doygun renk grubu = şart durumları. Gövde monokroma yakın.
   unknown bilerek MAVİ (bilgi/davet), amber DEĞİL (uyarı olurdu).
   ============================================================ */
:root{
  --paper:#F4F6F6; --surface:#FFFFFF; --surface-2:#FAFBFB;
  --ink:#14191D; --ink-2:#3B4750; --muted:#66757C;
  --line:#DFE5E5; --line-strong:#C6D0D0;
  --brand:#0F3D3E; --brand-2:#155152; --brand-soft:#E6EFEE;
  --met:#0E7A4F; --met-bg:#E4F3EB; --met-line:#B6DEC9;
  --unmet:#AF3A2E; --unmet-bg:#FAEAE7; --unmet-line:#EFC4BD;
  --unknown:#2563A8; --unknown-bg:#E7F0FA; --unknown-line:#BCD3EC;
  --shadow:0 1px 2px rgba(20,25,29,.05), 0 8px 24px -12px rgba(20,25,29,.18);
  --shadow-lg:0 2px 4px rgba(20,25,29,.06), 0 24px 48px -20px rgba(20,25,29,.28);
  --r:10px; --r-lg:16px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:ui-serif,Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --maxw:1120px;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0D1212; --surface:#151D1D; --surface-2:#111818;
    --ink:#E9EFEE; --ink-2:#C3CFCE; --muted:#8B9C9B;
    --line:#253030; --line-strong:#33403F;
    --brand:#7CBDB6; --brand-2:#93CCC5; --brand-soft:#16302F;
    --met:#5FC496; --met-bg:#11291F; --met-line:#22563C;
    --unmet:#EF8F81; --unmet-bg:#2C1714; --unmet-line:#5C2A22;
    --unknown:#7FB4EC; --unknown-bg:#131F2E; --unknown-line:#24405F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lg:0 2px 4px rgba(0,0,0,.5), 0 24px 48px -20px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0D1212; --surface:#151D1D; --surface-2:#111818;
  --ink:#E9EFEE; --ink-2:#C3CFCE; --muted:#8B9C9B;
  --line:#253030; --line-strong:#33403F;
  --brand:#7CBDB6; --brand-2:#93CCC5; --brand-soft:#16302F;
  --met:#5FC496; --met-bg:#11291F; --met-line:#22563C;
  --unmet:#EF8F81; --unmet-bg:#2C1714; --unmet-line:#5C2A22;
  --unknown:#7FB4EC; --unknown-bg:#131F2E; --unknown-line:#24405F;
}
:root[data-theme="light"]{
  --paper:#F4F6F6; --surface:#FFFFFF; --surface-2:#FAFBFB;
  --ink:#14191D; --ink-2:#3B4750; --muted:#66757C;
  --line:#DFE5E5; --line-strong:#C6D0D0;
  --brand:#0F3D3E; --brand-2:#155152; --brand-soft:#E6EFEE;
  --met:#0E7A4F; --met-bg:#E4F3EB; --met-line:#B6DEC9;
  --unmet:#AF3A2E; --unmet-bg:#FAEAE7; --unmet-line:#EFC4BD;
  --unknown:#2563A8; --unknown-bg:#E7F0FA; --unknown-line:#BCD3EC;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font:400 17px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,h4{margin:0; text-wrap:balance; line-height:1.2; font-weight:650; letter-spacing:-.011em}
p{margin:0}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
a{color:inherit}
input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important}}

.wrap{max-width:var(--maxw); margin:0 auto; padding:0 20px}
.mono{font-family:var(--mono); font-size:.78em; letter-spacing:.01em}
.muted{color:var(--muted)}
.stack{display:flex; flex-direction:column}
.row{display:flex; align-items:center}
.gap-4{gap:4px}.gap-6{gap:6px}.gap-8{gap:8px}.gap-10{gap:10px}.gap-12{gap:12px}
.gap-16{gap:16px}.gap-20{gap:20px}.gap-24{gap:24px}.gap-32{gap:32px}
.wrapf{flex-wrap:wrap}.grow{flex:1}.center{justify-content:center}.between{justify-content:space-between}
.hide{display:none !important}
.eyebrow{
  font-family:var(--mono); font-size:12px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--muted);
}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 18px; border-radius:var(--r); font-weight:600; font-size:16px;
  border:1px solid transparent; transition:background .15s, border-color .15s, transform .06s;
  text-decoration:none; white-space:nowrap;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand); color:#fff}
:root[data-theme="dark"] .btn-primary,
@media (prefers-color-scheme: dark){.btn-primary{color:#0D1212}}
.btn-primary{color:var(--surface)}
@media (prefers-color-scheme: dark){.btn-primary{color:#0B1010}}
:root[data-theme="dark"] .btn-primary{color:#0B1010}
:root[data-theme="light"] .btn-primary{color:#fff}
.btn-primary:hover{background:var(--brand-2)}
.btn-ghost{border-color:var(--line-strong); background:var(--surface)}
.btn-ghost:hover{border-color:var(--brand); color:var(--brand)}
.btn-quiet{padding:8px 12px; font-size:15px; color:var(--muted)}
.btn-quiet:hover{color:var(--ink); background:var(--surface-2)}
.btn-sm{padding:8px 14px; font-size:15px}
.btn-block{width:100%}
.btn[aria-pressed="true"]{background:var(--brand-soft); border-color:var(--brand); color:var(--brand)}

/* ---------- surfaces ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg)}
.pad{padding:20px}
.pad-lg{padding:28px}

/* ---------- status system (the product's core) ---------- */
.pill{
  display:inline-flex; align-items:center; gap:6px; padding:4px 10px;
  border-radius:999px; font-size:13px; font-weight:600; border:1px solid;
  white-space:nowrap;
}
.pill-met{color:var(--met); background:var(--met-bg); border-color:var(--met-line)}
.pill-unmet{color:var(--unmet); background:var(--unmet-bg); border-color:var(--unmet-line)}
.pill-unknown{color:var(--unknown); background:var(--unknown-bg); border-color:var(--unknown-line)}
.pill-plain{color:var(--muted); background:var(--surface-2); border-color:var(--line)}
.pill-brand{color:var(--brand); background:var(--brand-soft); border-color:var(--brand)}

.mark{
  width:22px; height:22px; border-radius:6px; display:grid; place-items:center;
  font-size:13px; font-weight:800; flex:none; border:1px solid;
}
.mark-met{color:var(--met); background:var(--met-bg); border-color:var(--met-line)}
.mark-unmet{color:var(--unmet); background:var(--unmet-bg); border-color:var(--unmet-line)}
.mark-unknown{color:var(--unknown); background:var(--unknown-bg); border-color:var(--unknown-line); border-style:dashed}

/* requirement ledger */
.ledger{display:grid; gap:14px}
@media(min-width:900px){ .ledger{grid-template-columns:repeat(3,1fr); align-items:start} }
.led-col{border:1px solid var(--line); border-radius:var(--r); background:var(--surface-2); overflow:hidden}
.led-head{padding:12px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px}
.led-body{padding:6px 14px 14px}
.led-item{display:flex; gap:10px; padding:10px 0; border-bottom:1px dashed var(--line)}
.led-item:last-child{border-bottom:0}
.led-item .t{font-size:15.5px; line-height:1.4}
.led-item .why{font-size:13.5px; color:var(--muted); margin-top:3px}
.col-unknown{border-style:dashed; border-color:var(--unknown-line); background:var(--unknown-bg)}
:root[data-theme="dark"] .col-unknown, @media(prefers-color-scheme:dark){.col-unknown{background:var(--unknown-bg)}}
.link-act{
  color:var(--unknown); font-weight:600; font-size:13.5px; background:none;
  border:0; padding:0; text-decoration:underline; text-underline-offset:3px; cursor:pointer;
}

/* ---------- app chrome ---------- */
.topbar{
  position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--line);
}
.topbar .inner{display:flex; align-items:center; gap:16px; height:62px}
.brandmark{display:flex; align-items:center; gap:9px; font-weight:700; letter-spacing:-.02em; font-size:17px}
.brandmark .glyph{
  width:26px; height:26px; border-radius:7px; background:var(--brand);
  display:grid; place-items:center; color:var(--surface); font-family:var(--mono);
  font-size:13px; font-weight:700; flex:none;
}
:root[data-theme="dark"] .brandmark .glyph{color:#0B1010}
@media(prefers-color-scheme:dark){.brandmark .glyph{color:#0B1010}}
:root[data-theme="light"] .brandmark .glyph{color:#fff}
.navlinks{display:none; gap:2px; margin-left:8px}
@media(min-width:880px){ .navlinks{display:flex} }
.navlink{padding:8px 12px; border-radius:8px; font-size:15.5px; font-weight:550; color:var(--muted)}
.navlink:hover{background:var(--surface-2); color:var(--ink)}
.navlink.on{color:var(--brand); background:var(--brand-soft)}

.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:50; display:grid;
  grid-template-columns:repeat(4,1fr); background:var(--surface);
  border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom);
}
@media(min-width:880px){ .tabbar{display:none} }
.tab{display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 4px 8px; font-size:11.5px; color:var(--muted); font-weight:550}
.tab.on{color:var(--brand)}
.tab .ic{font-size:18px; line-height:1}
body.has-tabbar{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
@media(min-width:880px){ body.has-tabbar{padding-bottom:0} }

/* ---------- landing ---------- */
.hero{padding:64px 0 40px}
@media(min-width:880px){ .hero{padding:92px 0 56px} }
.hero h1{
  font-family:var(--serif); font-weight:600; letter-spacing:-.02em;
  font-size:clamp(34px,6.2vw,60px); line-height:1.06; max-width:16ch;
}
.hero .lede{font-size:clamp(17px,2.2vw,21px); color:var(--ink-2); max-width:56ch; margin-top:20px}
.hero-actions{display:flex; gap:12px; flex-wrap:wrap; margin-top:28px}
.hero-note{margin-top:14px; font-size:14px; color:var(--muted)}
.section{padding:56px 0; border-top:1px solid var(--line)}
.section h2{font-family:var(--serif); font-weight:600; font-size:clamp(24px,3.4vw,32px)}
.grid3{display:grid; gap:16px; margin-top:26px}
@media(min-width:760px){ .grid3{grid-template-columns:repeat(3,1fr)} }
.step-n{font-family:var(--mono); font-size:12px; color:var(--brand); font-weight:700}
.occ-chip{
  display:inline-flex; align-items:center; gap:8px; padding:9px 14px; border-radius:999px;
  border:1px solid var(--line-strong); background:var(--surface); font-size:15px; font-weight:550;
}
.occ-chip .cl{font-family:var(--mono); font-size:11px; color:var(--muted)}
.footer{border-top:1px solid var(--line); padding:32px 0 44px; color:var(--muted); font-size:14px}

/* ---------- forms ---------- */
.field{display:flex; flex-direction:column; gap:7px}
.label{font-size:14px; font-weight:600; color:var(--ink-2)}
.hint{font-size:13px; color:var(--muted)}
.input, .select{
  width:100%; padding:12px 13px; border-radius:var(--r); border:1px solid var(--line-strong);
  background:var(--surface); font-size:16px;
}
.input:focus,.select:focus{border-color:var(--brand); outline:none; box-shadow:0 0 0 3px var(--brand-soft)}
.acc{border:1px solid var(--line); border-radius:var(--r); background:var(--surface); overflow:hidden}
.acc + .acc{margin-top:10px}
.acc-head{width:100%; display:flex; align-items:center; gap:12px; padding:16px; text-align:left}
.acc-head:hover{background:var(--surface-2)}
.acc-body{padding:0 16px 18px; display:flex; flex-direction:column; gap:16px}
.chev{margin-left:auto; color:var(--muted); transition:transform .18s}
.acc.open .chev{transform:rotate(90deg)}
.choice{
  display:flex; gap:14px; padding:18px; border:1px solid var(--line-strong); border-radius:var(--r-lg);
  background:var(--surface); text-align:left; width:100%; transition:border-color .15s, box-shadow .15s;
}
.choice:hover{border-color:var(--brand); box-shadow:var(--shadow)}
.choice .ic{
  width:40px; height:40px; border-radius:11px; background:var(--brand-soft); color:var(--brand);
  display:grid; place-items:center; font-size:19px; flex:none;
}
.seg{display:inline-flex; border:1px solid var(--line-strong); border-radius:999px; overflow:hidden; background:var(--surface)}
.seg button{padding:9px 15px; font-size:14.5px; font-weight:550; color:var(--muted)}
.seg button.on{background:var(--brand); color:#fff}
:root[data-theme="dark"] .seg button.on{color:#0B1010}
@media(prefers-color-scheme:dark){.seg button.on{color:#0B1010}}
:root[data-theme="light"] .seg button.on{color:#fff}
.switch{
  width:44px; height:26px; border-radius:999px; background:var(--line-strong); position:relative;
  transition:background .18s; flex:none;
}
.switch::after{content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .18s; box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-checked="true"]{background:var(--brand)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

/* ---------- job card ---------- */
.jobcard{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:18px; display:flex; flex-direction:column; gap:12px; width:100%; text-align:left;
  transition:border-color .15s, box-shadow .15s;
}
.jobcard:hover{border-color:var(--line-strong); box-shadow:var(--shadow)}
.jobcard h3{font-size:18.5px; font-weight:650; line-height:1.3}
.metaline{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:14.5px; color:var(--ink-2)}
.srcline{
  display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; padding-top:11px;
  border-top:1px dashed var(--line); font-family:var(--mono); font-size:12px; color:var(--muted);
}
.band{display:inline-flex; align-items:center; gap:7px; font-weight:650; font-size:14.5px}
.band .bars{display:inline-flex; gap:2px; align-items:flex-end; height:14px}
.band .bars i{width:4px; border-radius:1px; background:var(--line-strong); display:block}
.band .bars i.f{background:var(--brand)}
.band .bars i:nth-child(1){height:6px}.band .bars i:nth-child(2){height:10px}.band .bars i:nth-child(3){height:14px}

.notice{
  display:flex; gap:11px; padding:13px 15px; border-radius:var(--r); font-size:14.5px;
  border:1px solid; line-height:1.45;
}
.notice-unknown{background:var(--unknown-bg); border-color:var(--unknown-line); color:var(--unknown)}
.notice-unmet{background:var(--unmet-bg); border-color:var(--unmet-line); color:var(--unmet)}
.notice-plain{background:var(--surface-2); border-color:var(--line); color:var(--ink-2)}
.notice-brand{background:var(--brand-soft); border-color:var(--brand); color:var(--brand)}
.notice b{font-weight:700}

.filters{display:flex; gap:9px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{height:0}
.chip{
  padding:8px 14px; border-radius:999px; border:1px solid var(--line-strong); background:var(--surface);
  font-size:14.5px; font-weight:550; white-space:nowrap; color:var(--ink-2);
}
.chip.on{background:var(--brand); border-color:var(--brand); color:#fff}
:root[data-theme="dark"] .chip.on{color:#0B1010}
@media(prefers-color-scheme:dark){.chip.on{color:#0B1010}}
:root[data-theme="light"] .chip.on{color:#fff}

.empty{text-align:center; padding:56px 24px; display:flex; flex-direction:column; align-items:center; gap:14px}
.empty .glyphbox{width:52px; height:52px; border-radius:14px; background:var(--surface-2); border:1px solid var(--line); display:grid; place-items:center; font-size:22px}
.skel{background:linear-gradient(90deg,var(--surface-2) 25%,var(--line) 37%,var(--surface-2) 63%); background-size:400% 100%; animation:sh 1.3s infinite; border-radius:6px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}

.toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:82px; z-index:200;
  background:var(--ink); color:var(--paper); padding:12px 18px; border-radius:999px;
  font-size:14.5px; font-weight:550; box-shadow:var(--shadow-lg); opacity:0; pointer-events:none;
  transition:opacity .2s, transform .2s; max-width:calc(100vw - 40px); text-align:center;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px)}
@media(min-width:880px){ .toast{bottom:28px} }

.sheet-bg{position:fixed; inset:0; background:rgba(10,14,14,.5); z-index:120; display:grid; place-items:end center; padding:0}
@media(min-width:720px){ .sheet-bg{place-items:center} }
.sheet{
  background:var(--surface); width:100%; max-width:560px; border-radius:20px 20px 0 0;
  padding:24px; max-height:88vh; overflow:auto; box-shadow:var(--shadow-lg);
}
@media(min-width:720px){ .sheet{border-radius:var(--r-lg)} }

.crumb{display:flex; align-items:center; gap:8px; font-size:14.5px; color:var(--muted); padding:16px 0 4px}
.prog{height:4px; background:var(--line); border-radius:999px; overflow:hidden}
.prog i{display:block; height:100%; background:var(--brand); transition:width .3s}
.kv{display:grid; grid-template-columns:auto 1fr; gap:8px 16px; font-size:15px}
.kv dt{font-family:var(--mono); font-size:12px; color:var(--muted); padding-top:3px}
.kv dd{margin:0}
.devnote{
  position:fixed; right:14px; bottom:78px; z-index:60;
}
@media(min-width:880px){ .devnote{bottom:18px} }
.devbtn{
  width:42px; height:42px; border-radius:50%; background:var(--surface); border:1px solid var(--line-strong);
  box-shadow:var(--shadow); display:grid; place-items:center; font-size:17px;
}
</style>
</head>
<body>

<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="devnote"><button class="devbtn" id="devBtn" title="Prototip menüsü" aria-label="Prototip menüsü">⚙</button></div>

<script>
/* ============================================================
   1. SAMPLE DATA — tamamı kurgusaldır.
   İşveren adları, ilanlar ve kişiler gerçek değildir.
   ============================================================ */
const CLUSTERS = {
  log:  {name:"Lojistik & Operasyon", occs:["Şoför","Depo Görevlisi"]},
  off:  {name:"Ofis & Ticaret",       occs:["Muhasebe","Satış Temsilcisi"]},
  hea:  {name:"Sağlık",               occs:["Hemşire","Sağlık Teknikeri"]},
};
const ALL_OCCS = [
  {id:"driver",   label:"Şoför",              cluster:"log", tier:"first"},
  {id:"warehouse",label:"Depo Görevlisi",     cluster:"log", tier:"first"},
  {id:"account",  label:"Muhasebe",           cluster:"off", tier:"first"},
  {id:"sales",    label:"Satış Temsilcisi",   cluster:"off", tier:"first"},
  {id:"nurse",    label:"Hemşire",            cluster:"hea", tier:"first"},
  {id:"htech",    label:"Sağlık Teknikeri",   cluster:"hea", tier:"first"},
  {id:"teacher",  label:"Öğretmen",           cluster:"-",   tier:"limited"},
  {id:"chef",     label:"Aşçı",               cluster:"-",   tier:"limited"},
  {id:"designer", label:"Grafik Tasarımcı",   cluster:"-",   tier:"limited"},
  {id:"dev",      label:"Yazılım Geliştirici",cluster:"-",   tier:"limited"},
  {id:"security", label:"Güvenlik Görevlisi", cluster:"-",   tier:"limited"},
];

const JOBS = [
  {
    id:"j1", occ:"driver", title:"Ağır Vasıta Şoförü (Bölgesel Rota)",
    employer:"Kuzey Hat Lojistik A.Ş.", city:"Kocaeli", district:"Körfez",
    arrangement:"İş yerinde", type:"Tam zamanlı", shift:"Gündüz ağırlıklı",
    salary:"Belirtilmemiş", source:"İşin Olsun", posted:"2 gün önce", checked:"bugün",
    band:"strong", confidence:"med",
    why:["Ehliyet sınıfın ilanın istediğiyle örtüşüyor","6 yıllık bölgesel rota deneyimin var","İlanın konumu tercih ettiğin bölgede"],
    met:[
      {t:"C+E sınıfı ehliyet", why:"Profilinde doğrulanmış olarak kayıtlı"},
      {t:"En az 3 yıl ağır vasıta deneyimi", why:"Profilinde 6 yıl görünüyor"},
      {t:"Bölgesel rota tecrübesi", why:"Son iş kaydınla eşleşiyor"}
    ],
    unmet:[],
    unknown:[
      {t:"SRC-1 mesleki yeterlilik belgesi", why:"Profilinde bu belgeye dair bilgi yok", field:"SRC belgesi"},

const BANDS = {
  strong:{label:"Güçlü eşleşme", bars:3},
  good:{label:"İyi eşleşme", bars:2},
  cond:{label:"Şartlı eşleşme", bars:1},
};
const CONF = {high:"Yüksek", med:"Orta", low:"Düşük"};

/* ============================================================
   2. STATE
   ============================================================ */
const S = {
  screen:"landing",
  jobId:null,
  onboardPath:null,
  occs:["driver"],
  saved:new Set(),
  applied:new Set(),
  dismissed:new Set(),
  verified:new Set(),
  resolved:new Set(),
  cvFile:null, cvStage:null,
  filters:{q:"", arr:"all", city:"all"},
  savedTab:"saved",
  digest:true,
  demo:null,
  acc:{exp:true, skill:false, edu:false, lic:false, lang:false, pref:false},
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const go = (screen, jobId) => { S.screen=screen; if(jobId!==undefined) S.jobId=jobId; window.scrollTo(0,0); render(); };
let toastT;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2400);
}
function jobById(id){ return JOBS.find(j=>j.id===id); }
function isVerified(field){ return S.verified.has(field); }

function visibleJobs(){
  return JOBS.filter(j=>{
    if(S.dismissed.has(j.id)) return false;
    if(j.expired) return false;
    if(!S.occs.includes(j.occ)) return false;
    const f=S.filters;
    if(f.arr!=="all" && j.arrangement!==f.arr) return false;
    if(f.city!=="all" && j.city!==f.city) return false;
    if(f.q){
      const hay=(j.title+" "+j.employer+" "+j.city+" "+j.district).toLocaleLowerCase("tr");
      if(!hay.includes(f.q.toLocaleLowerCase("tr"))) return false;
    }
    return true;
  });
}
/* unknown listesi: doğrulanan/çözülen alanlar düşer */
function liveUnknown(j){
  if(!j.unknown) return [];
  return j.unknown.filter(u=>{
    if(u.verify) return !isVerified(u.field);
    return !S.resolved.has(u.field);
  });
}
function liveMetExtra(j){
  if(!j.unknown) return [];
  return j.unknown.filter(u=> u.verify ? isVerified(u.field) : S.resolved.has(u.field));
}

   3. COMPONENTS
   ============================================================ */
function bandEl(j){
  if(j.publicSector) return `<span class="pill pill-plain">Kamu ilanı · puan üretilmez</span>`;
  const b=BANDS[j.band]||BANDS.good;
  const bars=[1,2,3].map(n=>`<i class="${n<=b.bars?'f':''}"></i>`).join("");
  return `<span class="band"><span class="bars">${bars}</span>${b.label}</span>`;
}
function confEl(j){
  if(j.publicSector) return "";
  return `<span class="pill pill-plain">Güven: ${CONF[j.confidence]}</span>`;
}
function jobCard(j){
  const unk=liveUnknown(j);
  const needVerify=(j.unknown||[]).some(u=>u.verify && !isVerified(u.field));
  return `
  <button class="jobcard" data-open="${j.id}">
    <div class="stack gap-6">
      <div class="row between gap-12" style="align-items:flex-start">
        <h3>${esc(j.title)}</h3>
        ${S.saved.has(j.id)?'<span class="pill pill-brand">Kayıtlı</span>':''}
      </div>
      <div class="metaline">
        <span>${esc(j.employer)}</span>
        <span class="muted">${esc(j.district)}, ${esc(j.city)}</span>
        <span class="muted">${esc(j.arrangement)}</span>
      </div>
    </div>
    <div class="row gap-10 wrapf">${bandEl(j)}${confEl(j)}</div>
    ${needVerify?`<div class="notice notice-unknown"><span>🔒</span><span><b>Belge doğrulaması gerekiyor.</b> Bu ilanın zorunlu belgesi profilinde doğrulanmadığı için eşleşme kesinleşmedi.</span></div>`:""}
    ${(!needVerify&&unk.length)?`<div class="notice notice-unknown"><span>?</span><span><b>${unk.length} şart değerlendirilemedi</b> — profilinde bu bilgi yok.</span></div>`:""}
    ${j.publicSector?`<div class="notice notice-plain"><span>ℹ</span><span>Kamu ilanı. Şartlar ve sınav bilgisi resmî kaynakta — burada uygunluk değerlendirmesi yapılmaz.</span></div>`:""}
    <div class="srcline">
      <span>Kaynak: ${esc(j.source)}</span><span>·</span>
      <span>${esc(j.posted)}</span><span>·</span>
      <span>son kontrol ${esc(j.checked)}</span>
      ${j.dupCount?`<span>·</span><span>${j.dupCount} kaynakta yayında</span>`:""}
    </div>
  </button>`;
}
function ledger(j){
  const unk=liveUnknown(j);
  const extra=liveMetExtra(j);
  const met=[...(j.met||[]), ...extra.map(u=>({t:u.t, why:u.verify?"Belgeni doğruladın":"Profiline ekledin"}))];
  const unmet=j.unmet||[];
  const col=(kind,title,items,icon,extraHtml)=>`
    <div class="led-col ${kind==='unknown'?'col-unknown':''}">
      <div class="led-head">
        <span class="mark mark-${kind}">${icon}</span>
        <strong style="font-size:15px">${title}</strong>
        <span class="pill pill-${kind}" style="margin-left:auto">${items.length}</span>
      </div>
      <div class="led-body">
        ${items.length?items.map(i=>`
          <div class="led-item">
            <span class="mark mark-${kind}" aria-hidden="true">${icon}</span>
            <div>
              <div class="t">${esc(i.t)}</div>
              <div class="why">${esc(i.why)}</div>
              ${kind==='unknown'?`<button class="link-act" data-fix="${esc(i.field)}" data-verify="${i.verify?1:0}">${i.verify?'Belgeyi doğrula':'Profilime ekle'}</button>`:""}
            </div>
          </div>`).join(""):`<div class="led-item"><div class="why" style="margin:0">Bu grupta madde yok.</div></div>`}
        ${extraHtml||""}
      </div>
    </div>`;
  return `<div class="ledger">
    ${col("met","Karşılanıyor",met,"✓")}
    ${col("unmet","Karşılanmıyor",unmet,"✕")}
    ${col("unknown","Değerlendirilemedi",unk,"?")}
  </div>`;
}

/* ---- CV dosya seçimi: dosya GERÇEKTEN okunur (ad/boyut/tür), tarayıcıdan çıkmaz ---- */
function humanSize(b){
  if(b<1024) return b+" B";
  if(b<1024*1024) return (b/1024).toFixed(0)+" KB";
  return (b/1024/1024).toFixed(1)+" MB";
}
function handleCV(file){
  if(!file) return;
  const isPdf = file.type==="application/pdf" || /\.pdf$/i.test(file.name);
  const tooBig = file.size > 10*1024*1024;
  if(!isPdf){
    S.cvFile={name:file.name, ok:false, err:"PDF değil. Şimdilik yalnızca PDF okuyabiliyoruz."};
    render(); return;
  }
  if(tooBig){
    S.cvFile={name:file.name, ok:false, err:"Dosya 10 MB'tan büyük ("+humanSize(file.size)+")."};
    render(); return;
  }
  // gerçek okuma: dosya tarayıcıda FileReader ile açılır, hiçbir yere gönderilmez
  const fr=new FileReader();
  fr.onload=()=>{
    S.cvFile={name:file.name, ok:true, sizeText:humanSize(file.size), bytes:fr.result.byteLength};
    S.cvStage="reading"; render();
    let p=8; const bar=()=>{ const el=$("#cvbar"); if(!el) return;
      p=Math.min(100,p+Math.random()*22); el.style.width=p+"%";
      if(p<100) setTimeout(bar,180); else setTimeout(()=>{ S.cvStage=null; go("cvreview"); },420); };
    setTimeout(bar,220);
  };
  fr.onerror=()=>{ S.cvFile={name:file.name, ok:false, err:"Dosya okunamadı."}; render(); };
  fr.readAsArrayBuffer(file);
}
document.addEventListener("change", e=>{
  if(e.target.id==="cvInput") handleCV(e.target.files && e.target.files[0]);
});
["dragenter","dragover"].forEach(ev=>document.addEventListener(ev, e=>{
  const d=e.target.closest("#drop"); if(!d) return;
  e.preventDefault(); d.querySelector(".card").style.borderColor="var(--brand)";
  d.querySelector(".card").style.background="var(--brand-soft)";
}));
["dragleave","drop"].forEach(ev=>document.addEventListener(ev, e=>{
  const d=e.target.closest("#drop"); if(!d) return;
  e.preventDefault(); const c=d.querySelector(".card");
  if(c){ c.style.borderColor="var(--line-strong)"; c.style.background=""; }
  if(ev==="drop") handleCV(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
}));

/* live search */
document.addEventListener("input", e=>{
  if(e.target.id==="feedSearch"){ S.filters.q=e.target.value; S.demo=null;
    const v=e.target.value; render();
    const el=$("#feedSearch"); if(el){ el.focus(); el.setSelectionRange(v.length,v.length); } }
  if(e.target.id==="occSearch"){ /* prototipte liste zaten kısa */ }
});

render();
</script>
</body>
</html>
