# İşe Uygun — üretim (D-049). VPS'te: `docker compose -f docker-compose.prod.yml up -d`
#
# İki servis:
#   * app   — FastAPI/uvicorn (bizim imaj). Kalıcı volume'lar korpusu ve profili
#             yeniden başlatmalar arası korur; yoksa her açılış yeniden çeker.
#   * caddy — reverse proxy + **otomatik HTTPS** (Let's Encrypt). Sırf bunun için
#             elle sertifika/nginx uğraşı gerekmesin.
#
# Sırlar `.env.prod` dosyasından gelir (git-ignore'lu). En azından şunu içermeli:
#   DOMAIN=app.joblyfit.com
#   ISUYGUN_JOOBLE_KEY=...   (tr.jooble.org anahtarı geldiğinde)
#   ISUYGUN_JOOBLE_HOST=tr.jooble.org

services:
  app:
    build: .
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      # Prod'da SQLite (kalıcı volume) yeterli; Postgres istenirse ISUYGUN_DSN ver.
      PORT: "8137"
    volumes:
      - corpus:/app/.cache      # ilan korpusu (~76 MB) — yeniden çekimi önler
      - profiles:/app/.data     # SQLite profil verisi
    expose:
      - "8137"                  # yalnızca iç ağ; dışa Caddy açar

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    # DOMAIN'i .env.prod'dan doğrudan container ortamına al (D-049 fix). Önceki
    # `${DOMAIN:-localhost}` interpolasyonu compose'un `.env` dosyasını okuyordu,
    # bizimki `.env.prod` olduğu için `localhost`a düşüyor ve Caddy sertifikayı
    # domain yerine localhost için alıyordu.
    env_file: [.env.prod]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Tanıtım sayfası (D-066). YALNIZCA web/site — `web/` kökünü mount etmek
      # app.html'i de joblyfit.com'dan erişilebilir kılardı.
      - ./web/site:/srv/site:ro
      - caddy_data:/data        # sertifikalar — silinirse LE limitine takılırsın
      - caddy_config:/config

volumes:
  corpus:
  profiles:
  caddy_data:
  caddy_config:
