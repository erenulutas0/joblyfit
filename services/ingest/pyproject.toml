[project]
name = "isuygun-ingest"
version = "0.1.0"
description = "İşe Uygun — ingestion pipeline (fetch → normalize → extract → dedupe)"
requires-python = ">=3.11"
dependencies = ["isuygun-core"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Monorepo'da editable install olmadan çalışabilmesi için core da yola eklenir.
pythonpath = ["src", "../core/src"]
