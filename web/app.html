<!-- SEO yüzeyi joblyfit.com'dur, burası değil. Bu sayfanın içeriği istemcide
     oluşur: tarayıcı botuna yalnızca boş kabuk görünür ve "yükleniyor" yazan
     bir arama sonucu kimseye yardım etmez, üstelik marka aramasında gerçek
     tanıtım sayfasıyla yarışır. `follow` bırakıldı — bağlantılar izlensin.
     robots.txt'te ENGELLEMİYORUZ: engellenirse Google bu etiketi göremez. -->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ==========================================================================
   D-046v2 — "Komuta konsolu" tasarım sistemi.
   Ürünün kimliğinden türetildi: bu bir tarama/kanıt makinesi. Radar konsolu
   dili — fosfor yeşili, mono veri etiketleri, köşe nişangahları, segmentli
   bant göstergesi. Bilinçli tek tema (koyu); jenerik dark-panel + mavi aksan
   şablonundan kaçınmak tasarımın kendisi.
   ========================================================================== */
:root{
  /* zemin — saf siyah değil; yeşile kayan grafitler */
  --bg:#050806;      --bg-2:#070b09;    --panel:#0a0f0c;   --panel-2:#0e1511;
  --line:#16211b;    --line-2:#203027;
  /* mürekkep */
  --ink:#dbe7df;     --ink-2:#9fb3a8;   --ink-3:#647a6e;   --ink-4:#405349;
  /* fosfor — tek gerçek aksan */
  --ph:#46f2a4;      --ph-dim:#2bbf7e;  --ph-soft:rgba(70,242,164,.09);
  --ph-line:rgba(70,242,164,.28);
  /* durum renkleri (bant) */
  --good:#46f2a4;    --good-soft:rgba(70,242,164,.10);
  --mid:#59c8ff;     --mid-soft:rgba(89,200,255,.10);
  --warn:#ffc153;    --warn-soft:rgba(255,193,83,.10);
  --bad:#ff6f61;     --bad-soft:rgba(255,111,97,.10);
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --disp:"Unbounded",system-ui,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0}
html{scrollbar-color:var(--line-2) var(--bg)}
body{
  font-family:var(--sans); color:var(--ink); font-size:15px; line-height:1.6;
  background:
    radial-gradient(1100px 500px at 70% -10%, rgba(70,242,164,.05), transparent 60%),
    repeating-linear-gradient(0deg, transparent 0 39px, rgba(70,242,164,.022) 39px 40px),
    repeating-linear-gradient(90deg, transparent 0 39px, rgba(70,242,164,.022) 39px 40px),
    var(--bg);
  min-height:100vh; overflow-x:hidden; -webkit-font-smoothing:antialiased;
}
button{font:inherit; cursor:pointer; border:0; background:none; color:inherit}
input{font:inherit; color:inherit}
a{color:var(--ph); text-decoration:none}
::selection{background:rgba(70,242,164,.25)}
.wrap{max-width:1060px; margin:0 auto; padding:0 24px}

/* -- mono veri etiketi: sistemin imzası -- */
.tag-l{font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3)}
.tag-l b{color:var(--ph); font-weight:600}

/* ==================== üst bar ==================== */
.topbar{position:sticky; top:0; z-index:40;
  background:linear-gradient(rgba(5,8,6,.92),rgba(5,8,6,.85));
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex; align-items:center; gap:20px; height:60px}
.brand{display:inline-flex; align-items:center; gap:9px; font-family:var(--disp);
  font-size:15px; font-weight:800; letter-spacing:.01em; line-height:1}
.brand em{font-style:normal; color:var(--ph)}
.brand .blogo{flex-shrink:0; display:block;
  filter:drop-shadow(0 0 5px rgba(70,242,164,.22))}
.brand .bwm{white-space:nowrap}
.sysline{display:flex; align-items:center; gap:8px}
.sysdot{width:6px; height:6px; border-radius:50%; background:var(--ph);
  box-shadow:0 0 8px var(--ph); animation:blink 2.4s infinite}
@keyframes blink{0%,88%{opacity:1}94%{opacity:.25}100%{opacity:1}}
.grow{flex:1}

/* profil anahtarı */
.psw{position:relative}
.psw-btn{display:flex; align-items:center; gap:10px; padding:7px 12px;
  border:1px solid var(--line-2); background:var(--panel);
  font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.06em;
  transition:border-color .15s}
.psw-btn:hover{border-color:var(--ph-line)}
.psw-btn .cv{color:var(--ink-4); font-size:9px}
.collar-dot{width:7px; height:7px; background:var(--ph)}
.collar-dot.blue{background:var(--warn)}
.psw-menu{position:absolute; right:0; top:calc(100% + 10px); width:300px;
  background:var(--panel); border:1px solid var(--line-2); padding:6px; display:none;
  box-shadow:0 20px 50px rgba(0,0,0,.5)}
.psw-menu.open{display:block; animation:drop .14s ease}
@keyframes drop{from{opacity:0; transform:translateY(-5px)}to{opacity:1}}
.psw-item{display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:10px 11px; font-size:13.5px; border:1px solid transparent}
.psw-item:hover{background:var(--panel-2)}
.psw-item.active{border-color:var(--ph-line); background:var(--ph-soft)}
.psw-item .nm{flex:1; font-weight:600}
.psw-item .meta{font-family:var(--mono); font-size:10px; color:var(--ink-4)}
.psw-x{color:var(--ink-4); padding:2px 7px}
.psw-x:hover{color:var(--bad)}
.psw-new{display:block; width:100%; padding:11px; margin-top:5px; text-align:center;
  border-top:1px solid var(--line); color:var(--ph); font-family:var(--mono);
  font-size:11.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase}
.psw-new:hover{background:var(--ph-soft)}

/* ==================== butonlar ==================== */
.btn{display:inline-flex; align-items:center; gap:9px; padding:13px 24px;
  background:var(--ph); color:#03130b; font-family:var(--mono); font-size:12.5px;
  font-weight:700; letter-spacing:.09em; text-transform:uppercase;
  clip-path:polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
  transition:filter .12s, transform .08s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.35; cursor:default}
.btn-2{display:inline-flex; align-items:center; gap:8px; padding:12px 20px;
  border:1px solid var(--line-2); color:var(--ink-2); background:var(--panel);
  font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.07em;
  text-transform:uppercase; transition:border-color .15s, color .15s}
.btn-2:hover{border-color:var(--ph-line); color:var(--ink)}
.btn-ghost{padding:12px 14px; color:var(--ink-3); font-family:var(--mono);
  font-size:12px; letter-spacing:.07em; text-transform:uppercase}
.btn-ghost:hover{color:var(--ink)}

/* ==================== nişangah köşeleri ==================== */
.reticle{position:relative}
.reticle::before,.reticle::after{content:""; position:absolute; width:14px; height:14px;
  border:1.5px solid var(--ph); opacity:0; transition:opacity .15s}
.reticle::before{top:-1px; left:-1px; border-right:0; border-bottom:0}
.reticle::after{bottom:-1px; right:-1px; border-left:0; border-top:0}
.reticle:hover::before,.reticle:hover::after,
.reticle.sel::before,.reticle.sel::after{opacity:1}

/* ==================== onboarding ==================== */
.ob{min-height:calc(100vh - 60px); display:flex; align-items:center;
  justify-content:center; padding:48px 24px}
.ob-card{width:100%; max-width:640px}
.ob-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:38px}
.ob-idx{font-family:var(--mono); font-size:12px; color:var(--ink-3); letter-spacing:.12em}
.ob-idx b{color:var(--ph); font-size:20px; font-weight:700}
.ob-prog{display:flex; gap:5px}
.ob-prog i{width:34px; height:3px; background:var(--line-2); transition:background .3s}
.ob-prog i.on{background:var(--ph); box-shadow:0 0 8px rgba(70,242,164,.5)}
.ob-step{animation:stepin .38s cubic-bezier(.2,.75,.25,1)}
@keyframes stepin{from{opacity:0; transform:translateX(26px)}to{opacity:1; transform:none}}
.ob h1{font-family:var(--disp); font-size:27px; font-weight:800; line-height:1.25;
  letter-spacing:-.005em; margin:14px 0 12px; text-wrap:balance}
.ob .sub{color:var(--ink-2); font-size:15px; max-width:88%; margin-bottom:30px}
.ob-actions{display:flex; align-items:center; gap:16px; margin-top:36px}

.pick{display:grid; gap:12px}
.pick.two{grid-template-columns:1fr 1fr}
.pick.flow{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pick-card{text-align:left; background:var(--panel); border:1px solid var(--line-2);
  padding:22px; transition:border-color .15s, background .15s}
.pick-card:hover{border-color:var(--ink-3)}
.pick-card.sel{border-color:var(--ph-line); background:var(--ph-soft)}
.pick-card .ic{font-family:var(--mono); font-size:11px; font-weight:700;
  letter-spacing:.14em; color:var(--ph); display:block; margin-bottom:12px}
.pick-card .t{font-family:var(--disp); font-weight:600; font-size:15.5px}
.pick-card .d{font-size:13px; color:var(--ink-3); margin-top:6px; line-height:1.5}
.pick-chip{padding:13px 14px; background:var(--panel); border:1px solid var(--line-2);
  font-family:var(--mono); font-size:12.5px; font-weight:600; letter-spacing:.04em;
  text-align:center; transition:border-color .15s, background .15s}
.pick-chip:hover{border-color:var(--ink-3)}
.pick-chip.sel{border-color:var(--ph-line); background:var(--ph-soft); color:var(--ph)}

.kw-group{margin-bottom:22px}
.kw-flow{display:flex; flex-wrap:wrap; gap:8px}
.kw{padding:8px 14px; background:var(--panel); border:1px solid var(--line-2);
  font-size:13px; font-weight:500; transition:all .12s}
.kw:hover{border-color:var(--ink-3)}
.kw.sel{border-color:var(--ph-line); background:var(--ph-soft); color:var(--ph); font-weight:600}
.kw-add{display:flex; gap:9px; margin-top:8px}
.kw-add input{flex:1; background:var(--panel); border:1px solid var(--line-2);
  padding:12px 14px; font-size:14px}
.kw-add input:focus{outline:none; border-color:var(--ph-line)}
.tagx{display:inline-flex; align-items:center; gap:7px; padding:7px 13px;
  background:var(--ph-soft); border:1px solid var(--ph-line);
  font-family:var(--mono); font-size:12px; color:var(--ph)}
.tagx b{cursor:pointer; color:var(--ink-3)} .tagx b:hover{color:var(--bad)}
.name-in{width:100%; background:var(--panel); border:1px solid var(--line-2);
  padding:17px 18px; font-family:var(--disp); font-size:17px; font-weight:600}
.name-in:focus{outline:none; border-color:var(--ph-line)}

/* ==================== feed ==================== */
.feed{padding:30px 0 90px}

/* konsol başlığı */
.console{border:1px solid var(--line-2); background:var(--panel); padding:20px 22px 18px;
  position:relative; overflow:hidden; margin-bottom:22px}
.console::after{content:""; position:absolute; left:0; right:0; top:0; height:1px;
  background:linear-gradient(90deg, transparent, var(--ph), transparent);
  animation:sweep 5s linear infinite; opacity:.7}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.console-row{display:flex; flex-wrap:wrap; gap:28px; align-items:flex-end}
.stat .n{font-family:var(--disp); font-size:30px; font-weight:800; line-height:1;
  color:var(--ink)}
.stat .n.ph{color:var(--ph); text-shadow:0 0 18px rgba(70,242,164,.35)}
.stat .l{margin-top:7px}
.console-hi{margin-left:auto; text-align:right; max-width:300px}
.console-hi .who{font-family:var(--disp); font-size:15px; font-weight:600}
.console-hi .sub{font-size:12px; color:var(--ink-3); margin-top:3px}

/* arama */
.searchbar{display:flex; gap:10px; margin:0 0 14px}
.si{flex:1; display:flex; align-items:center; gap:12px; background:var(--panel);
  border:1px solid var(--line-2); padding:0 16px; transition:border-color .15s}
.si:focus-within{border-color:var(--ph-line); box-shadow:0 0 0 1px var(--ph-line)}
.si .pfx{font-family:var(--mono); color:var(--ph); font-weight:700; font-size:13px}
.si input{flex:1; background:none; border:0; padding:14px 0; font-size:15px}
.si input:focus{outline:none}
.si input::placeholder{color:var(--ink-4)}

/* bölge chip'leri */
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:6px}
.chip{display:inline-flex; align-items:center; gap:8px; padding:8px 14px;
  background:var(--panel); border:1px solid var(--line-2); font-family:var(--mono);
  font-size:11.5px; font-weight:600; letter-spacing:.05em; color:var(--ink-2);
  transition:all .13s}
.chip:hover{border-color:var(--ink-3); color:var(--ink)}
.chip.on{border-color:var(--ph-line); background:var(--ph-soft); color:var(--ph)}
.chip .cc{color:var(--ph); font-weight:700}
.chip.on .cc{color:inherit}
.chip b{opacity:.55; font-weight:600}

/* ==================== filtre paneli ==================== */
.fbar{display:flex; align-items:center; gap:12px; margin:12px 0 4px}
.fbar .ln{flex:1; height:1px; background:linear-gradient(90deg,var(--line-2),transparent)}
.ftoggle{display:inline-flex; align-items:center; gap:9px; font-family:var(--mono);
  font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); padding:6px 0}
.ftoggle:hover{color:var(--ink)}
.ftoggle .ar{color:var(--ph); font-size:9px; transition:transform .18s}
.ftoggle.open .ar{transform:rotate(90deg)}
.ftoggle .cnt{color:var(--ph)}
.fpanel{display:none; border:1px solid var(--line-2); background:var(--panel);
  padding:18px 20px 16px; margin-bottom:8px}
.fpanel.open{display:block; animation:drop .16s ease}
.frow{margin-bottom:16px}
.frow:last-of-type{margin-bottom:0}
.frow>.tag-l{display:block; margin-bottom:9px}
.fopts{display:flex; flex-wrap:wrap; gap:7px}
/* Kıdem seçenekleri merdiven sırasında; sıra bilgi taşır (giriş → tepe). */
.fo{padding:7px 12px; background:var(--panel-2); border:1px solid var(--line);
  font-family:var(--mono); font-size:11.5px; font-weight:600; letter-spacing:.04em;
  color:var(--ink-2); transition:all .12s}
.fo:hover{border-color:var(--ink-3); color:var(--ink)}
.fo.on{border-color:var(--ph-line); background:var(--ph-soft); color:var(--ph)}
/* GÖRÜNÜR ODAK. Ölçümde bütün chip'lerde `outline: none` çıktı — klavyeyle
   gezen kullanıcı nerede olduğunu göremiyordu.
   Seçici bilinçli olarak GENEL: tek tek sınıf saymak, sonradan eklenen her
   kontrolü sessizce kapsam dışında bırakır (aynı hatayı sözdizimi denetiminde
   de yapmıştık — yalnızca eski sayfaya bakıyordu).
   `:focus-visible` kullanılır ki fareyle tıklayanda halka çıkmasın: fare
   tıklamasında halka "seçili" ile karıştırılıp yanlış sinyal verir. */
:focus-visible{outline:2px solid var(--mid); outline-offset:2px}
.fo b{opacity:.5; font-weight:600; margin-left:5px}
/* Şehir listesi uzun olabilir (Avrupa'da 421 grup) — kaydırılır, sayfa değil. */
.fopts.scroll{max-height:132px; overflow-y:auto; padding-right:4px;
  scrollbar-width:thin; align-content:flex-start}
.fsearch{width:100%; max-width:260px; background:var(--panel-2);
  border:1px solid var(--line); padding:8px 11px; font-family:var(--mono);
  font-size:11.5px; margin-bottom:9px}
.fsearch:focus{outline:none; border-color:var(--ph-line)}
.fnote{font-family:var(--mono); font-size:10px; letter-spacing:.08em;
  color:var(--ink-4); margin-top:7px}
/* Filtrenin GİZLİ MALİYETİ — sessiz kalırsa kullanıcı "filtre çalışmıyor"
   sanıyor. Uyarı rengi, ama alarm değil: bilgi. */
.fnote.warn-note{color:var(--warn); line-height:1.7; letter-spacing:.04em;
  font-size:10.5px; max-width:70ch}
.fnote.warn-note b{color:var(--warn)}
/* kıdem rozeti — kartta */
.pill.lvl{background:rgba(89,200,255,.10); color:var(--mid);
  border:1px solid rgba(89,200,255,.25)}
.fclear{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-4); padding:6px 0; margin-top:4px}
.fclear:hover{color:var(--bad)}

/* ==================== profil / CV paneli ==================== */
.pnl{position:fixed; top:0; right:0; bottom:0; width:min(560px,100%);
  background:var(--bg-2); border-left:1px solid var(--line-2); z-index:60;
  overflow-y:auto; padding:26px 28px 60px; transform:translateX(100%);
  transition:transform .26s cubic-bezier(.2,.75,.25,1)}
.pnl.on{transform:none}
.pnl-close{position:absolute; top:16px; right:18px; width:32px; height:32px;
  border:1px solid var(--line-2); color:var(--ink-3); font-size:17px; line-height:1}
.pnl-close:hover{border-color:var(--bad); color:var(--bad)}
.pnl h2{font-family:var(--disp); font-size:21px; font-weight:800; margin:6px 0 6px}
.pnl .lead{color:var(--ink-2); font-size:13.5px; line-height:1.6; margin-bottom:22px}
/* .dhead (bölüm başlığı) detay panelinde tanımlı — burada tekrar edilmez;
   iki aynı-özgüllükteki kural birbirinin margin'ini sessizce eziyordu. */

/* CV bırakma alanı */
.drop{border:1px dashed var(--line-2); background:var(--panel); padding:26px 20px;
  text-align:center; transition:border-color .15s, background .15s; cursor:pointer}
.drop:hover,.drop.hot{border-color:var(--ph-line); background:var(--ph-soft)}
.drop .ic{font-family:var(--mono); font-size:22px; color:var(--ph); display:block}
.drop .t{font-family:var(--disp); font-weight:600; font-size:14.5px; margin-top:10px}
.drop .d{font-size:12px; color:var(--ink-3); margin-top:5px; line-height:1.5}
.cvstat{display:flex; flex-wrap:wrap; gap:18px; margin-top:14px; padding:13px 15px;
  background:var(--panel); border:1px solid var(--line)}
.cvstat div{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-4)}
.cvstat b{display:block; font-family:var(--disp); font-size:17px; font-weight:800;
  color:var(--ink); letter-spacing:0; text-transform:none; margin-bottom:2px}
.cvstat b.ph{color:var(--ph)}

/* öneri satırı — onay kullanıcının, otomatik yazılmaz (D-014) */
.sug{display:flex; align-items:center; gap:12px; padding:11px 13px;
  background:var(--panel); border:1px solid var(--line); margin-bottom:7px}
.sug .nm{flex:1; min-width:0; font-size:13.5px; font-weight:600}
.sug .nm i{display:block; font-style:normal; font-family:var(--mono); font-size:10.5px;
  color:var(--ink-4); margin-top:3px; letter-spacing:.04em}
.sug .yr{width:66px; background:var(--panel-2); border:1px solid var(--line-2);

<script>
const API="/api";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mono=s=>(s||"?").trim().slice(0,2).toUpperCase();

/* Sunucu bazı açıklamalarda `**vurgu**` gönderiyor (ör. CV notu). Metni ÖNCE
   kaçırıp SONRA yalnızca bu kalıbı <b>'ye çeviririz — ham HTML'e izin vermeden
   vurgu korunur. Kaçırma önce yapıldığı için içerikten gelen `<b>` etiketi
   çalışmaz, yıldızlar da ekranda görünmez. */
const rich=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");

/* ---------------- marka (JoblyFit) ----------------
   Altıgen rozet = doğrulanmış uygunluk; içinde kişi+kalp = insanı merkeze alan
   eşleşme; sağ-alta taşan onay tiki altıgen kenarında çentik açar. Renkler CSS
   değişkenlerinden gelir; favicon <head>'de aynı biçimin renk-gömülü halidir. */
const BRAND_MARK=`<svg class="blogo" viewBox="0 0 48 48" width="30" height="30" aria-hidden="true" focusable="false">`
  +`<path d="M24 6 39.6 15 39.6 33 24 42 8.4 33 8.4 15Z" fill="none" stroke="var(--ph)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`
  +`<circle cx="24" cy="15.4" r="3.2" fill="#fff"/>`
  +`<path d="M24 27C22.6 24.6 19 24 19 21.4 19 19.9 20.2 19 21.5 19 22.4 19 23.4 19.5 24 20.4 24.6 19.5 25.6 19 26.5 19 27.8 19 29 19.9 29 21.4 29 24 25.4 24.6 24 27Z" fill="#fff"/>`
  +`<path d="M18 30 23.5 35.5 41 17" fill="none" stroke="var(--bg)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>`
  +`<path d="M18 30 23.5 35.5 41 17" fill="none" stroke="var(--ph)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`
  +`</svg>`;
const BRAND=`<div class="brand" aria-label="JoblyFit">${BRAND_MARK}<span class="bwm">Jobly<em>Fit</em></span></div>`;

async function api(path,opts){
  const r=await fetch(API+path,opts);
  if(!r.ok){let m=r.statusText; try{m=(await r.json()).detail||m}catch(e){} throw new Error(m);}
  return r.status===204?null:r.json();
}
const jpost=(p,body)=>api(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});

/* ---------------- durum ---------------- */
/* Bölüm başına sayfa boyutu (D-060): sunucu bu kadar satır döndürür,
   "daha fazla" bir sonraki dilimi ister. */
const PAGE=40;
const S={profiles:[], catalog:[], feed:null, view:"load",
  q:"", region:"", ob:null,
  /* Bir ilanın "şunu ekle" düğmesinden gelindiyse istenen alanın etiketi. */
  wantField:null,
  /* Son feed isteği başarısız olduysa sebebi. Ekrandaki liste bu durumda
     filtreleri YANSITMAZ ve bunu kullanıcıya söylemek zorundayız. */
  feedError:null,
  /* Onboarding şehir listesi: null = henüz istenmedi, [] = yok/başarısız. */
  obCities:null,
  /* filtreler. Hepsi "" = kısıt yok. `fopen` panelin açık/kapalı hâli. */
  f:{level:"", arr:"", emp:"", city:"", longOpen:false}, fopen:false, citySearch:"",
  /* profil paneli: null | "profile". `cv` son yükleme raporu; `unlock`
     "şunu eklersen ≈N ilan" önerileri (null = hesaplanıyor). */
  panel:null, profile:null, cv:null, unlock:null,
  /* İlan yapıştır sonucu ve kaynak listesi (null = henüz istenmedi). */
  paste:null, sources:null};

/* Kıdem merdiveni — sıra bilgi taşır (giriş → tepe), alfabetik değil.
   Etiketler kullanıcı dilinde; anahtarlar API'nin ürettiği değerler. */
const LVL_LABEL={intern:"STAJYER", junior:"JUNIOR", mid:"MID", senior:"SENIOR",
  lead:"LEAD", architect:"MİMAR", executive:"YÖNETİCİ"};
const LEVELS=[["intern","STAJYER"],["junior","JUNIOR"],["mid","MID"],
  ["senior","SENIOR"],["lead","LEAD"],["architect","MİMAR"],
  ["executive","YÖNETİCİ"],["unspecified","BELİRTİLMEMİŞ"]];
const ARRS=[["remote","UZAKTAN"],["hybrid","HİBRİT"],["onsite","OFİSTEN"],
  ["unspecified","BELİRTİLMEMİŞ"]];
const EMPS=[["internship","STAJ"],["part_time","YARI ZAMANLI"],
  ["contract","SÖZLEŞMELİ"],["unspecified","BELİRTİLMEMİŞ"]];

/* Yaka ayrımı MESLEK kümeleri içindir. Aşağıdakiler mesleğe değil KİŞİYE ait
   çapraz niteliklerdir; iki yakada da sorulur. Mavi yakada kapalı olmaları
   ölçülebilir zarar veriyordu: canlı testte kaynakçı ilanı "Tercihen Meslek
   Lisesi mezunu" istiyordu ama kullanıcının bunu beyan edecek yeri yoktu →
   şart kalıcı "bilinmeyen" kalıyor, kanıt oranı tavanı (D-064) devreye giriyor
   ve 24 sonucun 24'ü "şartlı eşleşme"de sıkışıyordu. Vardiya ve dil için
   durum daha da ters: mavi yakada beyaz yakadan DAHA çok isteniyorlar. */
const CLUSTERS_SHARED=["Eğitim düzeyi","Çalışma düzeni","Dil"];
/* "Güvenlik" (özel güvenlik görevlisi) buraya eklendi — Türkiye'de büyük bir
   mavi yaka istihdam kalemi, oysa yalnızca beyaz yaka listesinde görünüyordu.
   "İnşaat" lexicon'da HENÜZ token'ı olmayan bir küme (sıvacı/kalıpçı/demirci
   yok); burada duruyor ki token'lar eklendiğinde kendiliğinden mavi yakaya
   düşsün. */
/* "Ev hizmetleri ve bakım" D-076'da eklendi: ölçümde en büyük okunamayan
   bloktu ("Ev Yardımcısı Arıyoruz" hiçbir token tutmuyordu) ve Türkiye'de
   büyük bir istihdam kalemi. "Mühendislik" bilinçli olarak BURADA DEĞİL —
   beyaz yaka tarafına düşer. */
const CLUSTERS_BLUE=["Lojistik ve taşımacılık","Üretim ve teknik","Perakende ve hizmet",
  "Yiyecek ve turizm","Sağlık","Güvenlik","İnşaat","Ev hizmetleri ve bakım"];
/* Bölge kodları bilinçli olarak mono metin — bayrak emojisi Windows'ta harf
   olarak düşüyor; kod zaten konsol diline daha uygun. */
const RCODE={"Türkiye":"TR","Avrupa":"EU","ABD":"US","Uzaktan":"RMT","Diğer":"INT","Asya":"AS"};
const GAUGE={strong:4, good:3, cond:2, weak:1};

/* ---------------- açılış ---------------- */
/* ---------------- yerel profil deposu (D-059) ----------------
   Profiller SUNUCUDA DEĞİL, bu tarayıcıda yaşar. Sunucu her istekte geçici
   profili alır, değerlendirir, unutur — iki ziyaretçinin birbirinin verisini
   görmesi böylece yapısal olarak imkânsızlaşır (canlıda doğrulanmış açık).
   Bedeli dürüstçe: tarayıcı verisi silinirse profil de gider ve profil başka
   cihaza kendiliğinden taşınmaz. */
const LP_KEY="joblyfit.profiles.v1";
let LP=(()=>{ try{ const d=JSON.parse(localStorage.getItem(LP_KEY)||"null");
  if(d&&Array.isArray(d.profiles)) return d; }catch(e){}
  return {profiles:[], active_id:null}; })();
function lpSave(){ try{ localStorage.setItem(LP_KEY, JSON.stringify(LP)); }catch(e){} }
const lpActive=()=>LP.profiles.find(p=>p.id===LP.active_id)||null;
const uid=()=>crypto.randomUUID ? crypto.randomUUID()
  : "p-"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* Sunucuya giden geçici profil gövdesi. */
function profilePayload(){
  const p=lpActive();
  if(!p) return {facts:[], occupation_ids:[]};
  return {facts:p.facts.map(f=>({key:f.key, years:f.years??null,
    verified:f.verification==="verified"})), occupation_ids:[],
    total_years:(typeof p.total_years==="number")?p.total_years:null};
}
/* Üst bar / anahtar menüsünün beklediği meta görünümü. */
function syncProfiles(){
  S.profiles=LP.profiles.map(p=>({id:p.id, name:p.name, collar:p.collar,
    attrs:p.attrs||{}, is_active:p.id===LP.active_id, fact_count:p.facts.length}));
}
/* Panelin beklediği FactOut benzeri görünüm — etiket ve doğrulama kuralı
   katalogdan türetilir (needs_verification: D-012). */
function profileVM(){
  const p=lpActive();
  if(!p) return {facts:[], pending_cv_suggestions:[]};
  const cat=Object.fromEntries(S.catalog.map(c=>[c.key,c]));
  return {
    facts:p.facts.map(f=>{const c=cat[f.key]||{};
      return {key:f.key, label:c.label||f.key, category:c.category||"",
        verification:f.verification, years:f.years??null,
        counts_as_present:!c.needs_verification||f.verification==="verified"};}),
    pending_cv_suggestions:p.pending||[],
    total_years:(typeof p.total_years==="number")?p.total_years:null,
  };
}

/* ---------------- başvuru takibi (D-059) ----------------
   Kayıt, ilanın ANLIK KOPYASIDIR: ilanlar 45 günde korpustan düşer (D-024);
   yalnızca job_id saklansaydı kullanıcının başvuru geçmişi ilanla birlikte
   buharlaşırdı. Notlar yalnızca bu tarayıcıda durur; sunucuya sadece anonim
   OLAY gider (başvurdu/yanıt aldı…) — ileride işveren yanıt oranı olur. */
const AP_KEY="joblyfit.apps.v1";
let APPS=(()=>{ try{ const d=JSON.parse(localStorage.getItem(AP_KEY)||"null");
  if(Array.isArray(d)) return d; }catch(e){} return []; })();
function apSave(){ try{ localStorage.setItem(AP_KEY, JSON.stringify(APPS)); }catch(e){} }
const apFind=jobId=>APPS.find(a=>a.job_id===jobId);
const AP_STATUS=[["applied","BAŞVURDUM"],["answered","YANIT GELDİ"],
  ["interview","GÖRÜŞME"],["offer","TEKLİF"],["rejected","RED"],
  ["no_answer","YANIT YOK"]];
const AP_LABEL=Object.fromEntries(AP_STATUS);
function apDays(a){ return Math.max(0, Math.round((Date.now()-new Date(a.applied_at))/86400000)); }
function apEvent(a,event){
  fetch(API+"/apply-events",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({job_id:a.job_id, event, days_since_apply:apDays(a),
      title:a.snap.title, employer:a.snap.employer})}).catch(()=>{});
}
function apAdd(j){
  if(apFind(j.job_id)) return;
  APPS.unshift({id:uid(), job_id:j.job_id,
    snap:{title:j.title, employer:j.employer, city:j.city, url:j.url,
      salary_text:j.salary_text||null, band:j.band||null},
    applied_at:new Date().toISOString(), status:"applied", note:""});
  apSave(); apEvent(APPS[0],"applied");
}

/* Eşleşme geri bildirimi — oylanan ilanlar (tekrar sorulmasın). */
const FB_KEY="joblyfit.fb.v1";
let FB=new Set((()=>{ try{ return JSON.parse(localStorage.getItem(FB_KEY)||"[]"); }catch(e){ return []; } })());
function fbSave(){ try{ localStorage.setItem(FB_KEY, JSON.stringify([...FB])); }catch(e){} }
function fbSend(j,verdict,reason){
  FB.add(j.job_id); fbSave();
  fetch(API+"/feedback",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({job_id:j.job_id, verdict, reason:reason||null,
      band:j.band||null, title:j.title, employer:j.employer})}).catch(()=>{});
}

        aria-pressed="${o.collar==='blue'?'true':'false'}">

        <span class="d">Lojistik, üretim, sağlık, hizmet, teknik, sürüş…</span></button>
    </div>
    <div class="ob-actions">
      <button class="btn-ghost" data-back="1">← geri</button>
      <button class="btn" data-next="1" ${o.collar?'':'disabled'}>devam →</button>
    </div>`;

  if(step==="region"){
    const regions=(S.feed?.facets?.regions||[]).map(r=>r.name).filter(n=>RCODE[n]);
    const base=regions.length?regions:["Türkiye","Avrupa","ABD","Uzaktan"];
    /* İl grupları ilan sayısına göre (D-056). Ham `facets.cities` listesi
       burada "Ankara, Akyurt" gibi ilçe dizeleri ve boş değer gösteriyordu —
       kullanıcı testinde yakalandı. Feed yoksa (ilk kullanıcı) şehir adımı

    const _cc=new Map();
    [...(S.feed?.evaluated||[]),...(S.feed?.unevaluated||[])].forEach(j=>{

        _cc.set(j.city_group,(_cc.get(j.city_group)||0)+1);});
    /* Sunucudan gelen gerçek şehirler; yoksa feed'deki dilimden türetilene
       düşülür (ikinci profil açan kullanıcıda anında dolu olur). */
    const cities=(S.obCities&&S.obCities.length) ? S.obCities
      : [..._cc.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8).map(([c])=>c);
    const sehirVar=o.region==="Türkiye"&&cities.length;

    <span class="tag-l">// konum</span>
    <h1>Nerede iş arıyorsun?</h1>
    <p class="sub">Önce bölge.${o.region==="Türkiye"&&!cities.length?"":" Türkiye'yi seçersen şehre kadar inebilirsin."}</p>
    <div class="pick flow">
      <button class="pick-chip ${o.region===''?'sel':''}" data-region=""
        aria-pressed="${o.region===''?'true':'false'}">FARK ETMEZ</button>
      ${base.map(n=>`<button class="pick-chip ${o.region===n?'sel':''}" data-region="${esc(n)}"
        aria-pressed="${o.region===n?'true':'false'}">[${RCODE[n]||'?'}] ${esc(n.toUpperCase())}</button>`).join('')}
    </div>
    ${sehirVar?`
      <div style="margin-top:20px"><span class="tag-l">şehir — isteğe bağlı</span>
      <div class="pick flow" style="margin-top:10px">
        <button class="pick-chip ${o.city===''?'sel':''}" data-city=""

        ${cities.map(c=>`<button class="pick-chip ${o.city===c?'sel':''}" data-city="${esc(c)}"

      </div></div>`
     :(o.region==="Türkiye"?`<div class="fnote" style="margin-top:16px">şehir listesi

      </div></div>`).join('')}
    <div class="kw-group"><span class="tag-l">kendi anahtar kelimelerin</span>
      <div class="kw-flow" style="margin-top:9px" id="customTags">
        ${o.custom.map((c,i)=>`<span class="tagx">${esc(c)} <b data-rmc="${i}">×</b></span>`).join('')}
      </div>
      <div class="kw-add">
        <input id="customIn" placeholder="ör. React, SAP, forklift…" maxlength="40">

      </div>
    </div>
    <div class="ob-actions">
      <button class="btn-ghost" data-back="1">← geri</button>

  if(step==="name"){

    <h1>Bu profile bir ad ver.</h1>
    <p class="sub">Birden çok profil tutabilirsin — "Eren-Yazılım" ve "Eren-Mavi yaka"
      gibi. Üst bardan tek tıkla geçersin.</p>
    <input class="name-in" id="nameIn" value="${esc(S.ob.name||obSuggestName())}" maxlength="80" placeholder="Profil adı">

    <!-- DENEYİM YILI hiçbir yerde sorulmuyordu, ama kıdem tavanı (D-063) onu
         okuyor: beyan yoksa senior/mid ilanlar "şartlı"da sıkışıyor. Ölçüm:
         9 yıl beyan edilince 33 sonuçtan 3'ü şartlının üstüne çıktı, beyan
         yokken 0'ı çıkıyordu. Boş bırakılabilir — "0 yıl" ile "bilmiyoruz"
         aynı şey değil (D-011), boş bırakılırsa BİLMİYORUZ olarak kalır. -->
    <div style="margin-top:22px">
      <span class="tag-l">toplam deneyim — isteğe bağlı</span>
      <p class="sub" style="margin-top:6px">Kaç yıldır çalışıyorsun? Üst düzey
        ilanlarda "iyi/güçlü eşleşme" diyebilmemiz için gereken tek bilgi bu.
        Boş bırakırsan <b>uydurmayız</b>: bilmiyoruz olarak kalır.</p>
      <input class="name-in" id="yearsIn" type="number" min="0" max="60" step="0.5"
        style="max-width:180px" value="${S.ob.totalYears??''}" placeholder="ör. 6">
    </div>

    <div class="ob-actions">
      <button class="btn-ghost" data-back="1">← geri</button>

}

function selectableCatalog(collar){
  const ortak=i=>CLUSTERS_SHARED.includes(i.occupation_id);
  const mavi=i=>CLUSTERS_BLUE.includes(i.occupation_id);
  /* `ortak(i)||` beyaz yakada bugün gereksiz (paylaşılan gruplar CLUSTERS_BLUE
     içinde değil) ama niyeti açık tutuyor: bir gün bir grup hem mavi hem ortak
     sayılırsa beyaz yaka onu kaybetmesin. */
  if(collar==="blue")  return S.catalog.filter(i=>ortak(i)||mavi(i));
  if(collar==="white") return S.catalog.filter(i=>ortak(i)||!mavi(i));
  return S.catalog;
}
function obSuggestName(){
  const o=S.ob, parts=[];
  const first=[...o.keys].map(k=>S.catalog.find(c=>c.key===k)?.label).filter(Boolean)[0];
  if(first) parts.push(first); else if(o.collar) parts.push(o.collar==='blue'?'Mavi yaka':'Beyaz yaka');
  if(o.city) parts.push(o.city.split(',')[0].split('/')[0].trim());
  else if(o.region) parts.push(o.region);
  return parts.join(' · ')||'Profilim';
}

/* Onboarding şehir listesi: boş profille tek istek, GERÇEK facet sayıları.
   `null` = henüz istenmedi, `[]` = istendi ve yok/başarısız. */
async function loadObCities(){
  S.obCities=[];
  try{
    const r=await jpost("/feed",{profile:{}, filters:{region:"Türkiye"}, limit:1});
    S.obCities=(r.facets?.cities||[])
      .map(c=>Array.isArray(c)?c[0]:c).filter(Boolean).slice(0,8);
  }catch(e){ S.obCities=[]; }   // sessiz: şehir seçimi İSTEĞE BAĞLI, akış durmaz
  if(S.ob) render();
}

function wireOnboarding(){
  const o=S.ob, step=$("#obStep");
  const go=d=>{
    /* İLERİ giderken kutuda BEKLEYEN kelime yutulmaz. Kullanıcı yazıp EKLE'ye
       (ya da Enter'a) basmadan DEVAM'a geçerse beyanı sessizce kayboluyordu —
       kelimeler eşleştirmede kanıt olduğu için doğrudan eşleşme kalitesi
       kaybı. GERİ giderken absorbe etmiyoruz: geri dönen kullanıcı vazgeçmiş
       olabilir, ona sormadan kayıt eklemek sürpriz olurdu. */
    if(d>0){
      const v=($("#customIn")?.value||"").trim();
      if(v && !o.custom.includes(v)) o.custom.push(v);
    }
    o.step=Math.max(0,Math.min(OB_STEPS.length-1,o.step+d)); render();
  };
  step.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>go(1));
  step.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>go(-1));
  step.querySelectorAll("[data-collar]").forEach(b=>b.onclick=()=>{o.collar=b.dataset.collar; o.keys.clear(); render();});
  step.querySelectorAll("[data-region]").forEach(b=>b.onclick=()=>{
    o.region=b.dataset.region; o.city="";
    /* Şehir listesi SUNUCUDAN gelir. Önceden `S.feed`den türetiliyordu ve ilk
       kez gelen kullanıcıda `S.feed` henüz null olduğu için liste hiç
       çizilmiyordu — metin "şehre kadar inebilirsin" diyor, hiçbir şey
       açılmıyordu. Feed yüklü olsa bile yalnızca 40 satırlık dilimden sayardı. */
    if(o.region==="Türkiye" && S.obCities===null) loadObCities();
    render();});
  step.querySelectorAll("[data-city]").forEach(b=>b.onclick=()=>{o.city=b.dataset.city; render();});
  step.querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.key; o.keys.has(k)?o.keys.delete(k):o.keys.add(k); b.classList.toggle("sel");});
  const addC=()=>{const inp=$("#customIn"); const v=(inp.value||"").trim();
    if(v && !o.custom.includes(v)) o.custom.push(v);
    render(); setTimeout(()=>$("#customIn")?.focus(),0);};
  step.querySelector("[data-addc]")?.addEventListener("click",addC);
  $("#customIn")?.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault(); addC();}});
  step.querySelectorAll("[data-rmc]").forEach(b=>b.onclick=()=>{o.custom.splice(+b.dataset.rmc,1); render();});
  const nm=$("#nameIn"); if(nm) nm.oninput=()=>{o.name=nm.value;};
  const yi=$("#yearsIn"); if(yi) yi.oninput=()=>{
    const v=parseFloat(yi.value);
    /* Boş ya da geçersiz => null (BİLMİYORUZ), 0 değil. */
    o.totalYears=Number.isFinite(v)?Math.max(0,Math.min(60,v)):null;};
  step.querySelector("[data-finish]")?.addEventListener("click",finishOnboarding);
}

async function finishOnboarding(){
  const o=S.ob;
  const name=(o.name||$("#nameIn")?.value||obSuggestName()).trim()||"Profilim";
  const attrs={region:o.region, city:o.city, keywords:o.custom};
  $("#root").innerHTML=`<div class="load"><div class="radar"></div><span>profil derleniyor</span></div>`;
  try{
    /* Profil YERELE yazılır (D-059) — sunucuya hiçbir şey kaydedilmez.
       Yasal uygunluk alanları katalogda zaten yok; seçilen her anahtar beyan
       (user_asserted) olarak girer, belge alanları panelden doğrulanır. */
    const pid=uid();
    LP.profiles.push({id:pid, name, collar:o.collar, attrs,
      total_years:o.totalYears,
      facts:[...o.keys].map(k=>({key:k, verification:"user_asserted", years:null})),
      pending:[], created_at:new Date().toISOString()});
    LP.active_id=pid; lpSave(); syncProfiles();
    /* Bölge tercihi filtre olur; arama BOŞ başlar. Özel kelimeyi aramaya
       zorlamak feed'i tek sonuca düşürüyordu — profilde saklanır. */
    /* Onboarding'de seçilen şehir FİLTREYE de uygulanır. Önceden yalnızca
       `attrs`a yazılıyor ve `S.f.city` boş bırakılıyordu: kullanıcı "İstanbul"
       seçiyor, sonra bütün Türkiye'yi görüyordu. */
    S.region=o.region||""; S.q="";
    S.f={level:"",arr:"",emp:"",city:o.city||"",longOpen:false}; S.citySearch="";
    await loadFeed(); S.view="feed"; S.ob=null; render();
  }catch(e){ alert("Hata: "+e.message); boot(); }
}

/* ---------------- feed ----------------
   D-060: filtreleme, arama ve facet sayımı SUNUCUDA. İstemci yalnızca gördüğü
   sayfayı taşır (40 satır) — 9,6 MB'lık tam liste telefonda saniyelerce
   ayrıştırılıyordu. Rozet-gerçeği kuralı (D-057) sunucuda uygulanır; arama
   katlamalı tam-metin (D-058) olarak feed isteğinin içinde gider. */
let _fSeq=0;
function currentFilters(){
  return {q:S.q.trim(), region:S.region, city:S.f.city, level:S.f.level,
    arrangement:S.f.arr, employment:S.f.emp, long_open:S.f.longOpen};
}
async function fetchFeed(){
  const seq=++_fSeq;
  const r=await jpost("/feed",{profile:profilePayload(), filters:currentFilters(),
    offset_evaluated:0, offset_unevaluated:0, limit:PAGE});
  if(seq!==_fSeq) return;      // kullanıcı bu arada başka filtre seçti
  S.feed=r;
}
/* Filtre/arama değişiminde: sunucudan taze sayfa + odak kaybetmeden boya. */
async function refetchAndPaint(){
  /* SESSİZ BAŞARISIZLIK "FİLTRE BOZUK"LA AYNI GÖRÜNÜR. Önceki sürüm hatayı
     yutuyordu: `S.f` değiştiği için chip yeşile dönüyor, ama liste eski
     payload'dan çizildiği için hiç değişmiyordu. Kullanıcı chip'i seçili
     görüp listenin aynı kaldığını görüyor ve haklı olarak "filtreler
     çalışmıyor" diyordu — oysa filtre uygulanmadı, istek düştü.

     Artık ekrandaki listenin filtrelerle UYUŞMADIĞI açıkça yazılır. Filtre
     durumunu geri almıyoruz: arama kutusuna yazılmış metni geri almak daha
     kötü bir tutarsızlık olurdu; onun yerine uyuşmazlığı söyleyip tekrar
     deneme yolu veriyoruz. */
  try{
    await fetchFeed();
    S.feedError=null;
  }catch(e){
    S.feedError=e?.message || "bağlantı hatası";
  }
  if(S.view==="feed") repaintKeepFocus();
}
let _qT=null;
function qDebounce(){ clearTimeout(_qT); _qT=setTimeout(refetchAndPaint,250); }
async function fetchMore(section){
  const off= section==="evaluated" ? S.feed.evaluated.length
                                   : S.feed.unevaluated.length;
  const body={profile:profilePayload(), filters:currentFilters(),
    offset_evaluated:0, offset_unevaluated:0, limit:PAGE};
  body[section==="evaluated"?"offset_evaluated":"offset_unevaluated"]=off;
  const r=await jpost("/feed", body);
  /* Yalnızca istenen bölümün dilimi eklenir; toplamlar zaten sabit. */
  S.feed[section]=S.feed[section].concat(r[section]);
  repaintKeepFocus();
}
function repaintKeepFocus(){
  const el=document.activeElement, id=el?.id, pos=el?.selectionStart;
  repaint();
  if(id){ const n=$("#"+id);
    if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} } }
}
const activeFilterCount=()=>
  (S.f.level?1:0)+(S.f.arr?1:0)+(S.f.emp?1:0)+(S.f.city?1:0)+(S.f.longOpen?1:0);

/* Sıfır ilanlı seçenek gösterilmez (tıklayınca boş liste veren filtre,
   tutulmayan bir vaattir) — TEK istisna SEÇİLİ seçenek: diğer filtreler onu
   sıfıra düşürse bile ekranda kalmalı, yoksa kullanıcı seçimi geri alamaz. */
function fopts(list,counts,sel,attr){
  /* `aria-pressed`: seçim durumu yalnızca CSS sınıfıyla taşınırsa ekran
     okuyucu hangi filtrenin etkin olduğunu HİÇ bildirmez — görme engelli
     kullanıcı için filtreler görünmez olur. */
  return list.filter(([k])=>(counts||{})[k]||sel===k)
    .map(([k,label])=>`<button class="fo ${sel===k?'on':''}" data-${attr}="${k}"
      aria-pressed="${sel===k?'true':'false'}">
      ${label}<b>${(counts||{})[k]||0}</b></button>`).join('');
}

function viewFilters(){
  const fx=S.feed?.facets; if(!fx) return "";
  const n=activeFilterCount();
  /* BU EKSENLERİN GİZLİ MALİYETİ VAR ve söylenmezse tuzak olur: Türkiye
     ilanlarının çoğu kıdem/çalışma biçimi/istihdam türü YAZMIYOR (İstanbul'da
     2301 ilanın 2101'i kıdem belirtmemiş — %91). Kullanıcı "JUNIOR" seçtiğinde
     o 2101 ilanı da eliyor; içlerinde ona uygun junior ilanlar olabilir,
     yalnızca "junior" yazmamışlardır. Ölçülen sonuç: İstanbul+JUNIOR 12 ilan
     veriyor ve hiçbiri yazılım değil — kullanıcı "filtreler çalışmıyor"
     sanıyor, oysa filtre çalışıyor, havuz o kadar. */
  const eksenNotu=(sel,counts)=>{
    if(!sel || sel==="unspecified") return "";
    const bos=(counts||{}).unspecified||0;
    if(!bos) return "";
    return `<div class="fnote warn-note">Bu filtre, bu alanı <b>yazmayan
      ${bos} ilanı</b> da dışarıda bırakıyor. Çoğu işveren bunu belirtmiyor —
      aradığın iş onların arasında olabilir.</div>`;
  };
  const rows=[
    ["kıdem seviyesi", fopts(LEVELS,fx.experience_levels,S.f.level,"lvl"),
      eksenNotu(S.f.level,fx.experience_levels)],
    ["çalışma biçimi", fopts(ARRS,fx.arrangements,S.f.arr,"arr"),
      eksenNotu(S.f.arr,fx.arrangements)],
    ["istihdam türü",  fopts(EMPS,fx.employment_types,S.f.emp,"emp"),
      eksenNotu(S.f.emp,fx.employment_types)],
  ].filter(([,html])=>html);

  const q=S.citySearch.trim().toLocaleLowerCase("tr");
  /* Sunucudan [ad, sayı] çiftleri, çoktan aza sıralı (D-060). */
  const hepsi=(fx.cities||[]).map(x=>[x[0],x[1]]);
  /* Seçili şehir diğer filtrelerle sıfıra düşse bile listede kalır —
     kaybolursa seçim geri alınamaz. */
  if(S.f.city && !hepsi.some(([c])=>c===S.f.city)) hepsi.unshift([S.f.city,0]);
  const list=q?hepsi.filter(([c])=>c.toLocaleLowerCase("tr").includes(q)):hepsi;
  const ct={list, toplam:hepsi.length, belirsiz:fx.city_unspecified||0};
  const GOSTER=60;   // uzun listede ilk 60; gerisi arama kutusuyla bulunur
  const kesildi=Math.max(0,ct.list.length-GOSTER);
  const cityRow=`<div class="frow"><span class="tag-l">şehir
      ${S.region?`— ${esc(S.region.toUpperCase())}`:''}</span>
    ${ct.toplam>12?`<input class="fsearch" id="citySearch"
      placeholder="şehir ara…" value="${esc(S.citySearch)}">`:''}
    <div class="fopts ${ct.list.length>18?'scroll':''}">
      ${ct.list.slice(0,GOSTER).map(([c,n])=>`<button class="fo ${S.f.city===c?'on':''}"
        data-city="${esc(c)}" aria-pressed="${S.f.city===c?'true':'false'}"
        >${esc(c)}<b>${n}</b></button>`).join('')}
    </div>
    ${!ct.list.length?`<div class="fnote">"${esc(S.citySearch)}" ile eşleşen şehir yok.</div>`:''}
    ${kesildi?`<div class="fnote">+${kesildi} şehir daha — aramayla bul</div>`:''}
    ${ct.belirsiz?`<div class="fnote">${ct.belirsiz} ilan şehir belirtmemiş
      (bölge biliniyor, şehir yok) — uydurmuyoruz.</div>`:''}
  </div>`;
  return `
    <div class="fbar">
      <button class="ftoggle ${S.fopen?'open':''}" id="fToggle">
        <span class="ar">▶</span> filtreler${n?` <span class="cnt">[${n}]</span>`:''}
      </button>
      <span class="ln"></span>
      ${n?`<button class="fclear" id="fClear">filtreleri temizle ×</button>`:''}
    </div>
    <div class="fpanel ${S.fopen?'open':''}">
      ${ct.toplam?cityRow:''}
      ${rows.map(([t,html,not])=>`<div class="frow"><span class="tag-l">${t}</span>
        <div class="fopts">${html}</div>${not||''}</div>`).join('')}
      ${(fx.long_open_count||S.f.longOpen)?`<div class="frow"><span class="tag-l">ilan yaşı</span>
        <div class="fopts"><button class="fo ${S.f.longOpen?'on':''}" data-lo="1">
          UZUN SÜREDİR AÇIK<b>${fx.long_open_count||0}</b></button></div>
        <div class="tag-l" style="margin-top:8px; color:var(--ink-4)">
          Uzun süredir açık ilan hayalet ilan olabilir — ya da işveren sürekli alım yapıyordur.
        </div></div>`:''}
    </div>`;
}

function viewFeed(){
  const f=S.feed; if(!f) return "";
  const p=activeProfile();
  /* Listeler artık sunucudan SAYFALI gelir (D-060): ev/un yalnızca yüklü
     dilimler, toplamlar ayrı alanlarda. */
  const ev=f.evaluated||[], un=f.unevaluated||[];
  const evT=f.evaluated_total??ev.length, unT=f.unevaluated_total??un.length;
  const total=f.corpus_total??(evT+unT);
  const regions=(f.facets?.regions||[]);

  return `
    ${S.feedError?`<div class="notice feed-err">
      <b>Filtreler uygulanamadı.</b> Aşağıdaki liste <b>eski</b> — seçtiğin
      filtreleri yansıtmıyor. Sebep: ${esc(S.feedError)}
      <button class="btn-2" data-retry="1" style="margin-left:10px">tekrar dene</button>
    </div>`:''}
    <div class="console">
      <div class="console-row">
        <!-- ÜÇ SAYI ARTIK AYNI BÖLENDEN. Önceden ilk sayı korpus genelini
             (12.628), diğer ikisi FİLTRELİ alt kümeyi gösteriyordu; kullanıcı
             bunları aynı toplamın kırılımı sanıyor ve "8424 veri eksik ne
             demek" diye haklı olarak soruyordu. Şimdi ilk sayı filtredeki
             toplam (evT+unT) ve toplama tutuyor; korpus boyutu altta bağlam
             satırında, filtre varsa açıkça belirtilerek duruyor. -->
        <div class="stat"><div class="n">${evT+unT}</div><div class="l tag-l">${
          (S.region||S.q||activeFilterCount())?'bu filtrede':'taranan ilan'}</div></div>
        <div class="stat"><div class="n ph">${evT}</div><div class="l tag-l">değerlendirilen</div></div>
        <div class="stat"><div class="n" style="color:var(--warn)">${unT}</div><div class="l tag-l">değerlendirilemedi</div></div>
        <div class="console-hi">
          <div class="who">${esc(p?p.name:'—')}</div>
          <div class="sub">profil etkin · ${p?p.fact_count:0} beceri kayıtlı${
            /* Filtre varken korpus boyutu BAĞLAM olarak burada durur; yukarıdaki
               üç sayının bölenini değiştirmez. */
            (S.region||S.q||activeFilterCount())&&total>(evT+unT)
              ? ` · korpusta ${total} ilan tarandı` : ''}</div>
        </div>
      </div>
    </div>

    <div class="searchbar"><div class="si"><span class="pfx">&gt;_</span>
      <input id="q" placeholder="pozisyon, şirket, beceri ara…" value="${esc(S.q)}"></div></div>

    <div class="chips">
      <button class="chip ${S.region===''?'on':''}" data-region=""><span class="cc">ALL</span> TÜM BÖLGELER</button>
      ${regions.map(r=>`<button class="chip ${S.region===r.name?'on':''}" data-region="${esc(r.name)}">
        <span class="cc">${RCODE[r.name]||'?'}</span> ${esc(r.name.toUpperCase())} <b>${r.count}</b></button>`).join('')}
    </div>

    ${viewFilters()}

    ${verifyNote()}
    ${evT?`
      <div class="sec-h"><span class="t">// sana göre <b>[${evT}]</b></span><span class="ln"></span></div>
      ${ev.map(card).join('')}
      ${evT>ev.length?`<button class="btn-2 more" data-more="1">+ ${Math.min(PAGE,evT-ev.length)} ilan daha</button>`:''}`
    :unT?`
      <div class="notice">Bu filtrelerle <b>${unT} ilan var</b> — hepsi hemen aşağıda.
        Hiçbirine bant veremedik (bkz. bölüm notu), o yüzden "sana göre" listesi boş;
        bu, ilanların sana <b>uymadığı</b> anlamına gelmez.</div>`
    :`<div class="empty"><h3>Bu filtrelerle eşleşme yok</h3>
       <p>Filtreyi gevşet ya da profiline beceri ekle — tarama alanı genişler.</p></div>`}

    ${unT?`
      <div class="sec-h"><span class="t">// değerlendirilemeyenler <b>[${unT}]</b></span><span class="ln"></span></div>
      <div class="notice">${unBreakdown(f.unevaluated_breakdown||{})} — sana uymadıkları anlamına <b>gelmez</b>.
        Beceri ekledikçe değerlendirilebilir olanlar yukarı taşınır.
        <button class="btn-2" id="addSkillCta"
          style="margin-left:8px; padding:5px 11px; font-size:10.5px">+ beceri ekle</button></div>
      ${un.map(card).join('')}
      ${unT>un.length?`<button class="btn-2 more" data-more-un="1">+ ${Math.min(PAGE,unT-un.length)} ilan daha</button>`:''}`:''}
  `;
}

/* "Veri eksik"in NEDENİ tek değil; kullanıcıya toplu sayı yerine dökümü
   söylenir. Döküm SUNUCUDAN gelir (D-060): istemcinin elinde yalnız 40'lık
   sayfa var, tam listeyi kendisi sayamaz. Sınıflar: (1) metinden şart
   çıkarılamadı — profilden bağımsız; (2) şart okundu ama profilde veri yok —
   beceri ekleyince düzelir; (3) kamu ilanı yalnızca listelenir. */
function unBreakdown(bd){
  const p=[];
  if(bd.unreadable) p.push(`<b>${bd.unreadable}</b> ilanın metninden şart okunamadı`);
  if(bd.missing_data) p.push(`<b>${bd.missing_data}</b> ilan için profilinde karşılaştıracak veri yok`);
  if(bd.listing_only) p.push(`<b>${bd.listing_only}</b> kamu ilanı yalnızca listelenir`);
  return p.join(" · ")||"döküm alınamadı";
}

function card(j){
  const bc=j.band?('b-'+j.band):'b-none';
  const bandTxt=j.band_label||(j.listing_only?'Kamu ilanı':'Değerlendirilemedi');
  const lit=GAUGE[j.band]||0;
  const met=new Set(j.matched_requirements||[]);
  const tags=(j.top_requirements||[]).slice(0,4).map(r=>`<span class="rq ${met.has(r)?'on':''}">${esc(r)}</span>`).join('');
  const pills=[];
  /* Kıdem rozeti kartta gösterilir: filtre vardı ama ilanın hangi seviyede
     olduğu görünmüyordu, kullanıcı her ilanı açmak zorunda kalıyordu.
     Etiketsiz ilanda rozet YOK — "belirtilmemiş"i "mid" gibi göstermek
     uydurma olurdu (D-011). */
  if(apFind(j.job_id))
    pills.push(`<span class="pill applied">✓ BAŞVURULDU</span>`);
  if(j.experience_level&&LVL_LABEL[j.experience_level])
    pills.push(`<span class="pill lvl">${LVL_LABEL[j.experience_level]}</span>`);
  if(j.salary_status==='found'&&j.salary_text) pills.push(`<span class="pill pay">${esc(j.salary_text)}</span>`);
  if(j.long_open) pills.push(`<span class="pill age">${j.age_days}G AÇIK</span>`);
  if((j.fairness_flags||[]).some(f=>f.severity==='hard')) pills.push(`<span class="pill fair">⚠ AYRIMCI İFADE</span>`);
  const rc=(j.regions||[]).filter(r=>r!=='Diğer').slice(0,1).map(r=>RCODE[r]).filter(Boolean);
  return `<article class="card ${bc}" data-job="${esc(j.job_id)}">
    <div class="card-top">
      <div class="card-logo">${esc(mono(j.employer))}</div>
      <div class="card-main">
        <h4>${esc(j.title)}</h4>
        <div class="card-meta"><b>${esc(j.employer)}</b>
          ${j.city?`<span class="dot">·</span>${esc(j.city)}`:''}
          ${j.age_days!=null&&!j.long_open?`<span class="dot">·</span>${j.age_days}g önce`:''}
          ${rc.length?`<span class="dot">·</span><span class="cc">[${rc[0]}]</span>`:''}
        </div>
        ${pills.length?`<div class="card-tags">${pills.join('')}</div>`:''}
        ${tags?`<div class="card-tags">${tags}</div>`:''}
      </div>
      <div class="bandbox">
        ${j.band?`<span class="gauge">${[1,2,3,4].map(i=>`<i class="${i<=lit?'on':''}"></i>`).join('')}</span>`:''}
        <span class="bl">${esc(bandTxt)}</span>
      </div>
    </div>
  </article>`;
}

/* Üst bar kablolaması — feed ve başvurular görünümlerinde ortak. */
function wireTopbar(){
  const pb=$("#pswBtn"); if(pb) pb.onclick=e=>{e.stopPropagation(); $("#pswMenu").classList.toggle("open");};
  document.addEventListener("click",()=>$("#pswMenu")?.classList.remove("open"),{once:true});
  document.querySelectorAll("[data-act]").forEach(el=>el.onclick=async()=>{
    LP.active_id=el.dataset.act; lpSave(); syncProfiles();
    const a=activeProfile();
    /* Profil değişince arama/filtre/sayfalama sıfırlanır; bölge profilin
       tercihine döner. Filtreler sıfırlanmazsa önceki profilin şehri yeni
       profilin bölgesiyle çakışıp sessizce boş liste verebiliyordu. */
    S.region=a?.attrs?.region||""; S.q="";
    S.f={level:"",arr:"",emp:"",city:a?.attrs?.city||"",longOpen:false};
    S.citySearch="";
    S.view="feed";
    await loadFeed(); render();
  });
  document.querySelectorAll("[data-del]").forEach(el=>el.onclick=async(e)=>{
    e.stopPropagation();
    if(LP.profiles.length<=1){ alert("Son profil silinemez."); return; }
    if(!confirm("Bu profil silinsin mi? (Yalnızca bu tarayıcıdan silinir)")) return;
    LP.profiles=LP.profiles.filter(p=>p.id!==el.dataset.del);
    if(LP.active_id===el.dataset.del) LP.active_id=LP.profiles[0].id;
    lpSave(); syncProfiles();
    await loadFeed(); render();
  });
  $("[data-new]")&&($("[data-new]").onclick=startOnboarding);
  /* Ok fonksiyonu ZORUNLU: `onclick=openProfilePanel` biçiminde bağlamak
     tıklama olayını 1. argüman olarak geçirir (bkz. openProfilePanel'deki tip
     koruması). */
  $("#cvBtn")&&($("#cvBtn").onclick=()=>openProfilePanel());
  $("#appsBtn")&&($("#appsBtn").onclick=()=>{
    S.view=(S.view==="apps")?"feed":"apps"; render();});
  $("#pasteBtn")&&($("#pasteBtn").onclick=()=>{
    S.view=(S.view==="paste")?"feed":"paste"; render();});
  $("#srcBtn")&&($("#srcBtn").onclick=()=>{
    S.view=(S.view==="sources")?"feed":"sources"; render();
    if(S.view==="sources"&&!S.sources) loadSources();});
}

function wireFeed(){
  wireTopbar();
  /* Arama: sunucuya debounce ile gider (D-060); tuş başına repaint YOK —
     input DOM'da kalır, imleç doğal korunur, cevap gelince liste yenilenir. */
  const q=$("#q"); if(q) q.oninput=()=>{S.q=q.value; qDebounce();};
  document.querySelectorAll("[data-region]").forEach(el=>el.onclick=()=>{
    /* Bölge değişince şehir seçimi düşer: "Türkiye + Berlin" boş liste verirdi
       ve kullanıcı sebebini göremezdi. */
    S.region=el.dataset.region; S.f.city=""; S.citySearch="";
    refetchAndPaint();});
  /* "Daha fazla" bir sonraki dilimi SUNUCUDAN ister (D-060). */
  $("[data-more]")&&($("[data-more]").onclick=()=>fetchMore("evaluated"));
  $("[data-more-un]")&&($("[data-more-un]").onclick=()=>fetchMore("unevaluated"));
  $("#addSkillCta")&&($("#addSkillCta").onclick=()=>openProfilePanel());
  document.querySelectorAll("[data-job]").forEach(el=>el.onclick=()=>openDetail(el.dataset.job));

  /* --- filtreler: her değişim sunucudan taze sayfa + taze rozetler --- */
  $("#fToggle")&&($("#fToggle").onclick=()=>{S.fopen=!S.fopen; repaint();});
  $("#fClear")&&($("#fClear").onclick=()=>{
    S.f={level:"",arr:"",emp:"",city:"",longOpen:false}; S.citySearch="";
    refetchAndPaint();});
  /* Şehir arama kutusu görsel süzgeçtir — sunucuya gitmez, yerelde daraltır. */
  const cs=$("#citySearch");
  if(cs) cs.oninput=()=>{S.citySearch=cs.value; const p=cs.selectionStart;
    repaint(); const n=$("#citySearch"); if(n){n.focus(); n.setSelectionRange(p,p);}};
  /* Aynı seçeneğe tekrar tıklamak filtreyi kaldırır — kullanıcı "geri al"
     için temizle düğmesini aramak zorunda kalmasın. */
  $("[data-retry]")&&($("[data-retry]").onclick=()=>refetchAndPaint());
  /* Doğrulama notundaki düğme (D-080). `data-openpanel` işleyicisi yalnızca
     detay panelinde bağlıydı; feed'deki düğme bağlanmazsa tıklanır ve HİÇBİR
     ŞEY olmaz — sessizce ölü bir düğme. */
  document.querySelectorAll(".feed [data-openpanel]").forEach(b=>b.onclick=()=>
    openProfilePanel(b.dataset.field||null));
  const pick=(attr,key)=>document.querySelectorAll(`[data-${attr}]`).forEach(el=>el.onclick=()=>{
    const v=el.dataset[attr]; S.f[key]=(S.f[key]===v?"":v); refetchAndPaint();});
  pick("city","city");
  pick("lvl","level"); pick("arr","arr"); pick("emp","emp");
  $("[data-lo]")&&($("[data-lo]").onclick=()=>{
    S.f.longOpen=!S.f.longOpen; refetchAndPaint();});

  /* profil / CV paneli düğmesi wireTopbar'da bağlanır */
}

/* ---------------- profil & CV paneli ---------------- */
/* Tasarım kararı: CV **hiçbir şeyi otomatik yazmaz** (D-014/T-016). Yükleme
   yalnızca ÖNERİ üretir; her satırı kullanıcı tek tek onaylar. Sunucu da öyle
   davranır (`written_to_profile:false`), arayüz bunu gizlemez — "CV'den 12
   beceri eklendi" demek, kullanıcının profilini onun adına doldurmaktı. */
async function openProfilePanel(wantField){
  const sc=$("#scrim"), p=$("#pnl");
  sc.classList.add("on"); p.classList.add("on"); sc.onclick=closePanel;
  /* Bir ilan belirli bir alanı istediği için gelindiyse o alan panelin EN
     ÜSTÜNDE tek tıkla eklenebilir olarak durur.

     TİP KORUMASI ŞART: bu fonksiyon iki yerde `onclick=openProfilePanel`
     olarak bağlıydı ve parametre eklendiğinde tıklama olayı sessizce
     `wantField`a düştü — panelde "[object PointerEvent] beceri matrisinde
     karşılığı olmayan bir şart" yazdı. Bağlamalar düzeltildi ama koruma
     kalıyor: aynı hata bir daha eklenirse metne sızmaz. */
  S.wantField=(typeof wantField==="string" && wantField) ? wantField : null;
  /* Profil YEREL (D-059): ağ beklemeden anında çizilir. */
  S.profile=profileVM(); S.unlock=null; paintPanel(); loadUnlock();
}
/* "Şunu eklersen ≈N ilan değerlendirilir" önerileri. Sunucu bunun için tüm
   korpusu değerlendirdiğinden (~1 sn) panel açılışını BEKLETMEZ — arka planda
   gelir, panel hâlâ açıksa yerine oturur. */
async function loadUnlock(){
  try{ S.unlock=await jpost("/unlock-suggestions?limit=10", profilePayload()); }
  catch(e){ S.unlock=[]; }
  if($("#pnl")?.classList.contains("on")) paintPanel();
}
function closePanel(){
  $("#scrim").classList.remove("on"); $("#pnl").classList.remove("on");
  S.wantField=null;   // bir sonraki açılışta eski istek yapışıp kalmasın
}
function paintPanel(){ $("#pnl").innerHTML=panelBody(); wirePanel(); }

     :(S.unlock||[]).length?(S.unlock||[]).map(u=>`<div class="sug">

function wirePanel(){
  const drop=$("#drop"), inp=$("#cvFile");
  if(drop&&inp){
    drop.onclick=()=>inp.click();
    inp.onchange=()=>inp.files[0]&&uploadCV(inp.files[0]);
    /* Sürükle-bırak: tarayıcının kendi "dosyayı aç" davranışı bastırılmalı,
       yoksa PDF sekmede açılır ve yükleme hiç olmaz. */
    ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{
      e.preventDefault(); drop.classList.add("hot");}));
    ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{
      e.preventDefault(); drop.classList.remove("hot");}));
    drop.addEventListener("drop",e=>{
      const f=e.dataTransfer?.files?.[0]; if(f) uploadCV(f);});
  }
  /* Bütün profil yazımları YEREL (D-059): localStorage'a işlenir, feed yeni
     profille sunucudan yeniden istenir. Sunucuda hiçbir şey birikmez. */
  document.querySelectorAll("[data-ok]").forEach(b=>b.onclick=async()=>{
    const key=b.dataset.ok, p=lpActive(); if(!p) return;
    const yin=document.querySelector(`[data-sy="${CSS.escape(key)}"]`);
    const years=yin&&yin.value!==""?parseFloat(yin.value):null;
    b.disabled=true; b.textContent="…";
    if(!p.facts.some(f=>f.key===key))
      p.facts.push({key, verification:"user_asserted",
        years:Number.isFinite(years)?years:null});
    p.pending=(p.pending||[]).filter(s=>s.key!==key);
    await refreshAfterProfileChange();
  });
  document.querySelectorAll("[data-no]").forEach(b=>b.onclick=()=>{
    /* Reddetme yalnızca öneriyi düşürür; bir sonraki CV yüklemesinde yeniden
       önerilebilir. */
    const p=lpActive(); if(!p) return;
    p.pending=(p.pending||[]).filter(s=>s.key!==b.dataset.no);
    lpSave(); S.profile=profileVM(); paintPanel();
  });
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{
    const p=lpActive(); if(!p) return;
    p.facts=p.facts.filter(f=>f.key!==b.dataset.rm);
    await refreshAfterProfileChange();
  });
  document.querySelectorAll("[data-verify]").forEach(b=>b.onclick=async()=>{
    b.disabled=true; b.textContent="…";
    const p=lpActive(); if(!p) return;
    p.facts=p.facts.map(f=>f.key===b.dataset.verify
      ?{...f, verification:"verified"}:f);
    await refreshAfterProfileChange();
  });
  const sy=$("[data-savey]");
  if(sy) sy.onclick=async()=>{
    const p=lpActive(); if(!p) return;
    const v=parseFloat($("#totalYearsIn")?.value);
    /* Boş/geçersiz => null: "0 yıl" ile "bilmiyoruz" aynı şey değil (D-011). */
    p.total_years=Number.isFinite(v)?Math.max(0,Math.min(60,v)):null;
    sy.disabled=true; sy.textContent="…";
    await refreshAfterProfileChange();
  };
  document.querySelectorAll("[data-unlock]").forEach(b=>b.onclick=async()=>{
    b.disabled=true; b.textContent="…";
    const p=lpActive(); if(!p) return;
    if(!p.facts.some(f=>f.key===b.dataset.unlock))
      p.facts.push({key:b.dataset.unlock, verification:"user_asserted", years:null});
    S.unlock=(S.unlock||[]).filter(u=>u.key!==b.dataset.unlock);
    await refreshAfterProfileChange();
    loadUnlock();   // kalan sayılar bayatladı — yeniden ölç
  });
}

/* Profil değişti: yerele yaz, görünümü ve feed'i yenile. Paneli AÇIK bırakır —
   kullanıcı sırayla birkaç öneri onaylıyor olabilir. */
async function refreshAfterProfileChange(){
  lpSave(); syncProfiles(); S.profile=profileVM(); paintPanel();
  try{
    await loadFeed();
    const open=$("#pnl")?.classList.contains("on");
    render();
    if(open){ $("#scrim").classList.add("on"); $("#pnl").classList.add("on");
      $("#scrim").onclick=closePanel; paintPanel(); }
  }catch(e){ /* feed yenilenemese de profil değişikliği yerelde kayıtlı */ }
}

async function uploadCV(file){
  const drop=$("#drop");
  if(!/\.pdf$/i.test(file.name)){ alert("Yalnızca PDF kabul ediliyor."); return; }
  drop.innerHTML=`<span class="ic">⟳</span><div class="t">okunuyor…</div>
    <div class="d">${esc(file.name)}</div>`;
  const fd=new FormData(); fd.append("file",file);
  try{
    /* Durumsuz uç (D-059): sunucu ayrıştırır, önerir, UNUTUR. Bekleyen
       öneriler yalnızca bu tarayıcıdaki profile yazılır. */
    const r=await fetch(API+"/cv/suggest",{method:"POST",body:fd});
    const body=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(body.detail||r.statusText);
    S.cv=body;
    const p=lpActive();
    if(p){
      const have=new Set(p.facts.map(f=>f.key));
      p.pending=(body.suggestions||[]).filter(s=>!have.has(s.key));
      lpSave();
    }
    S.profile=profileVM();
    paintPanel();
  }catch(e){
    S.cv=null; paintPanel();
    alert("CV okunamadı: "+e.message);
  }
}

function wireApps(){

    if(a.status!=="applied") apEvent(a,a.status);

/* DOĞRULAMA KAPISI NOTU (D-080).

   Ölçüldü: "Özel güvenlik görevlisi" beyan eden profil 0 ilan görüyor; belge
   doğrulanmış işaretlenince 27. Kural doğru (D-012: belgesiz "karşılanıyor"

   Sıfır sonuç en kötü hâli; az sonuçta da aynı bilgi işe yarar, o yüzden
   sayı ne olursa olsun gösterilir. */
function verifyNote(){
  const v=(S.feed?.verify_unlocks||[]).filter(x=>x.unlocks>0);

  const satir=v.slice(0,3).map(x=>

  return `<div class="notice" style="border-left-color:var(--mid)">

    Profilinde belge isteyen alan var ama doğrulanmadığı için o ilanlarda
    "karşılanıyor" sayamıyoruz: ${satir}.
    <button class="btn-2" data-openpanel="1" data-field=""
      style="margin-left:8px; padding:5px 11px; font-size:10px">profilde doğrula →</button>
    <div class="fnote" style="margin-top:7px">Doğrulama şimdilik bir beyandır —
      belge yükleme akışı henüz yok, bunu açıkça söylüyoruz.</div>
  </div>`;
}

/* Kıdem tavanı notu (D-063). Bandın neden yükselmediğini söylemeyen bir tavan
   sessiz bir cezadır; kullanıcı gerekçeyi görmeli. Sunucu `**vurgu**` yollar,
   `rich()` yalnızca onu kalınlaştırır. */
function senNote(j){
  const p=[];
  if(j.seniority_note)
    p.push(`<b>Kıdem notu:</b> ${rich(j.seniority_note)}`);
  if(j.requirement_gap_note)
    p.push(`<b>Zorunlu şart:</b> ${rich(j.requirement_gap_note)}`);
  if(j.coverage_note)
    p.push(`<b>Kanıt oranı:</b> ${rich(j.coverage_note)}`);
  /* Kanıt miktarı (D-022) — en sık bağlayan tavan ama notu yoktu: kullanıcı
     ilanın iki şartını da karşılayıp "şartlı · güven düşük" görüyor ve ekranda
     hiçbir gerekçe bulamıyordu. */
  if(j.evidence_note)
    p.push(`<b>Kanıt miktarı:</b> ${rich(j.evidence_note)}`);
  return p.map(t=>`<div class="notice" style="margin-top:14px; border-left-color:var(--warn)">${t}</div>`).join('');
}

function pasteVerdict(j){
  const lit=GAUGE[j.band]||0;
  const line=(x,cls,ic)=>`<div class="lrow ${cls}"><span class="ic">${ic}</span>
    <div><div>${esc(x.text)}</div>${x.evidence?`<div class="ev">${esc(x.evidence)}</div>`:''}</div></div>`;
  const dh=t=>`<div class="dhead"><span class="t">// ${t}</span><span class="ln"></span></div>`;
  return `<div class="pcard ${j.band?'b-'+j.band:'b-none'}">
    <div class="dband ${j.band?'b-'+j.band:''}">
      ${j.band?`<span class="gauge">${[1,2,3,4].map(i=>`<i class="${i<=lit?'on':''}"></i>`).join('')}</span>`:''}
      <span class="bl">${esc(j.band_label||'Değerlendirilemedi')}${j.confidence_label?' · GÜVEN: '+esc(j.confidence_label.toUpperCase()):''}</span>
    </div>
    <h3 style="font-family:var(--disp); font-size:17px; margin-top:12px">${esc(j.title)}</h3>
    <div class="emp">${esc(j.employer)}${j.city?' · '+esc(j.city):''}${j.salary_text?' · '+esc(j.salary_text):''}</div>
    ${senNote(j)}
    ${j.worth_applying?`<div class="notice" style="margin-top:14px; border-left-color:var(--ph)">${esc(j.worth_applying)}</div>`:''}
    ${j.met?.length?dh(`karşıladıkların [${j.met.length}]`)+`<div class="ledger">${j.met.map(x=>line(x,'met','✓')).join('')}</div>`:''}
    ${j.unmet?.length?dh(`karşılamadıkların [${j.unmet.length}]`)+`<div class="ledger">${j.unmet.map(x=>line(x,'unmet','✕')).join('')}</div>`:''}
    ${j.unknown?.length?dh(`bilinmeyenler [${j.unknown.length}]`)+`<div class="ledger">${j.unknown.map(x=>line(x,'unk','?')).join('')}</div>`:''}
    ${(j.fairness_flags||[]).length?dh("adalet uyarısı")+
      (j.fairness_flags||[]).map(fl=>`<div class="notice" style="border-left-color:var(--bad)">
        ${esc(fl.note)}${fl.evidence?`<div class="ev">"${esc(fl.evidence)}"</div>`:''}</div>`).join(''):''}
    ${j.insufficient_data_note?`<div class="notice" style="margin-top:12px">${esc(j.insufficient_data_note)}</div>`:''}
    <div class="tag-l" style="margin-top:14px">${esc(j.disclaimer||'')}</div>
  </div>`;
}

function wirePaste(){
  const go=$("#pjGo"), out=$("#pjOut");
  if(!go) return;
  go.onclick=async()=>{
    const text=($("#pjText").value||"").trim();
    if(text.length<40){
      out.innerHTML=`<div class="notice" style="border-left-color:var(--warn)">
        İlan metni çok kısa — değerlendirme için en az <b>40 karakter</b> gerekiyor.</div>`;
      return;
    }
    go.disabled=true; go.textContent="DEĞERLENDİRİLİYOR…";
    out.innerHTML=`<div class="load" style="min-height:auto;padding:40px 0"><div class="radar"></div></div>`;
    try{
      /* Profil gövdede gider (D-061): sunucuda saklanmaz, yalnız bu
         değerlendirmede kullanılır. */
      S.paste=await jpost("/jobs/evaluate",{text,
        title:$("#pjTitle").value, employer:$("#pjEmp").value,
        city:$("#pjCity").value, url:$("#pjUrl").value,
        profile:profilePayload()});
      out.innerHTML=pasteVerdict(S.paste);
    }catch(e){
      out.innerHTML=`<div class="notice" style="border-left-color:var(--bad)">
        <b>Değerlendirilemedi:</b> ${esc(e.message)}</div>`;
    }finally{ const g=$("#pjGo"); if(g){g.disabled=false; g.textContent="DEĞERLENDİR";} }
  };
}

/* ---------------- kaynaklar (D-061) ----------------
   Şeffaflık sayfası: hangi kaynak, hangi izinle, hangi kanıtla. Bu ürünün
   iddiası "yalnızca izni kanıtlanmış kaynaklardan çekiyoruz" — iddiayı
   denetlenebilir kılmayan bir ürün onu yalnızca söylemiş olur. */
async function loadSources(){
  try{ S.sources=await api("/sources"); }catch(e){ S.sources=[]; }
  if(S.view==="sources") render();
}
const PERM_TR={allowed:"İZİNLİ", conditional:"ŞARTLI", rejected:"REDDEDİLDİ",
  unknown:"BİLİNMİYOR"};
function viewSources(){
  const list=S.sources;
  if(list===null) return `<div class="load"><div class="radar"></div><span>kaynaklar yükleniyor</span></div>`;
  const aktif=list.filter(s=>s.may_fetch_network).length;
  const red=list.filter(s=>s.scraping_permission==="rejected");
  return `
    <div class="console"><div class="console-row">
      <div class="stat"><div class="n">${list.length}</div><div class="l tag-l">kayıtlı kaynak</div></div>
      <div class="stat"><div class="n ph">${aktif}</div><div class="l tag-l">çekim açık</div></div>
      <div class="stat"><div class="n" style="color:var(--bad)">${red.length}</div><div class="l tag-l">reddedilmiş</div></div>
    </div></div>

    <div class="notice">İlanlar yalnızca <b>izni kaynağın kendi yayınında kanıtlanmış</b>
      uçlardan çekilir. Bunlar şirketlerin kariyer sayfası kurabilmesi için yayınladığı,
      kimlik doğrulaması istemeyen public API'lerdir; amaçlanan kullanım kullanıcıyı
      ilanın <b>kendi sayfasına</b> göndermektir — biz de öyle yapıyoruz.</div>

    <div class="notice" style="border-left-color:var(--bad); margin-top:11px">
      <b>LinkedIn ve Indeed çekilmiyor, çekilmeyecek.</b> LinkedIn'in okuma API'si yok
      ve robots.txt'i otomatik erişimi açıkça yasaklıyor; Indeed'in publisher API'si
      kapatıldı. <b>Bunları aşmanın yolu aranmıyor.</b> Orada gördüğün bir ilanı
      değerlendirmek istersen <button class="lnk" data-goto="paste">metnini yapıştır</button> —
      içeriği sen getirirsin, sunucu o adrese istek atmaz.</div>

    <div class="sec-h"><span class="t">// kaynak kaydı</span><span class="ln"></span></div>
    ${list.map(s=>`<article class="srow">
      <div class="stop">
        <div><b>${esc(s.name)}</b><div class="tag-l">${esc(s.source_id)} · ${esc(s.access_method)}</div></div>
        <div class="sflags">
          <span class="pill perm-${esc(s.scraping_permission)}">${PERM_TR[s.scraping_permission]||esc(s.scraping_permission)}</span>
          <span class="pill">RİSK: ${esc(s.policy_risk.toUpperCase())}</span>
          <span class="pill">${esc(s.status.toUpperCase())}</span>
          <span class="pill ${s.may_fetch_network?'net-on':'net-off'}">${s.may_fetch_network?'ÇEKİM AÇIK':'ÇEKİM KAPALI'}</span>
        </div>
      </div>
      ${s.note?`<div class="snote">${esc(s.note)}</div>`:''}
      ${s.permission_evidence?`<div class="sev"><b>İzin kanıtı:</b> ${esc(s.permission_evidence)}</div>`:''}
      ${s.attribution_required||s.redistribution_policy?`<div class="tag-l" style="margin-top:7px">
        ${s.attribution_required?'ATIF ZORUNLU':''}${s.attribution_required&&s.redistribution_policy?' · ':''}${s.redistribution_policy?esc(s.redistribution_policy.toUpperCase()):''}
      </div>`:''}
    </article>`).join('')}`;
}
function wireSources(){
  document.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{
    S.view=b.dataset.goto; render();});
}

/* ---------------- detay ---------------- */
function detailMarkup(){
  return `<div class="scrim" id="scrim"></div><aside class="detail" id="detail"></aside>
    <aside class="pnl" id="pnl"></aside>`;
}
async function openDetail(id){
  const sc=$("#scrim"), d=$("#detail");
  d.innerHTML=`<div class="load" style="min-height:auto;padding:70px 0"><div class="radar"></div></div>`;
  sc.classList.add("on"); d.classList.add("on"); sc.onclick=closeDetail;
  try{ const j=await jpost("/jobs/"+encodeURIComponent(id), profilePayload());
       d.innerHTML=detailBody(j); wireDetail(j); }
  catch(e){ d.innerHTML=`<button class="detail-close" onclick="closeDetail()">×</button>
    <p style="margin-top:50px">${esc(e.message)}</p>`; }
}
function closeDetail(){ $("#scrim").classList.remove("on"); $("#detail").classList.remove("on"); }

function detailBody(j){
  const bc=j.band?('b-'+j.band):'';
  const lit=GAUGE[j.band]||0;
  const line=(x,cls,ic)=>`<div class="lrow ${cls}"><span class="ic">${ic}</span>
    <div><div>${esc(x.text)}</div>${x.evidence?`<div class="ev">${esc(x.evidence)}</div>`:''}
    ${x.action_label?`<button class="btn-2" data-openpanel="1"
      data-field="${esc(x.action_field||'')}"
      style="margin-top:7px; padding:5px 11px; font-size:10px">${esc(x.action_label)} →</button>`:''}</div></div>`;
  const fair=(j.fairness_flags||[]);
  const dh=t=>`<div class="dhead"><span class="t">// ${t}</span><span class="ln"></span></div>`;
  return `<button class="detail-close" onclick="closeDetail()">×</button>
    <div class="dband ${bc}">
      ${j.band?`<span class="gauge">${[1,2,3,4].map(i=>`<i class="${i<=lit?'on':''}"></i>`).join('')}</span>`:''}
      <span class="bl">${esc(j.band_label||'Değerlendirilemedi')}${j.confidence_label?' · GÜVEN: '+esc(j.confidence_label.toUpperCase()):''}</span>
    </div>
    <h2>${esc(j.title)}</h2>
    <div class="emp"><b>${esc(j.employer)}</b>${j.city?' · '+esc(j.city):''}${j.salary_text?' · '+esc(j.salary_text):''}</div>
    <div class="dact">
      ${apFind(j.job_id)
        ?`<span class="pill applied">✓ BAŞVURULDUN · ${esc(AP_LABEL[apFind(j.job_id).status]||'')}</span>
          <button class="btn-2" data-goapps="1" style="padding:7px 12px; font-size:10.5px">başvurularımda aç</button>`
        :`<button class="btn" data-applied="1" style="padding:10px 18px; font-size:11.5px">✓ BAŞVURDUM</button>
          <span class="tag-l">başvurunu takip et — not al, yanıtı işaretle</span>`}
    </div>
    ${j.band&&!FB.has(j.job_id)?`
      <div class="fbx" id="fbx"><span class="tag-l">bu eşleşme isabetli mi?</span>
        <button class="fo" data-fb="up">👍 evet</button>
        <button class="fo" data-fb="down">👎 değil</button>
        <div id="fbWhy" style="display:none; margin-top:8px" class="fopts">
          ${["mesleğim değil","seviye uymuyor","konum uymuyor","şartlar yanlış okunmuş"]
            .map(r=>`<button class="fo" data-fbr="${esc(r)}">${esc(r)}</button>`).join('')}
        </div></div>`
      :j.band?`<div class="fbx tag-l">eşleşme geri bildirimin alındı ✓</div>`:''}
    ${senNote(j)}
    ${j.worth_applying?`<div class="notice" style="margin-top:16px; border-left-color:var(--ph)">${esc(j.worth_applying)}</div>`:''}
    ${j.met?.length?dh(`karşıladıkların [${j.met.length}]`)+`<div class="ledger">${j.met.map(x=>line(x,'met','✓')).join('')}</div>`:''}
    ${j.unmet?.length?dh(`karşılamadıkların [${j.unmet.length}]`)+`<div class="ledger">${j.unmet.map(x=>line(x,'unmet','✕')).join('')}</div>`:''}
    ${j.unknown?.length?dh(`bilinmeyenler [${j.unknown.length}]`)+`<div class="ledger">${j.unknown.map(x=>line(x,'unk','?')).join('')}</div>`:''}
    ${fair.length?dh('adalet uyarısı')+`
      <div class="notice ${fair.some(f=>f.severity==='hard')?'err':''}">Bu bir hukuki görüş <b>değildir</b>; bazı şartlar yasal olabilir.
      <ul style="margin:8px 0 0 18px">${fair.map(f=>`<li>${esc(f.note)} <span class="mut">"${esc(f.evidence)}"</span></li>`).join('')}</ul>
      ${fair.some(f=>f.severity==='hard')?`<div style="margin-top:8px"><a href="https://www.tihek.gov.tr" target="_blank" rel="noopener">TİHEK'e başvurabilirsin ↗</a></div>`:''}</div>`:''}
    ${j.description?dh('ilan metni')+`<div class="desc" id="desc">${descHTML(j.description)}</div>
      <button class="btn-ghost" id="descToggle" style="padding:10px 0">tamamını göster ▾</button>`:''}
    <div class="apply"><a class="btn" href="${esc(j.url)}" target="_blank" rel="noopener noreferrer">ilana git ↗</a></div>
    <p class="mut" style="font-size:12px">Başvuru ilanın kendi sayfasında yapılır. Biz aracı değiliz; başvurunu görmüyoruz.</p>
    ${j.disclaimer?`<p class="mut" style="font-size:11.5px; margin-top:14px">${esc(j.disclaimer)}</p>`:''}`;
}
function descHTML(t){
  return String(t||"").split("\n").map(l=>{l=l.trim(); if(!l) return "";
    if(l.startsWith("## ")) return `<h5>${esc(l.slice(3))}</h5>`;
    return `<div>${esc(l)}</div>`;}).join("");
}
function wireDetail(j){
  const t=$("#descToggle"); if(t) t.onclick=()=>{const d=$("#desc"); d.classList.toggle("open");
    t.textContent=d.classList.contains("open")?"daha az göster ▴":"tamamını göster ▾";};
  /* "Belgeyi doğrula" eylem etiketi profil paneline götürür — doğrulama orada,
     bağlamıyla (D-012 notu) birlikte yapılır. */
  document.querySelectorAll("#detail [data-openpanel]").forEach(b=>b.onclick=()=>{
    /* İSTENEN ALAN panele taşınır. Taşımadığımız sürece kullanıcı "Lise
       mezuniyeti ekle" diye yönlendirilip, o alanın bulunmadığı genel panele
       düşüyordu — istediğimiz şeyi vermenin yolunu kapatmak güven kırıyor. */
    closeDetail(); openProfilePanel(b.dataset.field||null);});
  /* Başvuru takibi: anlık kopya yerel kayda girer, anonim olay sunucuya. */
  const ap=$("#detail [data-applied]");
  if(ap) ap.onclick=()=>{ apAdd(j); $("#detail").innerHTML=detailBody(j); wireDetail(j); };
  const ga=$("#detail [data-goapps]");
  if(ga) ga.onclick=()=>{ closeDetail(); S.view="apps"; render(); };
  /* Eşleşme geri bildirimi: 👍 anında gider; 👎 sebep sorar. */
  document.querySelectorAll("#detail [data-fb]").forEach(b=>b.onclick=()=>{
    if(b.dataset.fb==="up"){ fbSend(j,"up",null);
      $("#fbx").outerHTML=`<div class="fbx tag-l">teşekkürler — kalibrasyona girdi ✓</div>`; }
    else{ $("#fbWhy").style.display="flex"; }
  });
  document.querySelectorAll("#detail [data-fbr]").forEach(b=>b.onclick=()=>{
    fbSend(j,"down",b.dataset.fbr);
    $("#fbx").outerHTML=`<div class="fbx tag-l">teşekkürler — kalibrasyona girdi ✓</div>`;
  });
}
document.addEventListener("keydown",e=>{if(e.key==="Escape") closeDetail();});

boot();
</script>
</body>
</html>
