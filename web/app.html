<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İşe Uygun</title>
<style>
/* ---------------------------------------------------------------------------
   Tasarım sistemi (D-046) — koyu, sade, tek aksan. Bilinçli tek tema.
   --------------------------------------------------------------------------- */
:root{
  --bg:#0a0d13; --bg-2:#0f131c; --panel:#141a26; --panel-2:#1a2130;
  --line:#232c3d; --line-2:#2f3a4f;
  --ink:#e8ecf4; --ink-2:#aeb8cc; --ink-3:#7a869e; --ink-4:#525d72;
  --accent:#5b9dff; --accent-2:#3b7ae0; --accent-soft:rgba(91,157,255,.14);
  --good:#48d597; --good-soft:rgba(72,213,151,.13);
  --warn:#f0b849; --warn-soft:rgba(240,184,73,.13);
  --bad:#f2716b; --bad-soft:rgba(242,113,107,.12);
  --r:14px; --r-sm:9px; --shadow:0 8px 30px rgba(0,0,0,.35);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  font-family:var(--sans); background:var(--bg); color:var(--ink);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font:inherit; cursor:pointer; border:0; background:none; color:inherit}
input,select{font:inherit; color:inherit}
a{color:var(--accent); text-decoration:none}
::selection{background:var(--accent-soft)}
.mut{color:var(--ink-3)}
.wrap{max-width:1080px; margin:0 auto; padding:0 22px}

/* ---- üst bar ---- */
.topbar{
  position:sticky; top:0; z-index:40; background:rgba(10,13,19,.82);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
}
.topbar .wrap{display:flex; align-items:center; gap:18px; height:62px}
.brand{font-size:19px; font-weight:700; letter-spacing:-.01em}
.brand b{color:var(--accent); font-weight:800}
.brand span{font-size:11px; color:var(--ink-4); font-weight:500; margin-left:8px}
.grow{flex:1}

/* ---- profil anahtarı ---- */
.psw{position:relative}
.psw-btn{
  display:flex; align-items:center; gap:9px; background:var(--panel);
  border:1px solid var(--line); border-radius:999px; padding:6px 8px 6px 14px;
  font-weight:600; font-size:13.5px; transition:border-color .15s;
}
.psw-btn:hover{border-color:var(--accent)}
.psw-dot{width:8px; height:8px; border-radius:50%; background:var(--accent)}
.psw-dot.blue{background:var(--warn)}
.psw-chev{color:var(--ink-3); font-size:11px}
.psw-menu{
  position:absolute; right:0; top:calc(100% + 8px); width:280px;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:7px; display:none;
}
.psw-menu.open{display:block; animation:pop .13s ease}
@keyframes pop{from{opacity:0; transform:translateY(-6px)}to{opacity:1; transform:none}}
.psw-item{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:9px 10px; border-radius:var(--r-sm); font-size:13.5px;
}
.psw-item:hover{background:var(--panel-2)}
.psw-item.active{background:var(--accent-soft)}
.psw-item .nm{flex:1; font-weight:600}
.psw-item .meta{font-size:11.5px; color:var(--ink-4)}
.psw-x{color:var(--ink-4); font-size:15px; padding:2px 6px; border-radius:6px}
.psw-x:hover{color:var(--bad); background:var(--bad-soft)}
.psw-new{
  display:flex; align-items:center; gap:8px; width:100%; padding:10px;
  margin-top:5px; border-top:1px solid var(--line); color:var(--accent);
  font-weight:600; font-size:13.5px;
}
.psw-new:hover{background:var(--accent-soft); border-radius:var(--r-sm)}

/* ---- butonlar ---- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  background:var(--accent); color:#06101f; font-weight:700; font-size:14px;
  padding:11px 20px; border-radius:var(--r-sm); transition:transform .08s, background .15s;
}
.btn:hover{background:#6ea8ff}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4; cursor:default}
.btn-2{background:var(--panel-2); color:var(--ink); border:1px solid var(--line); font-weight:600}
.btn-2:hover{border-color:var(--accent); background:var(--panel)}
.btn-ghost{color:var(--ink-2); font-weight:600; padding:11px 14px}
.btn-ghost:hover{color:var(--ink)}

/* ---- onboarding ---- */
.ob{min-height:calc(100vh - 62px); display:flex; align-items:center; justify-content:center; padding:40px 22px}
.ob-card{width:100%; max-width:620px}
.ob-prog{display:flex; gap:6px; margin-bottom:34px}
.ob-prog i{flex:1; height:4px; border-radius:2px; background:var(--line); transition:background .35s}
.ob-prog i.on{background:var(--accent)}
.ob-step{animation:slide .4s cubic-bezier(.2,.7,.2,1)}
@keyframes slide{from{opacity:0; transform:translateX(24px)}to{opacity:1; transform:none}}
.ob-eyebrow{font-size:12.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--accent); margin-bottom:14px}
.ob h1{font-size:30px; font-weight:800; letter-spacing:-.02em; line-height:1.15; margin-bottom:12px; text-wrap:balance}
.ob p.sub{color:var(--ink-2); font-size:16px; margin-bottom:30px; max-width:80%}
.ob-actions{display:flex; align-items:center; gap:14px; margin-top:34px}

/* seçim kartları */
.pick{display:grid; gap:12px}
.pick.two{grid-template-columns:1fr 1fr}
.pick.flow{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pick-card{
  text-align:left; background:var(--panel); border:1.5px solid var(--line);
  border-radius:var(--r); padding:20px; transition:border-color .15s, background .15s;
}
.pick-card:hover{border-color:var(--ink-3)}
.pick-card.sel{border-color:var(--accent); background:var(--accent-soft)}
.pick-card .emoji{font-size:26px; display:block; margin-bottom:10px}
.pick-card .t{font-weight:700; font-size:16px}
.pick-card .d{font-size:13px; color:var(--ink-3); margin-top:3px}
.pick-chip{
  padding:12px 16px; background:var(--panel); border:1.5px solid var(--line);
  border-radius:var(--r-sm); font-weight:600; font-size:14px; text-align:center;
}
.pick-chip:hover{border-color:var(--ink-3)}
.pick-chip.sel{border-color:var(--accent); background:var(--accent-soft); color:var(--ink)}

/* anahtar kelime seçimi */
.kw-group{margin-bottom:20px}
.kw-group h4{font-size:12.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3); margin-bottom:10px}
.kw-flow{display:flex; flex-wrap:wrap; gap:8px}
.kw{
  padding:8px 14px; background:var(--panel); border:1.5px solid var(--line);
  border-radius:999px; font-size:13.5px; font-weight:500; transition:all .12s;
}
.kw:hover{border-color:var(--ink-3)}
.kw.sel{border-color:var(--accent); background:var(--accent-soft); color:var(--ink); font-weight:600}
.kw.sel::before{content:"✓ "; color:var(--accent)}
.kw-add{display:flex; gap:9px; margin-top:6px}
.kw-add input{
  flex:1; background:var(--panel); border:1.5px solid var(--line);
  border-radius:var(--r-sm); padding:11px 14px; font-size:14px;
}
.kw-add input:focus{outline:none; border-color:var(--accent)}
.tag{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; background:var(--accent-soft);
  border-radius:999px; font-size:13px; font-weight:600; color:var(--ink)}
.tag b{cursor:pointer; color:var(--ink-3)} .tag b:hover{color:var(--bad)}
.name-in{
  width:100%; background:var(--panel); border:1.5px solid var(--line);
  border-radius:var(--r); padding:16px 18px; font-size:18px; font-weight:600;
}
.name-in:focus{outline:none; border-color:var(--accent)}

/* ---- feed ---- */
.feed{padding:26px 0 80px}
.hero{margin:6px 0 22px}
.hero h2{font-size:23px; font-weight:800; letter-spacing:-.01em}
.hero .mut{font-size:14px; margin-top:3px}
.searchbar{display:flex; gap:10px; margin:18px 0}
.searchbar .si{
  flex:1; display:flex; align-items:center; gap:10px; background:var(--panel);
  border:1.5px solid var(--line); border-radius:var(--r-sm); padding:0 16px;
}
.searchbar .si:focus-within{border-color:var(--accent)}
.searchbar input{flex:1; background:none; border:0; padding:13px 0; font-size:15px}
.searchbar input:focus{outline:none}
.searchbar .si svg{color:var(--ink-3); flex-shrink:0}
.chips{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px}
.chip{
  padding:8px 15px; background:var(--panel); border:1px solid var(--line);
  border-radius:999px; font-size:13px; font-weight:600; color:var(--ink-2); transition:all .12s;
}
.chip:hover{border-color:var(--ink-3); color:var(--ink)}
.chip.on{background:var(--accent-soft); border-color:var(--accent); color:var(--ink)}
.chip b{opacity:.65; margin-left:4px; font-weight:600}

.sec-h{display:flex; align-items:baseline; gap:12px; margin:26px 0 14px}
.sec-h h3{font-size:16px; font-weight:700}
.sec-h .n{font-size:13px; color:var(--ink-4); font-weight:600}
.sec-h .ln{flex:1; height:1px; background:var(--line)}

.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 20px; margin-bottom:12px; cursor:pointer; transition:border-color .15s, transform .08s;
  position:relative; overflow:hidden;
}
.card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--line-2)}
.card.b-strong::before{background:var(--good)} .card.b-good::before{background:var(--accent)}
.card.b-cond::before{background:var(--warn)} .card.b-weak::before{background:var(--bad)}
.card:hover{border-color:var(--ink-3); transform:translateY(-1px)}
.card-top{display:flex; align-items:flex-start; gap:14px}
.card-logo{
  width:42px; height:42px; border-radius:10px; background:var(--panel-2); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; color:var(--ink-2);
}
.card-main{flex:1; min-width:0}
.card h4{font-size:16px; font-weight:700; line-height:1.3}
.card-meta{display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin-top:5px; font-size:12.5px; color:var(--ink-3)}
.card-meta b{color:var(--ink-2); font-weight:600}
.dot{opacity:.4}
.band{
  flex-shrink:0; font-size:11.5px; font-weight:700; padding:5px 11px; border-radius:999px;
  background:var(--panel-2); color:var(--ink-2); white-space:nowrap;
}
.band.b-strong{background:var(--good-soft); color:var(--good)}
.band.b-good{background:var(--accent-soft); color:var(--accent)}
.band.b-cond{background:var(--warn-soft); color:var(--warn)}
.band.b-weak{background:var(--bad-soft); color:var(--bad)}
.card-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px}
.rq{font-size:12px; padding:4px 10px; border-radius:6px; background:var(--panel-2); color:var(--ink-3); font-weight:500}
.rq.on{background:var(--good-soft); color:var(--good)}
.rq.on::before{content:"✓ "}
.pill{font-size:11px; font-weight:700; padding:3px 9px; border-radius:5px}
.pill.pay{background:var(--good-soft); color:var(--good)}
.pill.age{background:var(--warn-soft); color:var(--warn)}
.pill.fair{background:var(--bad-soft); color:var(--bad)}

.empty{text-align:center; padding:70px 20px; color:var(--ink-3)}
.empty h3{color:var(--ink-2); font-weight:700; font-size:18px; margin-bottom:6px}
.more{display:block; margin:16px auto 0; padding:11px 22px}

/* ---- detay paneli (slide-in) ---- */
.scrim{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:60; opacity:0; pointer-events:none; transition:opacity .2s}
.scrim.on{opacity:1; pointer-events:auto}
.detail{
  position:fixed; top:0; right:0; bottom:0; width:min(560px,94vw); z-index:70;
  background:var(--bg-2); border-left:1px solid var(--line); box-shadow:var(--shadow);
  transform:translateX(100%); transition:transform .28s cubic-bezier(.2,.8,.2,1);
  overflow-y:auto; padding:26px 28px 60px;
}
.detail.on{transform:none}
.detail-close{position:absolute; top:20px; right:22px; width:34px; height:34px; border-radius:8px;
  background:var(--panel); border:1px solid var(--line); font-size:16px; color:var(--ink-2)}
.detail-close:hover{border-color:var(--accent); color:var(--ink)}
.detail h2{font-size:22px; font-weight:800; line-height:1.2; margin:8px 40px 6px 0}
.detail .emp{color:var(--ink-2); font-weight:600}
.ledger{display:flex; flex-direction:column; gap:7px; margin:6px 0 4px}
.lrow{display:flex; gap:10px; padding:11px 13px; background:var(--panel); border-radius:var(--r-sm); font-size:13.5px}
.lrow .ic{flex-shrink:0; font-weight:800}
.lrow.met .ic{color:var(--good)} .lrow.unmet .ic{color:var(--bad)} .lrow.unk .ic{color:var(--warn)}
.lrow .ev{color:var(--ink-3); font-size:12.5px; margin-top:2px}
.dhead{font-size:12.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3); margin:22px 0 10px}
.notice{background:var(--panel); border:1px solid var(--line); border-radius:var(--r-sm); padding:13px 15px; font-size:13.5px; color:var(--ink-2); margin-bottom:10px}
.notice.warn{border-color:rgba(242,113,107,.4); background:var(--bad-soft)}
.desc{font-size:13.5px; color:var(--ink-2); line-height:1.7; white-space:pre-wrap; max-height:280px; overflow:hidden; position:relative}
.desc.open{max-height:none}
.desc h5{color:var(--ink); font-weight:700; margin:12px 0 4px; font-size:13.5px}
.apply{display:flex; gap:10px; margin:22px 0 8px}
.apply .btn{flex:1}

/* yükleniyor */
.load{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:70vh; gap:16px; color:var(--ink-3)}
.spin{width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

@media(max-width:640px){
  .ob h1{font-size:25px} .ob p.sub{max-width:100%}
  .pick.two{grid-template-columns:1fr}
  .hero h2{font-size:20px}
}
</style>
</head>
<body>
<div id="root"><div class="load"><div class="spin"></div><span>Yükleniyor…</span></div></div>

<script>
const API="/api";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mono=s=>(s||"?").trim().slice(0,2).toUpperCase();

async function api(path,opts){
  const r=await fetch(API+path,opts);
  if(!r.ok){let m=r.statusText; try{m=(await r.json()).detail||m}catch(e){} throw new Error(m);}
  return r.status===204?null:r.json();
}
const jpost=(p,body)=>api(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});

// --------------------------------------------------------------------------
// Durum
// --------------------------------------------------------------------------
const S={profiles:[], catalog:[], feed:null, view:"load", detailJob:null,
  q:"", region:"", shownEv:PAGE_EV(), ob:null};
function PAGE_EV(){return 40;}

const CLUSTERS_BLUE=["Lojistik ve taşımacılık","Üretim ve teknik","Perakende ve hizmet",
  "Yiyecek ve turizm","Sağlık","İnşaat"];
const REGION_LABELS={"Türkiye":"🇹🇷 Türkiye","Avrupa":"🇪🇺 Avrupa","ABD":"🇺🇸 ABD",
  "Uzaktan":"🌐 Uzaktan","Diğer":"🌍 Diğer","Asya":"🌏 Asya"};

// --------------------------------------------------------------------------
// Açılış
// --------------------------------------------------------------------------
async function boot(){
  try{
    const [profiles,catalog]=await Promise.all([api("/profiles"),api("/catalog")]);
    S.profiles=profiles; S.catalog=catalog;
    if(!profiles.length){ startOnboarding(); }
    else{ await loadFeed(); render(); }
  }catch(e){
    $("#root").innerHTML=`<div class="load"><span>Bağlantı hatası: ${esc(e.message)}</span>
      <button class="btn" onclick="boot()">Tekrar dene</button></div>`;
  }
}
async function loadFeed(){ S.feed=await api("/feed"); }
const activeProfile=()=>S.profiles.find(p=>p.is_active)||null;

// --------------------------------------------------------------------------
// Render — üst düzey
// --------------------------------------------------------------------------
function render(){
  const root=$("#root");
  if(S.view==="onboarding"){ root.innerHTML=viewOnboarding(); wireOnboarding(); return; }
  root.innerHTML=topbar()+`<main class="wrap feed">${viewFeed()}</main>`+detailMarkup();
  wireFeed();
}

function topbar(){
  const p=activeProfile();
  return `<header class="topbar"><div class="wrap">
    <div class="brand">İşe<b>Uygun</b><span>dürüst iş eşleştirme</span></div>
    <div class="grow"></div>
    ${p?`<div class="psw" id="psw">
      <button class="psw-btn" id="pswBtn">
        <span class="psw-dot ${p.collar==='blue'?'blue':''}"></span>
        ${esc(p.name)} <span class="psw-chev">▼</span>
      </button>
      <div class="psw-menu" id="pswMenu">
        ${S.profiles.map(m=>`<div class="psw-item ${m.is_active?'active':''}" data-act="${m.id}">
          <span class="psw-dot ${m.collar==='blue'?'blue':''}"></span>
          <span class="nm">${esc(m.name)}</span>
          <span class="meta">${m.fact_count} alan</span>
          ${S.profiles.length>1?`<span class="psw-x" data-del="${m.id}" title="Sil">×</span>`:''}
        </div>`).join('')}
        <button class="psw-new" data-new="1">＋ Yeni profil oluştur</button>
      </div>
    </div>`:''}
  </div></header>`;
}

// --------------------------------------------------------------------------
// Onboarding sihirbazı
// --------------------------------------------------------------------------
function startOnboarding(){
  S.ob={step:0, collar:null, region:"", city:"", keys:new Set(), custom:[], name:""};
  S.view="onboarding"; render();
}
const OB_STEPS=["intro","collar","region","keywords","name"];

function viewOnboarding(){
  const o=S.ob, i=o.step;
  const prog=OB_STEPS.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('');
  return `<header class="topbar"><div class="wrap"><div class="brand">İşe<b>Uygun</b></div></div></header>
  <div class="ob"><div class="ob-card">
    <div class="ob-prog">${prog}</div>
    <div class="ob-step" id="obStep">${obStep(OB_STEPS[i])}</div>
  </div></div>`;
}

function obStep(step){
  const o=S.ob;
  if(step==="intro") return `
    <div class="ob-eyebrow">Hoş geldin</div>
    <h1>Sana gerçekten uyan işleri bulalım.</h1>
    <p class="sub">Birkaç kısa soruyla profilini kuracağız. Söz vermiyoruz —
      sadece hangi işin sana ne kadar uyduğunu dürüstçe gösteriyoruz.</p>
    <div class="ob-actions"><button class="btn" data-next="1">Başlayalım →</button></div>`;

  if(step==="collar") return `
    <div class="ob-eyebrow">1 / 4 · İş türü</div>
    <h1>Ne tür bir iş arıyorsun?</h1>
    <p class="sub">Bu, sana göstereceğimiz ilanları ve becerileri şekillendirir.</p>
    <div class="pick two">
      <button class="pick-card ${o.collar==='white'?'sel':''}" data-collar="white">
        <span class="emoji">💼</span><span class="t">Beyaz yaka</span>
        <span class="d">Ofis, yazılım, tasarım, satış, yönetim…</span></button>
      <button class="pick-card ${o.collar==='blue'?'sel':''}" data-collar="blue">
        <span class="emoji">🔧</span><span class="t">Mavi yaka</span>
        <span class="d">Üretim, lojistik, sağlık, hizmet, teknik…</span></button>
    </div>
    <div class="ob-actions">
      <button class="btn-ghost" data-back="1">← Geri</button>
      <button class="btn" data-next="1" ${o.collar?'':'disabled'}>Devam →</button>
    </div>`;

  if(step==="region"){
    const regions=(S.feed?.facets?.regions||[]).map(r=>r.name)
      .filter(n=>REGION_LABELS[n]);
    const base=regions.length?regions:["Türkiye","Avrupa","ABD","Uzaktan"];
    const cities=(S.feed?.facets?.cities||[]).filter(c=>/İstanbul|Ankara|İzmir|Bursa|Kocaeli|Antalya|Gebze/i.test(c)).slice(0,8);
    return `
    <div class="ob-eyebrow">2 / 4 · Konum</div>
    <h1>Nerede iş arıyorsun?</h1>
    <p class="sub">Önce bölge; Türkiye dersen şehir de seçebilirsin.</p>
    <div class="pick flow">
      <button class="pick-chip ${o.region===''?'sel':''}" data-region="">🌍 Fark etmez</button>
      ${base.map(n=>`<button class="pick-chip ${o.region===n?'sel':''}" data-region="${esc(n)}">${REGION_LABELS[n]||esc(n)}</button>`).join('')}
    </div>
    ${o.region==="Türkiye"&&cities.length?`
      <div style="margin-top:18px"><h4 class="mut" style="font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px">Şehir (isteğe bağlı)</h4>
      <div class="pick flow">
        <button class="pick-chip ${o.city===''?'sel':''}" data-city="">Tümü</button>
        ${cities.map(c=>`<button class="pick-chip ${o.city===c?'sel':''}" data-city="${esc(c)}">${esc(c.split(',')[0].split('/')[0].trim())}</button>`).join('')}
      </div></div>`:''}
    <div class="ob-actions">
      <button class="btn-ghost" data-back="1">← Geri</button>
      <button class="btn" data-next="1">Devam →</button>
    </div>`;
  }

  if(step==="keywords"){
    const items=selectableCatalog(o.collar);
    const groups={};
    items.forEach(it=>{ (groups[it.occupation_label||it.occupation_id]??=[]).push(it); });
    return `
    <div class="ob-eyebrow">3 / 4 · Beceriler</div>
    <h1>Hangileri sana uyuyor?</h1>
    <p class="sub">Seçtiklerin sana ilan önerirken kullanılır. Bulamadığını
      alta kendin yazabilirsin. CV yükleyerek de doldurabilirsin — sonra.</p>
    ${Object.entries(groups).map(([g,list])=>`
      <div class="kw-group"><h4>${esc(g)}</h4><div class="kw-flow">
        ${list.map(it=>`<button class="kw ${o.keys.has(it.key)?'sel':''}" data-key="${esc(it.key)}">${esc(it.label)}</button>`).join('')}
      </div></div>`).join('')}
    <div class="kw-group"><h4>Kendi anahtar kelimelerin</h4>
      <div class="kw-flow" id="customTags">${o.custom.map((c,i)=>`<span class="tag">${esc(c)} <b data-rmc="${i}">×</b></span>`).join('')}</div>
      <div class="kw-add">
        <input id="customIn" placeholder="ör. React, SAP, forklift…" maxlength="40">
        <button class="btn-2" data-addc="1">Ekle</button>
      </div>
    </div>
    <div class="ob-actions">
      <button class="btn-ghost" data-back="1">← Geri</button>
      <button class="btn" data-next="1">Devam →</button>
    </div>`;
  }

  if(step==="name"){
    const suggested=obSuggestName();
    return `
    <div class="ob-eyebrow">4 / 4 · Profil adı</div>
    <h1>Bu profile bir ad ver.</h1>
    <p class="sub">Birden çok profil tutabilirsin — biri "Eren-Yazılımcı",
      diğeri "Eren-Mavi yaka" gibi. İstediğin an aralarında geçersin.</p>
    <input class="name-in" id="nameIn" value="${esc(o.name||suggested)}" maxlength="80" placeholder="Profil adı">
    <div class="ob-actions">
      <button class="btn-ghost" data-back="1">← Geri</button>
      <button class="btn" data-finish="1">Profili oluştur ✓</button>
    </div>`;
  }
  return "";
}

function selectableCatalog(collar){
  let items=S.catalog.filter(i=>!i.needs_verification || true);
  if(collar==="blue") items=items.filter(i=>CLUSTERS_BLUE.includes(i.occupation_id));
  else if(collar==="white") items=items.filter(i=>!CLUSTERS_BLUE.includes(i.occupation_id));
  return items;
}
function obSuggestName(){
  const o=S.ob;
  const parts=[];
  const first=[...o.keys].map(k=>S.catalog.find(c=>c.key===k)?.label).filter(Boolean)[0];
  if(first) parts.push(first); else if(o.collar) parts.push(o.collar==='blue'?'Mavi yaka':'Beyaz yaka');
  if(o.city) parts.push(o.city.split(',')[0].split('/')[0].trim());
  else if(o.region) parts.push(o.region);
  return parts.join(' · ')||'Profilim';
}

function wireOnboarding(){
  const o=S.ob, step=$("#obStep");
  const go=(d)=>{ o.step=Math.max(0,Math.min(OB_STEPS.length-1,o.step+d)); render(); };
  step.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>go(1));
  step.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>go(-1));
  step.querySelectorAll("[data-collar]").forEach(b=>b.onclick=()=>{o.collar=b.dataset.collar; o.keys.clear(); render();});
  step.querySelectorAll("[data-region]").forEach(b=>b.onclick=()=>{o.region=b.dataset.region; o.city=""; render();});
  step.querySelectorAll("[data-city]").forEach(b=>b.onclick=()=>{o.city=b.dataset.city; render();});
  step.querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.key; o.keys.has(k)?o.keys.delete(k):o.keys.add(k); b.classList.toggle("sel");
  });
  const addC=()=>{const inp=$("#customIn"); const v=(inp.value||"").trim();
    if(v && !o.custom.includes(v)){o.custom.push(v);} render(); setTimeout(()=>$("#customIn")?.focus(),0);};
  step.querySelector("[data-addc]")?.addEventListener("click",addC);
  $("#customIn")?.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault(); addC();}});
  step.querySelectorAll("[data-rmc]").forEach(b=>b.onclick=()=>{o.custom.splice(+b.dataset.rmc,1); render();});
  const nm=$("#nameIn"); if(nm) nm.oninput=()=>{o.name=nm.value;};
  step.querySelector("[data-finish]")?.addEventListener("click",finishOnboarding);
}

async function finishOnboarding(){
  const o=S.ob;
  const name=(o.name|| $("#nameIn")?.value ||obSuggestName()).trim()||"Profilim";
  const attrs={region:o.region, city:o.city, keywords:o.custom};
  $("#root").innerHTML=`<div class="load"><div class="spin"></div><span>Profilin hazırlanıyor…</span></div>`;
  try{
    S.profiles=await jpost("/profiles",{name, collar:o.collar, attrs, fact_keys:[...o.keys]});
    // Bölge tercihi varsayılan filtre olur; arama BOŞ başlar. Özel kelimeleri
    // aramaya zorlamak feed'i tek sonuca düşürüp kafa karıştırıyordu — onlar
    // profilde saklanır, kullanıcı isterse arama kutusunda kullanır.
    S.region=o.region||""; S.q=""; S.shownEv=PAGE_EV();
    await loadFeed(); S.view="feed"; S.ob=null; render();
  }catch(e){ alert("Hata: "+e.message); boot(); }
}

// --------------------------------------------------------------------------
// Feed
// --------------------------------------------------------------------------
function matches(j){
  if(S.region && !(j.regions||[]).includes(S.region)) return false;
  if(S.q){
    const hay=(j.title+" "+j.employer+" "+j.city+" "+(j.top_requirements||[]).join(" ")).toLowerCase();
    if(!S.q.toLowerCase().split(/\s+/).every(w=>hay.includes(w))) return false;
  }
  return true;
}

function viewFeed(){
  const f=S.feed; if(!f) return "";
  const p=activeProfile();
  const ev=(f.evaluated||[]).filter(matches);
  const un=(f.unevaluated||[]).filter(matches);
  const regions=(f.facets?.regions||[]);

  return `
    <div class="hero">
      <h2>Merhaba${p?', '+esc(p.name.split('-')[0].split('·')[0].trim()):''} 👋</h2>
      <div class="mut">${ev.length} ilan sana göre değerlendirildi · ${un.length} ilan için profilinde bilgi eksik</div>
    </div>
    <div class="searchbar">
      <div class="si">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" placeholder="Pozisyon, şirket, beceri ara…" value="${esc(S.q)}">
      </div>
    </div>
    <div class="chips">
      <button class="chip ${S.region===''?'on':''}" data-region="">Tüm bölgeler</button>
      ${regions.map(r=>`<button class="chip ${S.region===r.name?'on':''}" data-region="${esc(r.name)}">${REGION_LABELS[r.name]||esc(r.name)}<b>${r.count}</b></button>`).join('')}
    </div>

    ${ev.length?`<div class="sec-h"><h3>Sana göre</h3><span class="n">${ev.length}</span><span class="ln"></span></div>
      ${ev.slice(0,S.shownEv).map(card).join('')}
      ${ev.length>S.shownEv?`<button class="btn-2 more" data-more="1">${Math.min(40,ev.length-S.shownEv)} ilan daha</button>`:''}`
    : `<div class="empty"><h3>Bu filtrelerle sana uygun ilan yok</h3><p>Filtreleri gevşet ya da profiline beceri ekle.</p></div>`}

    ${un.length?`<div class="sec-h"><h3>Değerlendirilemeyenler</h3><span class="n">${un.length}</span><span class="ln"></span></div>
      <div class="notice" style="margin-bottom:14px">Bu ilanları <b>okuyamadık</b> ya da profilinde karşılaştıracak bilgi yok — <b>sana uymuyor demek değil</b>. Profiline beceri ekledikçe buradan yukarı taşınırlar.</div>
      ${un.slice(0,12).map(card).join('')}`:''}
  `;
}

function card(j){
  const bc=j.band?('b-'+j.band):'b-none';
  const bandTxt=j.band_label||(j.listing_only?'Kamu ilanı':'Değerlendirilemedi');
  const met=new Set(j.matched_requirements||[]);
  const tags=(j.top_requirements||[]).slice(0,4).map(r=>`<span class="rq ${met.has(r)?'on':''}">${esc(r)}</span>`).join('');
  const pills=[];
  if(j.salary_status==='found'&&j.salary_text) pills.push(`<span class="pill pay">${esc(j.salary_text)}</span>`);
  if(j.long_open) pills.push(`<span class="pill age">${j.age_days} gündür açık</span>`);
  if((j.fairness_flags||[]).some(f=>f.severity==='hard')) pills.push(`<span class="pill fair">⚠ ayrımcı ifade</span>`);
  return `<article class="card ${bc}" data-job="${esc(j.job_id)}">
    <div class="card-top">
      <div class="card-logo">${esc(mono(j.employer))}</div>
      <div class="card-main">
        <h4>${esc(j.title)}</h4>
        <div class="card-meta"><b>${esc(j.employer)}</b>
          ${j.city?`<span class="dot">·</span>${esc(j.city)}`:''}
          ${j.age_days!=null&&!j.long_open?`<span class="dot">·</span>${j.age_days} gün önce`:''}
          ${(j.regions||[]).filter(r=>r!=='Diğer').slice(0,1).map(r=>`<span class="dot">·</span>${REGION_LABELS[r]||esc(r)}`).join('')}
        </div>
        ${pills.length?`<div class="card-tags">${pills.join('')}</div>`:''}
        ${tags?`<div class="card-tags">${tags}</div>`:''}
      </div>
      <span class="band ${bc}">${esc(bandTxt)}</span>
    </div>
  </article>`;
}

function wireFeed(){
  // profil anahtarı
  const pb=$("#pswBtn"); if(pb) pb.onclick=e=>{e.stopPropagation(); $("#pswMenu").classList.toggle("open");};
  document.addEventListener("click",()=>$("#pswMenu")?.classList.remove("open"),{once:true});
  document.querySelectorAll("[data-act]").forEach(el=>el.onclick=async()=>{
    S.profiles=await jpost(`/profiles/${el.dataset.act}/activate`); const a=activeProfile();
    // Profil değişince arama ve sayfalama sıfırlanır; bölge profilin tercihine
    // döner. Aksi halde önceki profilin araması yeni profilde de süzüyordu.
    S.region=a?.attrs?.region||""; S.q=""; S.shownEv=PAGE_EV();
    await loadFeed(); render();
  });
  document.querySelectorAll("[data-del]").forEach(el=>el.onclick=async(e)=>{
    e.stopPropagation();
    if(!confirm("Bu profil silinsin mi?")) return;
    try{ S.profiles=await api(`/profiles/${el.dataset.del}`,{method:"DELETE"}); await loadFeed(); render(); }
    catch(err){ alert(err.message); }
  });
  $("[data-new]")&&($("[data-new]").onclick=startOnboarding);
  // arama + filtre
  const q=$("#q"); if(q) q.oninput=()=>{S.q=q.value; S.shownEv=PAGE_EV(); const c=q.selectionStart; repaint(); const n=$("#q"); if(n){n.focus(); n.setSelectionRange(c,c);}};
  document.querySelectorAll("[data-region]").forEach(el=>el.onclick=()=>{S.region=el.dataset.region; S.shownEv=PAGE_EV(); repaint();});
  $("[data-more]")&&($("[data-more]").onclick=()=>{S.shownEv+=40; repaint();});
  document.querySelectorAll("[data-job]").forEach(el=>el.onclick=()=>openDetail(el.dataset.job));
}
function repaint(){ $(".feed").innerHTML=viewFeed(); wireFeed(); }

// --------------------------------------------------------------------------
// Detay
// --------------------------------------------------------------------------
function detailMarkup(){ return `<div class="scrim" id="scrim"></div><aside class="detail" id="detail"></aside>`; }
async function openDetail(id){
  const sc=$("#scrim"), d=$("#detail");
  d.innerHTML=`<div class="load" style="min-height:auto;padding:60px 0"><div class="spin"></div></div>`;
  sc.classList.add("on"); d.classList.add("on");
  sc.onclick=closeDetail;
  try{ const j=await api("/jobs/"+encodeURIComponent(id)); d.innerHTML=detailBody(j); wireDetail(j); }
  catch(e){ d.innerHTML=`<button class="detail-close" onclick="closeDetail()">×</button><p style="margin-top:40px">${esc(e.message)}</p>`; }
}
function closeDetail(){ $("#scrim").classList.remove("on"); $("#detail").classList.remove("on"); }

function detailBody(j){
  const bc=j.band?('b-'+j.band):'';
  const line=(x,cls,ic)=>`<div class="lrow ${cls}"><span class="ic">${ic}</span><div><div>${esc(x.text)}</div>${x.evidence?`<div class="ev">${esc(x.evidence)}</div>`:''}</div></div>`;
  const fair=(j.fairness_flags||[]);
  return `<button class="detail-close" onclick="closeDetail()">×</button>
    ${j.band?`<span class="band ${bc}">${esc(j.band_label)}${j.confidence_label?' · Güven: '+esc(j.confidence_label):''}</span>`:`<span class="band">Değerlendirilemedi</span>`}
    <h2>${esc(j.title)}</h2>
    <div class="emp">${esc(j.employer)}${j.city?' · '+esc(j.city):''}${j.salary_text?' · '+esc(j.salary_text):''}</div>
    ${j.worth_applying?`<div class="notice" style="margin-top:16px">${esc(j.worth_applying)}</div>`:''}
    ${j.met?.length?`<div class="dhead">Karşıladıkların (${j.met.length})</div><div class="ledger">${j.met.map(x=>line(x,'met','✓')).join('')}</div>`:''}
    ${j.unmet?.length?`<div class="dhead">Karşılamadıkların (${j.unmet.length})</div><div class="ledger">${j.unmet.map(x=>line(x,'unmet','✕')).join('')}</div>`:''}
    ${j.unknown?.length?`<div class="dhead">Bilinmeyenler (${j.unknown.length})</div><div class="ledger">${j.unknown.map(x=>line(x,'unk','?')).join('')}</div>`:''}
    ${fair.length?`<div class="dhead">Adalet uyarısı</div>
      <div class="notice ${fair.some(f=>f.severity==='hard')?'warn':''}">Bu bir hukuki görüş <b>değildir</b>; bazı şartlar yasal olabilir.<ul style="margin:8px 0 0 18px">${fair.map(f=>`<li>${esc(f.note)} <span class="mut">“${esc(f.evidence)}”</span></li>`).join('')}</ul>
      ${fair.some(f=>f.severity==='hard')?`<div style="margin-top:8px"><a href="https://www.tihek.gov.tr" target="_blank" rel="noopener">TİHEK'e başvurabilirsin ↗</a></div>`:''}</div>`:''}
    ${j.description?`<div class="dhead">İlan metni</div><div class="desc" id="desc">${descHTML(j.description)}</div>
      <button class="btn-ghost" id="descToggle" style="padding:8px 0">Tamamını göster</button>`:''}
    <div class="apply">
      <a class="btn" href="${esc(j.url)}" target="_blank" rel="noopener noreferrer">İlana git ↗</a>
    </div>
    <p class="mut" style="font-size:12px; margin-top:6px">Başvuru ilanın kendi sayfasından yapılır. Biz aracı değiliz, başvurunu görmüyoruz.</p>
    ${j.disclaimer?`<p class="mut" style="font-size:11.5px; margin-top:14px">${esc(j.disclaimer)}</p>`:''}`;
}
function descHTML(t){
  return String(t||"").split("\n").map(l=>{
    l=l.trim(); if(!l) return "";
    if(l.startsWith("## ")) return `<h5>${esc(l.slice(3))}</h5>`;
    return `<div>${esc(l)}</div>`;
  }).join("");
}
function wireDetail(j){
  const t=$("#descToggle"); if(t) t.onclick=()=>{const d=$("#desc"); d.classList.toggle("open"); t.textContent=d.classList.contains("open")?"Daha az göster":"Tamamını göster";};
}
document.addEventListener("keydown",e=>{if(e.key==="Escape") closeDetail();});

boot();
</script>
</body>
</html>
