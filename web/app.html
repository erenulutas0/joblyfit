<style>
/* ==========================================================================
   D-046v2 — "Komuta konsolu" tasarım sistemi.
   Ürünün kimliğinden türetildi: bu bir tarama/kanıt makinesi. Radar konsolu
   dili — fosfor yeşili, mono veri etiketleri, köşe nişangahları, segmentli
   bant göstergesi. Bilinçli tek tema (koyu); jenerik dark-panel + mavi aksan
   şablonundan kaçınmak tasarımın kendisi.
   ========================================================================== */
:root{
  /* zemin — saf siyah değil; yeşile kayan grafitler */
  --bg:#050806;      --bg-2:#070b09;    --panel:#0a0f0c;   --panel-2:#0e1511;
  --line:#16211b;    --line-2:#203027;
  /* mürekkep */
  --ink:#dbe7df;     --ink-2:#9fb3a8;   --ink-3:#647a6e;   --ink-4:#405349;
  /* fosfor — tek gerçek aksan */
  --ph:#46f2a4;      --ph-dim:#2bbf7e;  --ph-soft:rgba(70,242,164,.09);
  --ph-line:rgba(70,242,164,.28);
  /* durum renkleri (bant) */
  --good:#46f2a4;    --good-soft:rgba(70,242,164,.10);
  --mid:#59c8ff;     --mid-soft:rgba(89,200,255,.10);
  --warn:#ffc153;    --warn-soft:rgba(255,193,83,.10);
  --bad:#ff6f61;     --bad-soft:rgba(255,111,97,.10);
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --disp:"Unbounded",system-ui,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0}
html{scrollbar-color:var(--line-2) var(--bg)}
body{
  font-family:var(--sans); color:var(--ink); font-size:15px; line-height:1.6;
  background:
    radial-gradient(1100px 500px at 70% -10%, rgba(70,242,164,.05), transparent 60%),
    repeating-linear-gradient(0deg, transparent 0 39px, rgba(70,242,164,.022) 39px 40px),
    repeating-linear-gradient(90deg, transparent 0 39px, rgba(70,242,164,.022) 39px 40px),
    var(--bg);
  min-height:100vh; overflow-x:hidden; -webkit-font-smoothing:antialiased;
}
button{font:inherit; cursor:pointer; border:0; background:none; color:inherit}
input{font:inherit; color:inherit}
a{color:var(--ph); text-decoration:none}
::selection{background:rgba(70,242,164,.25)}
.wrap{max-width:1060px; margin:0 auto; padding:0 24px}

/* -- mono veri etiketi: sistemin imzası -- */
.tag-l{font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3)}
.tag-l b{color:var(--ph); font-weight:600}

/* ==================== üst bar ==================== */
.topbar{position:sticky; top:0; z-index:40;
  background:linear-gradient(rgba(5,8,6,.92),rgba(5,8,6,.85));
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex; align-items:center; gap:20px; height:60px}
.brand{display:inline-flex; align-items:center; gap:9px; font-family:var(--disp);
  font-size:15px; font-weight:800; letter-spacing:.01em; line-height:1}
.brand em{font-style:normal; color:var(--ph)}
.brand .blogo{flex-shrink:0; display:block;
  filter:drop-shadow(0 0 5px rgba(70,242,164,.22))}
.brand .bwm{white-space:nowrap}
.sysline{display:flex; align-items:center; gap:8px}
.sysdot{width:6px; height:6px; border-radius:50%; background:var(--ph);
  box-shadow:0 0 8px var(--ph); animation:blink 2.4s infinite}
@keyframes blink{0%,88%{opacity:1}94%{opacity:.25}100%{opacity:1}}
.grow{flex:1}

/* profil anahtarı */
.psw{position:relative}
.psw-btn{display:flex; align-items:center; gap:10px; padding:7px 12px;
  border:1px solid var(--line-2); background:var(--panel);
  font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.06em;
  transition:border-color .15s}
.psw-btn:hover{border-color:var(--ph-line)}
.psw-btn .cv{color:var(--ink-4); font-size:9px}
.collar-dot{width:7px; height:7px; background:var(--ph)}
.collar-dot.blue{background:var(--warn)}
.psw-menu{position:absolute; right:0; top:calc(100% + 10px); width:300px;
  background:var(--panel); border:1px solid var(--line-2); padding:6px; display:none;
  box-shadow:0 20px 50px rgba(0,0,0,.5)}
.psw-menu.open{display:block; animation:drop .14s ease}
@keyframes drop{from{opacity:0; transform:translateY(-5px)}to{opacity:1}}
.psw-item{display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:10px 11px; font-size:13.5px; border:1px solid transparent}
.psw-item:hover{background:var(--panel-2)}
.psw-item.active{border-color:var(--ph-line); background:var(--ph-soft)}
.psw-item .nm{flex:1; font-weight:600}
.psw-item .meta{font-family:var(--mono); font-size:10px; color:var(--ink-4)}
.psw-x{color:var(--ink-4); padding:2px 7px}
.psw-x:hover{color:var(--bad)}
.psw-new{display:block; width:100%; padding:11px; margin-top:5px; text-align:center;
  border-top:1px solid var(--line); color:var(--ph); font-family:var(--mono);
  font-size:11.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase}
.psw-new:hover{background:var(--ph-soft)}

/* ==================== butonlar ==================== */
.btn{display:inline-flex; align-items:center; gap:9px; padding:13px 24px;
  background:var(--ph); color:#03130b; font-family:var(--mono); font-size:12.5px;
  font-weight:700; letter-spacing:.09em; text-transform:uppercase;
  clip-path:polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
  transition:filter .12s, transform .08s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.35; cursor:default}
.btn-2{display:inline-flex; align-items:center; gap:8px; padding:12px 20px;
  border:1px solid var(--line-2); color:var(--ink-2); background:var(--panel);
  font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.07em;
  text-transform:uppercase; transition:border-color .15s, color .15s}
.btn-2:hover{border-color:var(--ph-line); color:var(--ink)}
.btn-ghost{padding:12px 14px; color:var(--ink-3); font-family:var(--mono);
  font-size:12px; letter-spacing:.07em; text-transform:uppercase}
.btn-ghost:hover{color:var(--ink)}

/* ==================== nişangah köşeleri ==================== */
.reticle{position:relative}
.reticle::before,.reticle::after{content:""; position:absolute; width:14px; height:14px;
  border:1.5px solid var(--ph); opacity:0; transition:opacity .15s}
.reticle::before{top:-1px; left:-1px; border-right:0; border-bottom:0}
.reticle::after{bottom:-1px; right:-1px; border-left:0; border-top:0}
.reticle:hover::before,.reticle:hover::after,
.reticle.sel::before,.reticle.sel::after{opacity:1}

/* ==================== onboarding ==================== */
.ob{min-height:calc(100vh - 60px); display:flex; align-items:center;
  justify-content:center; padding:48px 24px}
.ob-card{width:100%; max-width:640px}
.ob-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:38px}
.ob-idx{font-family:var(--mono); font-size:12px; color:var(--ink-3); letter-spacing:.12em}
.ob-idx b{color:var(--ph); font-size:20px; font-weight:700}
.ob-prog{display:flex; gap:5px}
.ob-prog i{width:34px; height:3px; background:var(--line-2); transition:background .3s}
.ob-prog i.on{background:var(--ph); box-shadow:0 0 8px rgba(70,242,164,.5)}
.ob-step{animation:stepin .38s cubic-bezier(.2,.75,.25,1)}
@keyframes stepin{from{opacity:0; transform:translateX(26px)}to{opacity:1; transform:none}}
.ob h1{font-family:var(--disp); font-size:27px; font-weight:800; line-height:1.25;
  letter-spacing:-.005em; margin:14px 0 12px; text-wrap:balance}
.ob .sub{color:var(--ink-2); font-size:15px; max-width:88%; margin-bottom:30px}
.ob-actions{display:flex; align-items:center; gap:16px; margin-top:36px}

.pick{display:grid; gap:12px}
.pick.two{grid-template-columns:1fr 1fr}
.pick.flow{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pick-card{text-align:left; background:var(--panel); border:1px solid var(--line-2);
  padding:22px; transition:border-color .15s, background .15s}
.pick-card:hover{border-color:var(--ink-3)}
.pick-card.sel{border-color:var(--ph-line); background:var(--ph-soft)}
.pick-card .ic{font-family:var(--mono); font-size:11px; font-weight:700;
  letter-spacing:.14em; color:var(--ph); display:block; margin-bottom:12px}
.pick-card .t{font-family:var(--disp); font-weight:600; font-size:15.5px}
.pick-card .d{font-size:13px; color:var(--ink-3); margin-top:6px; line-height:1.5}
.pick-chip{padding:13px 14px; background:var(--panel); border:1px solid var(--line-2);
  font-family:var(--mono); font-size:12.5px; font-weight:600; letter-spacing:.04em;
  text-align:center; transition:border-color .15s, background .15s}
.pick-chip:hover{border-color:var(--ink-3)}
.pick-chip.sel{border-color:var(--ph-line); background:var(--ph-soft); color:var(--ph)}

.kw-group{margin-bottom:22px}
.kw-flow{display:flex; flex-wrap:wrap; gap:8px}
.kw{padding:8px 14px; background:var(--panel); border:1px solid var(--line-2);
  font-size:13px; font-weight:500; transition:all .12s}
.kw:hover{border-color:var(--ink-3)}
.kw.sel{border-color:var(--ph-line); background:var(--ph-soft); color:var(--ph); font-weight:600}
.kw-add{display:flex; gap:9px; margin-top:8px}
.kw-add input{flex:1; background:var(--panel); border:1px solid var(--line-2);
  padding:12px 14px; font-size:14px}
.kw-add input:focus{outline:none; border-color:var(--ph-line)}
.tagx{display:inline-flex; align-items:center; gap:7px; padding:7px 13px;
  background:var(--ph-soft); border:1px solid var(--ph-line);
  font-family:var(--mono); font-size:12px; color:var(--ph)}
.tagx b{cursor:pointer; color:var(--ink-3)} .tagx b:hover{color:var(--bad)}
.name-in{width:100%; background:var(--panel); border:1px solid var(--line-2);
  padding:17px 18px; font-family:var(--disp); font-size:17px; font-weight:600}
.name-in:focus{outline:none; border-color:var(--ph-line)}

/* ==================== feed ==================== */
.feed{padding:30px 0 90px}

/* konsol başlığı */
.console{border:1px solid var(--line-2); background:var(--panel); padding:20px 22px 18px;
  position:relative; overflow:hidden; margin-bottom:22px}
.console::after{content:""; position:absolute; left:0; right:0; top:0; height:1px;
  background:linear-gradient(90deg, transparent, var(--ph), transparent);
  animation:sweep 5s linear infinite; opacity:.7}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.console-row{display:flex; flex-wrap:wrap; gap:28px; align-items:flex-end}
.stat .n{font-family:var(--disp); font-size:30px; font-weight:800; line-height:1;
  color:var(--ink)}
.stat .n.ph{color:var(--ph); text-shadow:0 0 18px rgba(70,242,164,.35)}
.stat .l{margin-top:7px}
.console-hi{margin-left:auto; text-align:right; max-width:300px}
.console-hi .who{font-family:var(--disp); font-size:15px; font-weight:600}
.console-hi .sub{font-size:12px; color:var(--ink-3); margin-top:3px}

/* arama */
.searchbar{display:flex; gap:10px; margin:0 0 14px}
.si{flex:1; display:flex; align-items:center; gap:12px; background:var(--panel);
  border:1px solid var(--line-2); padding:0 16px; transition:border-color .15s}
.si:focus-within{border-color:var(--ph-line); box-shadow:0 0 0 1px var(--ph-line)}
.si .pfx{font-family:var(--mono); color:var(--ph); font-weight:700; font-size:13px}
.si input{flex:1; background:none; border:0; padding:14px 0; font-size:15px}
.si input:focus{outline:none}
.si input::placeholder{color:var(--ink-4)}

/* bölge chip'leri */
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:6px}
.chip{display:inline-flex; align-items:center; gap:8px; padding:8px 14px;
  background:var(--panel); border:1px solid var(--line-2); font-family:var(--mono);
  font-size:11.5px; font-weight:600; letter-spacing:.05em; color:var(--ink-2);
  transition:all .13s}
.chip:hover{border-color:var(--ink-3); color:var(--ink)}
.chip.on{border-color:var(--ph-line); background:var(--ph-soft); color:var(--ph)}
.chip .cc{color:var(--ph); font-weight:700}
.chip.on .cc{color:inherit}
.chip b{opacity:.55; font-weight:600}

/* ==================== filtre paneli ==================== */
.fbar{display:flex; align-items:center; gap:12px; margin:12px 0 4px}
.fbar .ln{flex:1; height:1px; background:linear-gradient(90deg,var(--line-2),transparent)}
.ftoggle{display:inline-flex; align-items:center; gap:9px; font-family:var(--mono);
  font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); padding:6px 0}
.ftoggle:hover{color:var(--ink)}
.ftoggle .ar{color:var(--ph); font-size:9px; transition:transform .18s}
.ftoggle.open .ar{transform:rotate(90deg)}
.ftoggle .cnt{color:var(--ph)}
.fpanel{display:none; border:1px solid var(--line-2); background:var(--panel);
  padding:18px 20px 16px; margin-bottom:8px}
.fpanel.open{display:block; animation:drop .16s ease}
.frow{margin-bottom:16px}
.frow:last-of-type{margin-bottom:0}
.frow>.tag-l{display:block; margin-bottom:9px}
.fopts{display:flex; flex-wrap:wrap; gap:7px}
/* Kıdem seçenekleri merdiven sırasında; sıra bilgi taşır (giriş → tepe). */
.fo{padding:7px 12px; background:var(--panel-2); border:1px solid var(--line);
  font-family:var(--mono); font-size:11.5px; font-weight:600; letter-spacing:.04em;
  color:var(--ink-2); transition:all .12s}
.fo:hover{border-color:var(--ink-3); color:var(--ink)}
.fo.on{border-color:var(--ph-line); background:var(--ph-soft); color:var(--ph)}
.fo b{opacity:.5; font-weight:600; margin-left:5px}
/* Şehir listesi uzun olabilir (Avrupa'da 421 grup) — kaydırılır, sayfa değil. */
.fopts.scroll{max-height:132px; overflow-y:auto; padding-right:4px;
  scrollbar-width:thin; align-content:flex-start}
.fsearch{width:100%; max-width:260px; background:var(--panel-2);
  border:1px solid var(--line); padding:8px 11px; font-family:var(--mono);
  font-size:11.5px; margin-bottom:9px}
.fsearch:focus{outline:none; border-color:var(--ph-line)}
.fnote{font-family:var(--mono); font-size:10px; letter-spacing:.08em;
  color:var(--ink-4); margin-top:7px}
/* kıdem rozeti — kartta */
.pill.lvl{background:rgba(89,200,255,.10); color:var(--mid);
  border:1px solid rgba(89,200,255,.25)}
.fclear{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-4); padding:6px 0; margin-top:4px}
.fclear:hover{color:var(--bad)}

/* ==================== profil / CV paneli ==================== */
.pnl{position:fixed; top:0; right:0; bottom:0; width:min(560px,100%);
  background:var(--bg-2); border-left:1px solid var(--line-2); z-index:60;
  overflow-y:auto; padding:26px 28px 60px; transform:translateX(100%);
  transition:transform .26s cubic-bezier(.2,.75,.25,1)}
.pnl.on{transform:none}
.pnl-close{position:absolute; top:16px; right:18px; width:32px; height:32px;
  border:1px solid var(--line-2); color:var(--ink-3); font-size:17px; line-height:1}
.pnl-close:hover{border-color:var(--bad); color:var(--bad)}
.pnl h2{font-family:var(--disp); font-size:21px; font-weight:800; margin:6px 0 6px}
.pnl .lead{color:var(--ink-2); font-size:13.5px; line-height:1.6; margin-bottom:22px}
/* .dhead (bölüm başlığı) detay panelinde tanımlı — burada tekrar edilmez;
   iki aynı-özgüllükteki kural birbirinin margin'ini sessizce eziyordu. */

/* CV bırakma alanı */
.drop{border:1px dashed var(--line-2); background:var(--panel); padding:26px 20px;
  text-align:center; transition:border-color .15s, background .15s; cursor:pointer}
.drop:hover,.drop.hot{border-color:var(--ph-line); background:var(--ph-soft)}
.drop .ic{font-family:var(--mono); font-size:22px; color:var(--ph); display:block}
.drop .t{font-family:var(--disp); font-weight:600; font-size:14.5px; margin-top:10px}
.drop .d{font-size:12px; color:var(--ink-3); margin-top:5px; line-height:1.5}
.cvstat{display:flex; flex-wrap:wrap; gap:18px; margin-top:14px; padding:13px 15px;
  background:var(--panel); border:1px solid var(--line)}
.cvstat div{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-4)}
.cvstat b{display:block; font-family:var(--disp); font-size:17px; font-weight:800;
  color:var(--ink); letter-spacing:0; text-transform:none; margin-bottom:2px}
.cvstat b.ph{color:var(--ph)}

/* öneri satırı — onay kullanıcının, otomatik yazılmaz (D-014) */
.sug{display:flex; align-items:center; gap:12px; padding:11px 13px;
  background:var(--panel); border:1px solid var(--line); margin-bottom:7px}
.sug .nm{flex:1; min-width:0; font-size:13.5px; font-weight:600}
.sug .nm i{display:block; font-style:normal; font-family:var(--mono); font-size:10.5px;
  color:var(--ink-4); margin-top:3px; letter-spacing:.04em}
.sug .yr{width:66px; background:var(--panel-2); border:1px solid var(--line-2);
  padding:7px 8px; font-family:var(--mono); font-size:12px; text-align:center}
.sug .yr:focus{outline:none; border-color:var(--ph-line)}
.sug .ok{padding:7px 13px; border:1px solid var(--ph-line); color:var(--ph);
  font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.08em}
.sug .ok:hover{background:var(--ph-soft)}
.sug .no{color:var(--ink-4); padding:6px 8px}
.sug .no:hover{color:var(--bad)}
.fact{display:inline-flex; align-items:center; gap:8px; padding:7px 12px;
  background:var(--ph-soft); border:1px solid var(--ph-line); margin:0 6px 6px 0;
  font-size:12.5px; color:var(--ph)}
.fact .yr{font-family:var(--mono); font-size:10.5px; opacity:.7}
.fact .x{color:var(--ink-3); cursor:pointer} .fact .x:hover{color:var(--bad)}

/* bölüm başlığı */
.sec-h{display:flex; align-items:center; gap:14px; margin:30px 0 14px}
.sec-h .t{font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-2)}
.sec-h .t b{color:var(--ph)}
.sec-h .ln{flex:1; height:1px; background:linear-gradient(90deg, var(--line-2), transparent)}

/* ilan kartı */
.card{position:relative; background:var(--panel); border:1px solid var(--line);
  border-left:2px solid var(--line-2); padding:17px 20px 15px; margin-bottom:10px;
  cursor:pointer; transition:border-color .15s, background .15s}
.card:hover{border-color:var(--ph-line); background:var(--panel-2)}
.card.b-strong{border-left-color:var(--good)}
.card.b-good{border-left-color:var(--mid)}
.card.b-cond{border-left-color:var(--warn)}
.card.b-weak{border-left-color:var(--bad)}
.card-top{display:flex; align-items:flex-start; gap:15px}
.card-logo{width:40px; height:40px; flex-shrink:0; display:flex; align-items:center;
  justify-content:center; background:var(--panel-2); border:1px solid var(--line-2);
  font-family:var(--mono); font-weight:700; font-size:13px; color:var(--ink-3)}
.card-main{flex:1; min-width:0}
.card h4{font-size:15.5px; font-weight:700; line-height:1.35}
.card-meta{display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin-top:4px;
  font-size:12.5px; color:var(--ink-3)}
.card-meta b{color:var(--ink-2); font-weight:600}
.card-meta .cc{font-family:var(--mono); font-size:10px; font-weight:700;
  letter-spacing:.08em; color:var(--ink-4)}
.dot{opacity:.35}
.card-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:11px}
.rq{font-size:12px; padding:4px 10px; background:var(--panel-2);
  border:1px solid var(--line); color:var(--ink-3)}
.rq.on{border-color:rgba(70,242,164,.25); background:var(--good-soft); color:var(--good)}
.rq.on::before{content:"✓ "}
.pill{font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:.04em;
  padding:4px 9px}
.pill.pay{background:var(--good-soft); color:var(--good)}
.pill.age{background:var(--warn-soft); color:var(--warn)}
.pill.fair{background:var(--bad-soft); color:var(--bad)}

/* bant göstergesi — 4 ayrık hücre; bant SIRALIDIR, yüzde değildir (D-005) */
.bandbox{flex-shrink:0; text-align:right}
.gauge{display:inline-flex; gap:3px; margin-bottom:6px}
.gauge i{width:14px; height:5px; background:var(--line-2)}
.b-strong .gauge i.on{background:var(--good); box-shadow:0 0 6px rgba(70,242,164,.5)}
.b-good .gauge i.on{background:var(--mid); box-shadow:0 0 6px rgba(89,200,255,.45)}
.b-cond .gauge i.on{background:var(--warn); box-shadow:0 0 6px rgba(255,193,83,.45)}
.b-weak .gauge i.on{background:var(--bad); box-shadow:0 0 6px rgba(255,111,97,.45)}
.bandbox .bl{display:block; font-family:var(--mono); font-size:10px; font-weight:700;
  letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.b-strong .bl{color:var(--good)} .b-good .bl{color:var(--mid)}
.b-cond .bl{color:var(--warn)} .b-weak .bl{color:var(--bad)}

.empty{text-align:center; padding:80px 20px; border:1px dashed var(--line-2); margin-top:8px}
.empty h3{font-family:var(--disp); font-size:16px; font-weight:600; color:var(--ink-2)}
.empty p{color:var(--ink-3); font-size:13.5px; margin-top:6px}
.more{display:flex; margin:18px auto 0}

.notice{background:var(--panel); border:1px solid var(--line-2); border-left:2px solid var(--warn);
  padding:13px 16px; font-size:13.5px; color:var(--ink-2); margin-bottom:12px}
.notice.err{border-left-color:var(--bad)}

/* ==================== detay paneli ==================== */
.scrim{position:fixed; inset:0; background:rgba(3,5,4,.6); z-index:60; opacity:0;
  pointer-events:none; transition:opacity .2s; backdrop-filter:blur(2px)}
.scrim.on{opacity:1; pointer-events:auto}
.detail{position:fixed; top:0; right:0; bottom:0; width:min(580px,95vw); z-index:70;
  background:var(--bg-2); border-left:1px solid var(--line-2);
  transform:translateX(102%); transition:transform .3s cubic-bezier(.2,.8,.25,1);
  overflow-y:auto; padding:28px 30px 70px}
.detail.on{transform:none}
.detail-close{position:absolute; top:22px; right:24px; width:36px; height:36px;
  border:1px solid var(--line-2); background:var(--panel); color:var(--ink-2);
  font-size:15px}
.detail-close:hover{border-color:var(--ph-line); color:var(--ph)}
.detail .dband{display:inline-flex; align-items:center; gap:10px; margin-bottom:14px}
.detail h2{font-family:var(--disp); font-size:20px; font-weight:800; line-height:1.3;
  margin:0 44px 8px 0}
.detail .emp{color:var(--ink-2); font-size:14px}
.dhead{display:flex; align-items:center; gap:12px; margin:26px 0 10px}
.dhead .t{font-family:var(--mono); font-size:10.5px; font-weight:700;
  letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3)}
.dhead .ln{flex:1; height:1px; background:var(--line)}
.ledger{display:flex; flex-direction:column; gap:6px}
.lrow{display:flex; gap:11px; padding:11px 13px; background:var(--panel);
  border:1px solid var(--line); font-size:13.5px}
.lrow .ic{font-family:var(--mono); font-weight:700; flex-shrink:0}
.lrow.met{border-left:2px solid var(--good)} .lrow.met .ic{color:var(--good)}
.lrow.unmet{border-left:2px solid var(--bad)} .lrow.unmet .ic{color:var(--bad)}
.lrow.unk{border-left:2px solid var(--warn)} .lrow.unk .ic{color:var(--warn)}
.lrow .ev{color:var(--ink-3); font-size:12.5px; margin-top:3px}
.desc{font-size:13.5px; color:var(--ink-2); line-height:1.75; white-space:pre-wrap;
  max-height:300px; overflow:hidden}
.desc.open{max-height:none}
.desc h5{color:var(--ink); font-family:var(--mono); font-size:12px; font-weight:700;
  letter-spacing:.1em; text-transform:uppercase; margin:14px 0 5px}
.apply{display:flex; gap:10px; margin:24px 0 8px}
.apply .btn{flex:1; justify-content:center}
.mut{color:var(--ink-3)}

/* yükleniyor */
.load{display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:70vh; gap:18px}
.radar{width:46px; height:46px; border:1px solid var(--ph-line); border-radius:50%;
  position:relative; overflow:hidden}
.radar::before{content:""; position:absolute; inset:0;
  background:conic-gradient(from 0deg, rgba(70,242,164,.5), transparent 70deg);
  animation:spin 1.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load span{font-family:var(--mono); font-size:11px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--ink-3)}

@media(max-width:680px){
  .ob h1{font-size:22px} .ob .sub{max-width:100%}
  .pick.two{grid-template-columns:1fr}
  .console-row{gap:18px} .stat .n{font-size:24px}
  .console-hi{margin-left:0; text-align:left}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important; transition:none !important}
}

</head>
<body>
<div id="root"><div class="load"><div class="radar"></div><span>sistem açılıyor</span></div></div>

<script>
const API="/api";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mono=s=>(s||"?").trim().slice(0,2).toUpperCase();

/* Sunucu bazı açıklamalarda `**vurgu**` gönderiyor (ör. CV notu). Metni ÖNCE
   kaçırıp SONRA yalnızca bu kalıbı <b>'ye çeviririz — ham HTML'e izin vermeden
   vurgu korunur. Kaçırma önce yapıldığı için içerikten gelen `<b>` etiketi
   çalışmaz, yıldızlar da ekranda görünmez. */
const rich=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");

/* ---------------- marka (JoblyFit) ----------------
   Altıgen rozet = doğrulanmış uygunluk; içinde kişi+kalp = insanı merkeze alan
   eşleşme; sağ-alta taşan onay tiki altıgen kenarında çentik açar. Renkler CSS
   değişkenlerinden gelir; favicon <head>'de aynı biçimin renk-gömülü halidir. */
const BRAND_MARK=`<svg class="blogo" viewBox="0 0 48 48" width="30" height="30" aria-hidden="true" focusable="false">`
  +`<path d="M24 6 39.6 15 39.6 33 24 42 8.4 33 8.4 15Z" fill="none" stroke="var(--ph)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`
  +`<circle cx="24" cy="15.4" r="3.2" fill="#fff"/>`
  +`<path d="M24 27C22.6 24.6 19 24 19 21.4 19 19.9 20.2 19 21.5 19 22.4 19 23.4 19.5 24 20.4 24.6 19.5 25.6 19 26.5 19 27.8 19 29 19.9 29 21.4 29 24 25.4 24.6 24 27Z" fill="#fff"/>`
  +`<path d="M18 30 23.5 35.5 41 17" fill="none" stroke="var(--bg)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>`
  +`<path d="M18 30 23.5 35.5 41 17" fill="none" stroke="var(--ph)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`
  +`</svg>`;
const BRAND=`<div class="brand" aria-label="JoblyFit">${BRAND_MARK}<span class="bwm">Jobly<em>Fit</em></span></div>`;

async function api(path,opts){
  const r=await fetch(API+path,opts);
  if(!r.ok){let m=r.statusText; try{m=(await r.json()).detail||m}catch(e){} throw new Error(m);}
  return r.status===204?null:r.json();
}
const jpost=(p,body)=>api(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});

/* ---------------- durum ---------------- */
function PAGE_EV(){return 40;}
const S={profiles:[], catalog:[], feed:null, view:"load",
  q:"", region:"", shownEv:PAGE_EV(), ob:null,
  /* filtreler. Hepsi "" = kısıt yok. `fopen` panelin açık/kapalı hâli. */
  f:{level:"", arr:"", emp:"", city:"", longOpen:false}, fopen:false, citySearch:"",
  /* profil paneli: null | "profile". `cv` son yükleme raporu. */
  panel:null, profile:null, cv:null};

/* Kıdem merdiveni — sıra bilgi taşır (giriş → tepe), alfabetik değil.
   Etiketler kullanıcı dilinde; anahtarlar API'nin ürettiği değerler. */
const LVL_LABEL={intern:"STAJYER", junior:"JUNIOR", mid:"MID", senior:"SENIOR",
  lead:"LEAD", architect:"MİMAR", executive:"YÖNETİCİ"};
const LEVELS=[["intern","STAJYER"],["junior","JUNIOR"],["mid","MID"],
  ["senior","SENIOR"],["lead","LEAD"],["architect","MİMAR"],
  ["executive","YÖNETİCİ"],["unspecified","BELİRTİLMEMİŞ"]];
const ARRS=[["remote","UZAKTAN"],["hybrid","HİBRİT"],["onsite","OFİSTEN"],
  ["unspecified","BELİRTİLMEMİŞ"]];
const EMPS=[["internship","STAJ"],["part_time","YARI ZAMANLI"],
  ["contract","SÖZLEŞMELİ"],["unspecified","BELİRTİLMEMİŞ"]];

const CLUSTERS_BLUE=["Lojistik ve taşımacılık","Üretim ve teknik","Perakende ve hizmet",
  "Yiyecek ve turizm","Sağlık","İnşaat"];
/* Bölge kodları bilinçli olarak mono metin — bayrak emojisi Windows'ta harf
   olarak düşüyor; kod zaten konsol diline daha uygun. */
const RCODE={"Türkiye":"TR","Avrupa":"EU","ABD":"US","Uzaktan":"RMT","Diğer":"INT","Asya":"AS"};
const GAUGE={strong:4, good:3, cond:2, weak:1};

/* ---------------- açılış ---------------- */
async function boot(){
  try{
    const [profiles,catalog]=await Promise.all([api("/profiles"),api("/catalog")]);
    S.profiles=profiles; S.catalog=catalog;
    if(!profiles.length){ startOnboarding(); }
    else{ await loadFeed(); S.view="feed"; render(); }
  }catch(e){
    $("#root").innerHTML=`<div class="load"><span>bağlantı hatası — ${esc(e.message)}</span>
      <button class="btn" onclick="boot()">tekrar dene</button></div>`;
  }
}
async function loadFeed(){ S.feed=await api("/feed"); }
const activeProfile=()=>S.profiles.find(p=>p.is_active)||null;

/* ---------------- render ---------------- */
function render(){
  const root=$("#root");
  if(S.view==="onboarding"){ root.innerHTML=viewOnboarding(); wireOnboarding(); return; }
  root.innerHTML=topbar()+`<main class="wrap feed">${viewFeed()}</main>`+detailMarkup();
  wireFeed();
}

function topbar(){
  const p=activeProfile();
  return `<header class="topbar"><div class="wrap">
    ${BRAND}
    <div class="sysline"><span class="sysdot"></span>
      <span class="tag-l">tarama <b>aktif</b></span></div>
    <div class="grow"></div>
    ${p?`<button class="btn-2" id="cvBtn" style="padding:8px 14px; font-size:11px">
      CV & BECERİ${p.fact_count?` <b style="opacity:.6">${p.fact_count}</b>`:''}
    </button>`:''}
    ${p?`<div class="psw" id="psw">
      <button class="psw-btn" id="pswBtn">
        <span class="collar-dot ${p.collar==='blue'?'blue':''}"></span>
        ${esc(p.name)} <span class="cv">▼</span>
      </button>
      <div class="psw-menu" id="pswMenu">
        ${S.profiles.map(m=>`<div class="psw-item ${m.is_active?'active':''}" data-act="${m.id}">
          <span class="collar-dot ${m.collar==='blue'?'blue':''}"></span>
          <span class="nm">${esc(m.name)}</span>
          <span class="meta">${m.fact_count} ALAN</span>
          ${S.profiles.length>1?`<span class="psw-x" data-del="${m.id}" title="Sil">×</span>`:''}
        </div>`).join('')}
        <button class="psw-new" data-new="1">+ yeni profil</button>
      </div>
    </div>`:''}
  </div></header>`;
}

/* ---------------- onboarding ---------------- */
function startOnboarding(){
  S.ob={step:0, collar:null, region:"", city:"", keys:new Set(), custom:[], name:""};
  S.view="onboarding"; render();
}
const OB_STEPS=["intro","collar","region","keywords","name"];

function viewOnboarding(){
  const o=S.ob, i=o.step, n=OB_STEPS.length;
  return `<header class="topbar"><div class="wrap">
    ${BRAND}</div></header>
  <div class="ob"><div class="ob-card">
    <div class="ob-top">
      <span class="ob-idx"><b>${String(i).padStart(2,'0')}</b> / ${String(n-1).padStart(2,'0')}</span>
      <div class="ob-prog">${OB_STEPS.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div>
    </div>
    <div class="ob-step" id="obStep">${obStep(OB_STEPS[i])}</div>
  </div></div>`;
}

function obStep(step){
  const o=S.ob;
  if(step==="intro") return `
    <span class="tag-l">// başlatma sekansı</span>
    <h1>Sana gerçekten uyan işleri tarayalım.</h1>
    <p class="sub">Birkaç soruyla profilini kuracağız. Söz vermiyoruz — hangi işin
      sana ne kadar uyduğunu <b>kanıtıyla</b> gösteriyoruz.</p>
    <div class="ob-actions"><button class="btn" data-next="1">başla →</button></div>`;

  if(step==="collar") return `
    <span class="tag-l">// iş türü</span>
    <h1>Ne tür bir iş arıyorsun?</h1>
    <p class="sub">Bu seçim, beceri listeni ve tarama alanını şekillendirir.</p>
    <div class="pick two">
      <button class="pick-card reticle ${o.collar==='white'?'sel':''}" data-collar="white">
        <span class="ic">[BEYAZ-YAKA]</span>
        <span class="t">Ofis & uzmanlık</span>
        <span class="d">Yazılım, tasarım, satış, finans, yönetim, pazarlama…</span></button>
      <button class="pick-card reticle ${o.collar==='blue'?'sel':''}" data-collar="blue">
        <span class="ic">[MAVİ-YAKA]</span>
        <span class="t">Saha & üretim</span>
        <span class="d">Lojistik, üretim, sağlık, hizmet, teknik, sürüş…</span></button>
    </div>
    <div class="ob-actions">
      <button class="btn-ghost" data-back="1">← geri</button>
      <button class="btn" data-next="1" ${o.collar?'':'disabled'}>devam →</button>
    </div>`;

  if(step==="region"){
    const regions=(S.feed?.facets?.regions||[]).map(r=>r.name).filter(n=>RCODE[n]);
    const base=regions.length?regions:["Türkiye","Avrupa","ABD","Uzaktan"];
    const cities=(S.feed?.facets?.cities||[])
      .filter(c=>/İstanbul|Istanbul|Ankara|İzmir|Bursa|Kocaeli|Antalya|Gebze/i.test(c)).slice(0,8);
    return `
    <span class="tag-l">// konum</span>
    <h1>Nerede iş arıyorsun?</h1>
    <p class="sub">Önce bölge. Türkiye'yi seçersen şehre kadar inebilirsin.</p>
    <div class="pick flow">
      <button class="pick-chip ${o.region===''?'sel':''}" data-region="">FARK ETMEZ</button>
      ${base.map(n=>`<button class="pick-chip ${o.region===n?'sel':''}" data-region="${esc(n)}">[${RCODE[n]||'?'}] ${esc(n.toUpperCase())}</button>`).join('')}
    </div>
    ${o.region==="Türkiye"&&cities.length?`
      <div style="margin-top:20px"><span class="tag-l">şehir — isteğe bağlı</span>
      <div class="pick flow" style="margin-top:10px">
        <button class="pick-chip ${o.city===''?'sel':''}" data-city="">TÜMÜ</button>
        ${cities.map(c=>{const nm=c.split(',')[0].split('/')[0].trim();
          return `<button class="pick-chip ${o.city===c?'sel':''}" data-city="${esc(c)}">${esc(nm.toUpperCase())}</button>`}).join('')}
      </div></div>`:''}
    <div class="ob-actions">
      <button class="btn-ghost" data-back="1">← geri</button>
      <button class="btn" data-next="1">devam →</button>
    </div>`;
  }

  if(step==="keywords"){
    const items=selectableCatalog(o.collar);
    const groups={};
    items.forEach(it=>{ (groups[it.occupation_label||it.occupation_id]??=[]).push(it); });
    return `
    <span class="tag-l">// beceri matrisi</span>
    <h1>Hangileri sende var?</h1>
    <p class="sub">Seçtiklerin eşleştirmede <b>kanıt</b> olarak kullanılır. Listede
      olmayanı kendin ekleyebilirsin; CV'ni sonra da yükleyebilirsin.</p>
    ${Object.entries(groups).map(([g,list])=>`
      <div class="kw-group"><span class="tag-l">${esc(g)}</span>
      <div class="kw-flow" style="margin-top:9px">
        ${list.map(it=>`<button class="kw ${o.keys.has(it.key)?'sel':''}" data-key="${esc(it.key)}">${esc(it.label)}</button>`).join('')}
      </div></div>`).join('')}
    <div class="kw-group"><span class="tag-l">kendi anahtar kelimelerin</span>
      <div class="kw-flow" style="margin-top:9px" id="customTags">
        ${o.custom.map((c,i)=>`<span class="tagx">${esc(c)} <b data-rmc="${i}">×</b></span>`).join('')}
      </div>
      <div class="kw-add">
        <input id="customIn" placeholder="ör. React, SAP, forklift…" maxlength="40">
        <button class="btn-2" data-addc="1">ekle</button>
      </div>
    </div>
    <div class="ob-actions">
      <button class="btn-ghost" data-back="1">← geri</button>
      <button class="btn" data-next="1">devam →</button>
    </div>`;
  }

  if(step==="name"){
    return `
    <span class="tag-l">// profil kimliği</span>
    <h1>Bu profile bir ad ver.</h1>
    <p class="sub">Birden çok profil tutabilirsin — "Eren-Yazılım" ve "Eren-Mavi yaka"
      gibi. Üst bardan tek tıkla geçersin.</p>
    <input class="name-in" id="nameIn" value="${esc(S.ob.name||obSuggestName())}" maxlength="80" placeholder="Profil adı">
    <div class="ob-actions">
      <button class="btn-ghost" data-back="1">← geri</button>
      <button class="btn" data-finish="1">profili oluştur ✓</button>
    </div>`;
  }
  return "";
}

function selectableCatalog(collar){
  let items=S.catalog;
  if(collar==="blue") items=items.filter(i=>CLUSTERS_BLUE.includes(i.occupation_id));
  else if(collar==="white") items=items.filter(i=>!CLUSTERS_BLUE.includes(i.occupation_id));
  return items;
}
function obSuggestName(){
  const o=S.ob, parts=[];
  const first=[...o.keys].map(k=>S.catalog.find(c=>c.key===k)?.label).filter(Boolean)[0];
  if(first) parts.push(first); else if(o.collar) parts.push(o.collar==='blue'?'Mavi yaka':'Beyaz yaka');
  if(o.city) parts.push(o.city.split(',')[0].split('/')[0].trim());
  else if(o.region) parts.push(o.region);
  return parts.join(' · ')||'Profilim';
}

function wireOnboarding(){
  const o=S.ob, step=$("#obStep");
  const go=d=>{o.step=Math.max(0,Math.min(OB_STEPS.length-1,o.step+d)); render();};
  step.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>go(1));
  step.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>go(-1));
  step.querySelectorAll("[data-collar]").forEach(b=>b.onclick=()=>{o.collar=b.dataset.collar; o.keys.clear(); render();});
  step.querySelectorAll("[data-region]").forEach(b=>b.onclick=()=>{o.region=b.dataset.region; o.city=""; render();});
  step.querySelectorAll("[data-city]").forEach(b=>b.onclick=()=>{o.city=b.dataset.city; render();});
  step.querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.key; o.keys.has(k)?o.keys.delete(k):o.keys.add(k); b.classList.toggle("sel");});
  const addC=()=>{const inp=$("#customIn"); const v=(inp.value||"").trim();
    if(v && !o.custom.includes(v)) o.custom.push(v);
    render(); setTimeout(()=>$("#customIn")?.focus(),0);};
  step.querySelector("[data-addc]")?.addEventListener("click",addC);
  $("#customIn")?.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault(); addC();}});
  step.querySelectorAll("[data-rmc]").forEach(b=>b.onclick=()=>{o.custom.splice(+b.dataset.rmc,1); render();});
  const nm=$("#nameIn"); if(nm) nm.oninput=()=>{o.name=nm.value;};
  step.querySelector("[data-finish]")?.addEventListener("click",finishOnboarding);
}

async function finishOnboarding(){
  const o=S.ob;
  const name=(o.name||$("#nameIn")?.value||obSuggestName()).trim()||"Profilim";
  const attrs={region:o.region, city:o.city, keywords:o.custom};
  $("#root").innerHTML=`<div class="load"><div class="radar"></div><span>profil derleniyor</span></div>`;
  try{
    S.profiles=await jpost("/profiles",{name, collar:o.collar, attrs, fact_keys:[...o.keys]});
    /* Bölge tercihi filtre olur; arama BOŞ başlar. Özel kelimeyi aramaya
       zorlamak feed'i tek sonuca düşürüyordu — profilde saklanır. */
    S.region=o.region||""; S.q=""; S.shownEv=PAGE_EV();
    await loadFeed(); S.view="feed"; S.ob=null; render();
  }catch(e){ alert("Hata: "+e.message); boot(); }
}

/* ---------------- feed ---------------- */
/* Eksen filtresi. "unspecified" GERÇEK bir seçenektir: kullanıcı "kıdem
   yazmayanları göster" diyebilir. Bu yüzden null'ı boş string'e çevirip
   karşılaştırmıyoruz — null'ın kendi etiketi var (D-011). */
const axisOk=(val,sel)=>!sel || (val||"unspecified")===sel;

function matches(j){
  if(S.region && !(j.regions||[]).includes(S.region)) return false;
  /* Şehir: backend'in çıkardığı il grubu (D-056). Ham `city` ile eşleşmek
     "İstanbul Avrupa"yı "İstanbul"dan ayrı sayardı. */
  if(S.f.city && (j.city_group||"")!==S.f.city) return false;
  if(!axisOk(j.experience_level,S.f.level)) return false;
  if(!axisOk(j.work_arrangement,S.f.arr)) return false;
  if(!axisOk(j.employment_type,S.f.emp)) return false;
  if(S.f.longOpen && !j.long_open) return false;
  if(S.q){
    const hay=(j.title+" "+j.employer+" "+j.city+" "+(j.top_requirements||[]).join(" ")).toLowerCase();
    if(!S.q.toLowerCase().split(/\s+/).every(w=>hay.includes(w))) return false;
  }
  return true;
}
const activeFilterCount=()=>
  (S.f.level?1:0)+(S.f.arr?1:0)+(S.f.emp?1:0)+(S.f.city?1:0)+(S.f.longOpen?1:0);

/* Şehir seçenekleri **o an görünen** ilanlardan sayılır — sabit bir listeden
   değil. Böylece "TÜRKİYE + SENIOR" seçiliyken çıkan şehir sayıları tıklayınca
   gerçekten o kadar ilan verir. Sabit listede "İstanbul 2594" yazıp 12 ilan
   göstermek, bu kod tabanının reddettiği tutulmayan vaat olurdu. */
function cityOptions(){
  const f=S.feed; if(!f) return [];
  const sayac=new Map();
  let belirsiz=0;
  const bak=j=>{
    /* Şehir filtresinin KENDİSİ hariç tutulur: aksi halde bir şehir seçilince
       listede yalnızca o şehir kalır ve kullanıcı başka şehre geçemez. */
    if(S.region && !(j.regions||[]).includes(S.region)) return;
    if(!axisOk(j.experience_level,S.f.level)) return;
    if(!axisOk(j.work_arrangement,S.f.arr)) return;
    if(!axisOk(j.employment_type,S.f.emp)) return;
    if(S.f.longOpen && !j.long_open) return;
    const c=j.city_group||"";
    if(!c){ belirsiz++; return; }
    sayac.set(c,(sayac.get(c)||0)+1);
  };
  (f.evaluated||[]).forEach(bak); (f.unevaluated||[]).forEach(bak);
  const q=S.citySearch.trim().toLocaleLowerCase("tr");
  const hepsi=[...sayac.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"tr"));
  const list=q?hepsi.filter(([c])=>c.toLocaleLowerCase("tr").includes(q)):hepsi;
  /* `toplam` FİLTRELENMEMİŞ sayıdır. Arama kutusunu görünen listeye göre
     gösterirsek, kullanıcı yazdıkça liste kısalır ve kutu kaybolur — yazdığını
     silemez, kilitlenir. */
  return {list, belirsiz, toplam:hepsi.length};
}

/* Filtre seçenekleri **korpustan** sayılır. Sıfır ilanlı seçenek hiç
   gösterilmez: tıklayınca boş liste veren bir filtre, tutulmayan bir vaattir. */
function fopts(list,counts,sel,attr){
  return list.filter(([k])=>(counts||{})[k])
    .map(([k,label])=>`<button class="fo ${sel===k?'on':''}" data-${attr}="${k}">
      ${label}<b>${counts[k]}</b></button>`).join('');
}

function viewFilters(){
  const fc=S.feed?.facets||{};
  const n=activeFilterCount();
  const rows=[
    ["kıdem seviyesi", fopts(LEVELS,fc.experience_levels,S.f.level,"lvl")],
    ["çalışma biçimi", fopts(ARRS,fc.arrangements,S.f.arr,"arr")],
    ["istihdam türü",  fopts(EMPS,fc.employment_types,S.f.emp,"emp")],
  ].filter(([,html])=>html);

  const ct=cityOptions();
  const GOSTER=60;   // uzun listede ilk 60; gerisi arama kutusuyla bulunur
  const kesildi=Math.max(0,ct.list.length-GOSTER);
  const cityRow=`<div class="frow"><span class="tag-l">şehir
      ${S.region?`— ${esc(S.region.toUpperCase())}`:''}</span>
    ${ct.toplam>12?`<input class="fsearch" id="citySearch"
      placeholder="şehir ara…" value="${esc(S.citySearch)}">`:''}
    <div class="fopts ${ct.list.length>18?'scroll':''}">
      ${ct.list.slice(0,GOSTER).map(([c,n])=>`<button class="fo ${S.f.city===c?'on':''}"
        data-city="${esc(c)}">${esc(c)}<b>${n}</b></button>`).join('')}
    </div>
    ${!ct.list.length?`<div class="fnote">"${esc(S.citySearch)}" ile eşleşen şehir yok.</div>`:''}
    ${kesildi?`<div class="fnote">+${kesildi} şehir daha — aramayla bul</div>`:''}
    ${ct.belirsiz?`<div class="fnote">${ct.belirsiz} ilan şehir belirtmemiş
      (bölge biliniyor, şehir yok) — uydurmuyoruz.</div>`:''}
  </div>`;
  return `
    <div class="fbar">
      <button class="ftoggle ${S.fopen?'open':''}" id="fToggle">
        <span class="ar">▶</span> filtreler${n?` <span class="cnt">[${n}]</span>`:''}
      </button>
      <span class="ln"></span>
      ${n?`<button class="fclear" id="fClear">filtreleri temizle ×</button>`:''}
    </div>
    <div class="fpanel ${S.fopen?'open':''}">
      ${ct.toplam?cityRow:''}
      ${rows.map(([t,html])=>`<div class="frow"><span class="tag-l">${t}</span>
        <div class="fopts">${html}</div></div>`).join('')}
      ${fc.long_open_count?`<div class="frow"><span class="tag-l">ilan yaşı</span>
        <div class="fopts"><button class="fo ${S.f.longOpen?'on':''}" data-lo="1">
          UZUN SÜREDİR AÇIK<b>${fc.long_open_count}</b></button></div>
        <div class="tag-l" style="margin-top:8px; color:var(--ink-4)">
          Uzun süredir açık ilan hayalet ilan olabilir — ya da işveren sürekli alım yapıyordur.
        </div></div>`:''}
    </div>`;
}

function viewFeed(){
  const f=S.feed; if(!f) return "";
  const p=activeProfile();
  const ev=(f.evaluated||[]).filter(matches);
  const un=(f.unevaluated||[]).filter(matches);
  const total=(f.evaluated||[]).length+(f.unevaluated||[]).length;
  const regions=(f.facets?.regions||[]);

  return `
    <div class="console">
      <div class="console-row">
        <div class="stat"><div class="n">${total}</div><div class="l tag-l">taranan ilan</div></div>
        <div class="stat"><div class="n ph">${ev.length}</div><div class="l tag-l">değerlendirilen</div></div>
        <div class="stat"><div class="n" style="color:var(--warn)">${un.length}</div><div class="l tag-l">veri eksik</div></div>
        <div class="console-hi">
          <div class="who">${esc(p?p.name:'—')}</div>
          <div class="sub">profil etkin · ${p?p.fact_count:0} beceri kayıtlı</div>
        </div>
      </div>
    </div>

    <div class="searchbar"><div class="si"><span class="pfx">&gt;_</span>
      <input id="q" placeholder="pozisyon, şirket, beceri ara…" value="${esc(S.q)}"></div></div>

    <div class="chips">
      <button class="chip ${S.region===''?'on':''}" data-region=""><span class="cc">ALL</span> TÜM BÖLGELER</button>
      ${regions.map(r=>`<button class="chip ${S.region===r.name?'on':''}" data-region="${esc(r.name)}">
        <span class="cc">${RCODE[r.name]||'?'}</span> ${esc(r.name.toUpperCase())} <b>${r.count}</b></button>`).join('')}
    </div>

    ${viewFilters()}

    ${ev.length?`
      <div class="sec-h"><span class="t">// sana göre <b>[${ev.length}]</b></span><span class="ln"></span></div>
      ${ev.slice(0,S.shownEv).map(card).join('')}
      ${ev.length>S.shownEv?`<button class="btn-2 more" data-more="1">+ ${Math.min(40,ev.length-S.shownEv)} ilan daha</button>`:''}`
    :`<div class="empty"><h3>Bu filtrelerle eşleşme yok</h3>
       <p>Filtreyi gevşet ya da profiline beceri ekle — tarama alanı genişler.</p></div>`}

    ${un.length?`
      <div class="sec-h"><span class="t">// değerlendirilemeyenler <b>[${un.length}]</b></span><span class="ln"></span></div>
      <div class="notice">Bu ilanları <b>okuyamadık</b> ya da profilinde karşılaştıracak veri yok —
        sana uymadıkları anlamına <b>gelmez</b>. Beceri ekledikçe yukarı taşınırlar.</div>
      ${un.slice(0,12).map(card).join('')}`:''}
  `;
}

function card(j){
  const bc=j.band?('b-'+j.band):'b-none';
  const bandTxt=j.band_label||(j.listing_only?'Kamu ilanı':'Değerlendirilemedi');
  const lit=GAUGE[j.band]||0;
  const met=new Set(j.matched_requirements||[]);
  const tags=(j.top_requirements||[]).slice(0,4).map(r=>`<span class="rq ${met.has(r)?'on':''}">${esc(r)}</span>`).join('');
  const pills=[];
  /* Kıdem rozeti kartta gösterilir: filtre vardı ama ilanın hangi seviyede
     olduğu görünmüyordu, kullanıcı her ilanı açmak zorunda kalıyordu.
     Etiketsiz ilanda rozet YOK — "belirtilmemiş"i "mid" gibi göstermek
     uydurma olurdu (D-011). */
  if(j.experience_level&&LVL_LABEL[j.experience_level])
    pills.push(`<span class="pill lvl">${LVL_LABEL[j.experience_level]}</span>`);
  if(j.salary_status==='found'&&j.salary_text) pills.push(`<span class="pill pay">${esc(j.salary_text)}</span>`);
  if(j.long_open) pills.push(`<span class="pill age">${j.age_days}G AÇIK</span>`);
  if((j.fairness_flags||[]).some(f=>f.severity==='hard')) pills.push(`<span class="pill fair">⚠ AYRIMCI İFADE</span>`);
  const rc=(j.regions||[]).filter(r=>r!=='Diğer').slice(0,1).map(r=>RCODE[r]).filter(Boolean);
  return `<article class="card ${bc}" data-job="${esc(j.job_id)}">
    <div class="card-top">
      <div class="card-logo">${esc(mono(j.employer))}</div>
      <div class="card-main">
        <h4>${esc(j.title)}</h4>
        <div class="card-meta"><b>${esc(j.employer)}</b>
          ${j.city?`<span class="dot">·</span>${esc(j.city)}`:''}
          ${j.age_days!=null&&!j.long_open?`<span class="dot">·</span>${j.age_days}g önce`:''}
          ${rc.length?`<span class="dot">·</span><span class="cc">[${rc[0]}]</span>`:''}
        </div>
        ${pills.length?`<div class="card-tags">${pills.join('')}</div>`:''}
        ${tags?`<div class="card-tags">${tags}</div>`:''}
      </div>
      <div class="bandbox">
        ${j.band?`<span class="gauge">${[1,2,3,4].map(i=>`<i class="${i<=lit?'on':''}"></i>`).join('')}</span>`:''}
        <span class="bl">${esc(bandTxt)}</span>
      </div>
    </div>
  </article>`;
}

function wireFeed(){
  const pb=$("#pswBtn"); if(pb) pb.onclick=e=>{e.stopPropagation(); $("#pswMenu").classList.toggle("open");};
  document.addEventListener("click",()=>$("#pswMenu")?.classList.remove("open"),{once:true});
  document.querySelectorAll("[data-act]").forEach(el=>el.onclick=async()=>{
    S.profiles=await jpost(`/profiles/${el.dataset.act}/activate`); const a=activeProfile();
    /* Profil değişince arama/sayfalama sıfırlanır; bölge profilin tercihine döner. */
    S.region=a?.attrs?.region||""; S.q=""; S.shownEv=PAGE_EV();
    await loadFeed(); render();
  });
  document.querySelectorAll("[data-del]").forEach(el=>el.onclick=async(e)=>{
    e.stopPropagation();
    if(!confirm("Bu profil silinsin mi?")) return;
    try{ S.profiles=await api(`/profiles/${el.dataset.del}`,{method:"DELETE"}); await loadFeed(); render(); }
    catch(err){ alert(err.message); }
  });
  $("[data-new]")&&($("[data-new]").onclick=startOnboarding);
  const q=$("#q"); if(q) q.oninput=()=>{S.q=q.value; S.shownEv=PAGE_EV(); const c=q.selectionStart;
    repaint(); const n=$("#q"); if(n){n.focus(); n.setSelectionRange(c,c);}};
  document.querySelectorAll("[data-region]").forEach(el=>el.onclick=()=>{
    /* Bölge değişince şehir seçimi düşer: "Türkiye + Berlin" boş liste verirdi
       ve kullanıcı sebebini göremezdi. */
    S.region=el.dataset.region; S.f.city=""; S.citySearch="";
    S.shownEv=PAGE_EV(); repaint();});
  $("[data-more]")&&($("[data-more]").onclick=()=>{S.shownEv+=40; repaint();});
  document.querySelectorAll("[data-job]").forEach(el=>el.onclick=()=>openDetail(el.dataset.job));

  /* --- filtreler --- */
  $("#fToggle")&&($("#fToggle").onclick=()=>{S.fopen=!S.fopen; repaint();});
  $("#fClear")&&($("#fClear").onclick=()=>{
    S.f={level:"",arr:"",emp:"",city:"",longOpen:false}; S.citySearch="";
    S.shownEv=PAGE_EV(); repaint();});
  const cs=$("#citySearch");
  if(cs) cs.oninput=()=>{S.citySearch=cs.value; const p=cs.selectionStart;
    repaint(); const n=$("#citySearch"); if(n){n.focus(); n.setSelectionRange(p,p);}};
  /* Aynı seçeneğe tekrar tıklamak filtreyi kaldırır — kullanıcı "geri al"
     için temizle düğmesini aramak zorunda kalmasın. */
  const pick=(attr,key)=>document.querySelectorAll(`[data-${attr}]`).forEach(el=>el.onclick=()=>{
    const v=el.dataset[attr]; S.f[key]=(S.f[key]===v?"":v); S.shownEv=PAGE_EV(); repaint();});
  pick("city","city");
  pick("lvl","level"); pick("arr","arr"); pick("emp","emp");
  $("[data-lo]")&&($("[data-lo]").onclick=()=>{
    S.f.longOpen=!S.f.longOpen; S.shownEv=PAGE_EV(); repaint();});

  /* --- profil / CV paneli --- */
  $("#cvBtn")&&($("#cvBtn").onclick=openProfilePanel);
}
function repaint(){ $(".feed").innerHTML=viewFeed(); wireFeed(); }

/* ---------------- profil & CV paneli ---------------- */
/* Tasarım kararı: CV **hiçbir şeyi otomatik yazmaz** (D-014/T-016). Yükleme
   yalnızca ÖNERİ üretir; her satırı kullanıcı tek tek onaylar. Sunucu da öyle
   davranır (`written_to_profile:false`), arayüz bunu gizlemez — "CV'den 12
   beceri eklendi" demek, kullanıcının profilini onun adına doldurmaktı. */
async function openProfilePanel(){
  const sc=$("#scrim"), p=$("#pnl");
  sc.classList.add("on"); p.classList.add("on"); sc.onclick=closePanel;
  p.innerHTML=`<div class="load" style="min-height:auto;padding:70px 0"><div class="radar"></div></div>`;
  try{ S.profile=await api("/profile"); paintPanel(); }
  catch(e){ p.innerHTML=`<button class="pnl-close" onclick="closePanel()">×</button>
    <p style="margin-top:50px">${esc(e.message)}</p>`; }
}
function closePanel(){
  $("#scrim").classList.remove("on"); $("#pnl").classList.remove("on");
}
function paintPanel(){ $("#pnl").innerHTML=panelBody(); wirePanel(); }

function panelBody(){
  const pr=S.profile||{facts:[],pending_cv_suggestions:[]};
  const sug=pr.pending_cv_suggestions||[];
  const facts=pr.facts||[];
  const cv=S.cv;
  const dh=t=>`<div class="dhead"><span class="t">// ${t}</span><span class="ln"></span></div>`;
  return `<button class="pnl-close" onclick="closePanel()">×</button>
    <span class="tag-l">// profil</span>
    <h2>CV & beceri matrisi</h2>
    <p class="lead">CV'ni yükle — <b>hiçbir şey otomatik eklenmez</b>. Sistem
      yalnızca alan <b>önerir</b>, her birini sen onaylarsın. Onayladığın her
      beceri eşleştirmede <b>kanıt</b> olur ve daha çok ilan değerlendirilebilir hâle gelir.</p>

    <div class="drop" id="drop">
      <span class="ic">↑</span>
      <div class="t">CV'ni buraya bırak ya da tıkla</div>
      <div class="d">Yalnızca PDF · en fazla 10 MB · dosya sunucuda saklanmaz</div>
      <input type="file" id="cvFile" accept="application/pdf" style="display:none">
    </div>

    ${cv?`<div class="cvstat">
      <div><b>${cv.page_count??'—'}</b>sayfa</div>
      <div><b>${cv.char_count??'—'}</b>karakter</div>
      <div><b class="ph">${(cv.suggestions||[]).length}</b>öneri</div>
    </div>
    ${cv.note?`<div class="notice" style="margin-top:10px">${rich(cv.note)}</div>`:''}
    ${(cv.discarded_sensitive||[]).length?`<div class="notice" style="margin-top:10px">
      <b>Atılan hassas alanlar:</b> ${cv.discarded_sensitive.map(esc).join(', ')}.
      Bunlar hiç okunmadı ve saklanmadı — doğum tarihi, medeni hâl gibi alanlar
      eşleştirmede kullanılmaz (D-013).</div>`:''}`:''}

    ${sug.length?dh(`onayını bekleyen öneriler [${sug.length}]`)+
      `<div class="notice" style="margin-bottom:11px">Bunlar CV'nde <b>geçtiği için</b>
        öneriliyor; profiline <b>henüz yazılmadı</b>.</div>`+
      sug.map(s=>`<div class="sug" data-sk="${esc(s.key)}">
        <div class="nm">${esc(s.label)}${s.matched_on?`<i>CV'de: "${esc(s.matched_on)}"</i>`:''}</div>
        ${s.asks_years?`<input class="yr" type="number" min="0" max="50" step="0.5"
          placeholder="yıl" value="${s.years??''}" data-sy="${esc(s.key)}">`:''}
        <button class="ok" data-ok="${esc(s.key)}">ONAYLA</button>
        <button class="no" data-no="${esc(s.key)}" title="Reddet">×</button>
      </div>`).join(''):''}

    ${dh(`profilindeki beceriler [${facts.length}]`)}
    ${facts.length?`<div>${facts.map(f=>`<span class="fact">
        ${esc(f.label)}${f.years!=null?`<span class="yr">${f.years} YIL</span>`:''}
        <span class="x" data-rm="${esc(f.key)}">×</span></span>`).join('')}</div>`
      :`<p style="color:var(--ink-3); font-size:13px">Henüz beceri yok. CV yükle
         ya da <b>yeni profil</b> akışındaki beceri matrisinden seç.</p>`}
  `;
}

function wirePanel(){
  const drop=$("#drop"), inp=$("#cvFile");
  if(drop&&inp){
    drop.onclick=()=>inp.click();
    inp.onchange=()=>inp.files[0]&&uploadCV(inp.files[0]);
    /* Sürükle-bırak: tarayıcının kendi "dosyayı aç" davranışı bastırılmalı,
       yoksa PDF sekmede açılır ve yükleme hiç olmaz. */
    ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{
      e.preventDefault(); drop.classList.add("hot");}));
    ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{
      e.preventDefault(); drop.classList.remove("hot");}));
    drop.addEventListener("drop",e=>{
      const f=e.dataTransfer?.files?.[0]; if(f) uploadCV(f);});
  }
  document.querySelectorAll("[data-ok]").forEach(b=>b.onclick=async()=>{
    const key=b.dataset.ok;
    const yin=document.querySelector(`[data-sy="${CSS.escape(key)}"]`);
    const years=yin&&yin.value!==""?parseFloat(yin.value):null;
    b.disabled=true; b.textContent="…";
    try{
      S.profile=await jpost("/profile/facts",{key,years});
      await refreshAfterProfileChange();
    }catch(e){ alert("Eklenemedi: "+e.message); paintPanel(); }
  });
  document.querySelectorAll("[data-no]").forEach(b=>b.onclick=()=>{
    /* Reddetme yalnızca görünümden düşer — sunucuda "reddedildi" diye bir
       durum yok, bir sonraki CV yüklemesinde yeniden önerilebilir. */
    const key=b.dataset.no;
    S.profile={...S.profile,
      pending_cv_suggestions:(S.profile.pending_cv_suggestions||[]).filter(s=>s.key!==key)};
    paintPanel();
  });
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{
    try{
      S.profile=await api(`/profile/facts/${encodeURIComponent(b.dataset.rm)}`,{method:"DELETE"});
      await refreshAfterProfileChange();
    }catch(e){ alert(e.message); }
  });
}

/* Profil değişti: feed'i ve profil listesini (beceri sayacı) yenile. Paneli
   AÇIK bırakır — kullanıcı sırayla birkaç öneri onaylıyor olabilir. */
async function refreshAfterProfileChange(){
  paintPanel();
  try{
    S.profiles=await api("/profiles");
    await loadFeed();
    const open=$("#pnl")?.classList.contains("on");
    render();
    if(open){ $("#scrim").classList.add("on"); $("#pnl").classList.add("on");
      $("#scrim").onclick=closePanel; paintPanel(); }
  }catch(e){ /* feed yenilenemese de profil değişikliği kaydedildi */ }
}

async function uploadCV(file){
  const drop=$("#drop");
  if(!/\.pdf$/i.test(file.name)){ alert("Yalnızca PDF kabul ediliyor."); return; }
  drop.innerHTML=`<span class="ic">⟳</span><div class="t">okunuyor…</div>
    <div class="d">${esc(file.name)}</div>`;
  const fd=new FormData(); fd.append("file",file);
  try{
    const r=await fetch(API+"/profile/cv",{method:"POST",body:fd});
    const body=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(body.detail||r.statusText);
    S.cv=body;
    S.profile=await api("/profile");
    paintPanel();
  }catch(e){
    S.cv=null; paintPanel();
    alert("CV okunamadı: "+e.message);
  }
}

/* ---------------- detay ---------------- */
function detailMarkup(){
  return `<div class="scrim" id="scrim"></div><aside class="detail" id="detail"></aside>
    <aside class="pnl" id="pnl"></aside>`;
}
async function openDetail(id){
  const sc=$("#scrim"), d=$("#detail");
  d.innerHTML=`<div class="load" style="min-height:auto;padding:70px 0"><div class="radar"></div></div>`;
  sc.classList.add("on"); d.classList.add("on"); sc.onclick=closeDetail;
  try{ const j=await api("/jobs/"+encodeURIComponent(id)); d.innerHTML=detailBody(j); wireDetail(j); }
  catch(e){ d.innerHTML=`<button class="detail-close" onclick="closeDetail()">×</button>
    <p style="margin-top:50px">${esc(e.message)}</p>`; }
}
function closeDetail(){ $("#scrim").classList.remove("on"); $("#detail").classList.remove("on"); }

function detailBody(j){
  const bc=j.band?('b-'+j.band):'';
  const lit=GAUGE[j.band]||0;
  const line=(x,cls,ic)=>`<div class="lrow ${cls}"><span class="ic">${ic}</span>
    <div><div>${esc(x.text)}</div>${x.evidence?`<div class="ev">${esc(x.evidence)}</div>`:''}</div></div>`;
  const fair=(j.fairness_flags||[]);
  const dh=t=>`<div class="dhead"><span class="t">// ${t}</span><span class="ln"></span></div>`;
  return `<button class="detail-close" onclick="closeDetail()">×</button>
    <div class="dband ${bc}">
      ${j.band?`<span class="gauge">${[1,2,3,4].map(i=>`<i class="${i<=lit?'on':''}"></i>`).join('')}</span>`:''}
      <span class="bl">${esc(j.band_label||'Değerlendirilemedi')}${j.confidence_label?' · GÜVEN: '+esc(j.confidence_label.toUpperCase()):''}</span>
    </div>
    <h2>${esc(j.title)}</h2>
    <div class="emp"><b>${esc(j.employer)}</b>${j.city?' · '+esc(j.city):''}${j.salary_text?' · '+esc(j.salary_text):''}</div>
    ${j.worth_applying?`<div class="notice" style="margin-top:16px; border-left-color:var(--ph)">${esc(j.worth_applying)}</div>`:''}
    ${j.met?.length?dh(`karşıladıkların [${j.met.length}]`)+`<div class="ledger">${j.met.map(x=>line(x,'met','✓')).join('')}</div>`:''}
    ${j.unmet?.length?dh(`karşılamadıkların [${j.unmet.length}]`)+`<div class="ledger">${j.unmet.map(x=>line(x,'unmet','✕')).join('')}</div>`:''}
    ${j.unknown?.length?dh(`bilinmeyenler [${j.unknown.length}]`)+`<div class="ledger">${j.unknown.map(x=>line(x,'unk','?')).join('')}</div>`:''}
    ${fair.length?dh('adalet uyarısı')+`
      <div class="notice ${fair.some(f=>f.severity==='hard')?'err':''}">Bu bir hukuki görüş <b>değildir</b>; bazı şartlar yasal olabilir.
      <ul style="margin:8px 0 0 18px">${fair.map(f=>`<li>${esc(f.note)} <span class="mut">"${esc(f.evidence)}"</span></li>`).join('')}</ul>
      ${fair.some(f=>f.severity==='hard')?`<div style="margin-top:8px"><a href="https://www.tihek.gov.tr" target="_blank" rel="noopener">TİHEK'e başvurabilirsin ↗</a></div>`:''}</div>`:''}
    ${j.description?dh('ilan metni')+`<div class="desc" id="desc">${descHTML(j.description)}</div>
      <button class="btn-ghost" id="descToggle" style="padding:10px 0">tamamını göster ▾</button>`:''}
    <div class="apply"><a class="btn" href="${esc(j.url)}" target="_blank" rel="noopener noreferrer">ilana git ↗</a></div>
    <p class="mut" style="font-size:12px">Başvuru ilanın kendi sayfasında yapılır. Biz aracı değiliz; başvurunu görmüyoruz.</p>
    ${j.disclaimer?`<p class="mut" style="font-size:11.5px; margin-top:14px">${esc(j.disclaimer)}</p>`:''}`;
}
function descHTML(t){
  return String(t||"").split("\n").map(l=>{l=l.trim(); if(!l) return "";
    if(l.startsWith("## ")) return `<h5>${esc(l.slice(3))}</h5>`;
    return `<div>${esc(l)}</div>`;}).join("");
}
function wireDetail(){
  const t=$("#descToggle"); if(t) t.onclick=()=>{const d=$("#desc"); d.classList.toggle("open");
    t.textContent=d.classList.contains("open")?"daha az göster ▴":"tamamını göster ▾";};
}
document.addEventListener("keydown",e=>{if(e.key==="Escape") closeDetail();});

boot();
</script>
</body>
</html>
